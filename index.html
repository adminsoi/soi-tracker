<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AOG Tracker — SOI Aviation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap">
<script src="/chart.umd.min.js"></script>
<style>
  /* Look and feel follows "The Daily Edit": paper, serif headings, sage and rose. */
  :root {
    --paper: #f8f3eb; --card: #fffdfa; --ink: #3f352c; --muted: #948575; --line: #e6dccc;
    --pink: #edcfda; --sage: #78846c; --forest: #354936; --soft: #eee8da; --rose-ink: #633f47;
    --danger: #a25e5e; --side: #efe9dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px 'DM Sans', system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 9px 14px; }
  button:hover { background: var(--soft); }
  button:disabled { cursor: not-allowed; opacity: .5; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #b75d80; outline-offset: 3px; }
  a { color: var(--forest); text-decoration: none; }
  h1, h2, h3 { font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; }
  h1 { font-size: 50px; line-height: 1.05; margin: 12px 0 14px; letter-spacing: -1.5px; }
  h2 { font-size: 27px; margin: 8px 0 16px; }
  h3 { font-size: 22px; margin: 0 0 14px; }
  .eyebrow, #breadcrumb { font-size: 9px; letter-spacing: 2px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .small-note { font-size: 11px; line-height: 1.7; color: var(--muted); }
  .pink { background: #f6dce5; border-color: #dca4b8; color: #864b65; }
  .primary { background: var(--forest); color: #fff; border-color: var(--forest); }
  .primary:hover { background: #46634a; }
  .text-button { border: 0; padding: 0; font-size: 11px; text-decoration: underline; text-underline-offset: 3px; color: #aa6882; background: none; }
  .text-button:hover { background: none; }

  /* Sidebar */
  aside { width: 222px; position: fixed; inset: 0 auto 0 0; padding: 32px 22px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 5; }
  .brand { font: 36px/.95 'Libre Caslon Display', Georgia, serif; color: var(--ink); letter-spacing: -1px; }
  .brand em { font-style: italic; }
  .brand span { display: block; margin-top: 17px; font: 8px 'DM Sans', sans-serif; letter-spacing: 2px; color: var(--muted); }
  nav { margin-top: 26px; flex: 1 1 auto; min-height: 0; overflow-y: auto; margin-right: -12px; padding-right: 12px; }
  nav .nav-group { font-size: 9px; letter-spacing: 2px; color: var(--muted); margin: 22px 10px 8px; }
  nav a { display: flex; gap: 12px; align-items: center; padding: 11px 12px; margin: 3px 0; color: #756657; font-size: 13px; border-radius: 6px; }
  nav a:hover { background: var(--soft); }
  nav a.active { background: var(--pink); color: var(--rose-ink); }
  nav a .ic { width: 19px; font-size: 15px; text-align: center; }
  nav a .badge { margin-left: auto; }
  .sidebar-foot { margin-top: auto; padding: 18px 7px 0; font-size: 11px; color: var(--sage); border-top: 1px solid var(--line); }
  .sidebar-foot strong { display: block; color: var(--ink); font-size: 13px; margin: 6px 0 2px; }
  .sidebar-foot small { display: block; color: var(--muted); font-size: 10px; line-height: 1.6; }
  .sidebar-foot button { margin-top: 10px; padding: 6px 12px; font-size: 11px; }
  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--sage); margin-right: 5px; }
  .live-dot.off { background: var(--danger); }
  .live-dot.busy { background: #c9a35c; }

  /* Main */
  main { margin-left: 222px; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { height: 78px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 44px; gap: 12px; }
  .header-tools { display: flex; gap: 10px; align-items: center; }
  .header-tools a { border: 1px solid var(--line); border-radius: 7px; padding: 9px 14px; color: var(--ink); }
  .header-tools a:hover { background: var(--soft); }
  #view { padding: 34px 44px 60px; max-width: 1550px; width: 100%; margin: 0 auto; flex: 1; }
  footer.foot { border-top: 1px solid var(--line); padding: 20px 44px; font-size: 9px; letter-spacing: 1px; color: var(--muted); display: flex; justify-content: space-between; }

  .intro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
  .intro > div:first-child { flex: 1 1 380px; min-width: 0; }
  .intro p { color: var(--muted); line-height: 1.7; font-size: 12px; margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .card + .card { margin-top: 18px; }
  .card-label { font-size: 9px; font-weight: 700; letter-spacing: 1.7px; color: #817567; text-transform: uppercase; }
  .summary-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 20px 0; }
  .summary-cards.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .metric { padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .metric strong { display: block; font: clamp(24px, 2.6vw, 34px) 'Libre Caslon Display', Georgia, serif; margin: 4px 0; overflow-wrap: anywhere; }
  .metric small { color: var(--muted); font-size: 10px; }
  .metric.alert strong { color: var(--danger); }
  .section-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 30px 0 13px; }
  .section-title h2 { margin: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .chart-wrap { position: relative; height: 230px; }

  /* Company switcher + department tabs */
  .co-wrap { display: grid; gap: 6px; justify-items: end; flex: 0 1 auto; max-width: 100%; margin-left: auto; }
  .cos { display: inline-flex; gap: 4px; padding: 4px; background: var(--soft); border-radius: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .co { border: 0; border-radius: 7px; padding: 9px 18px; font-size: 13px; font-weight: 600; color: #756657; }
  .co:hover { background: #e4dccb; }
  .co.active { background: var(--forest); color: #fff; }
  .co.active .badge { background: #fff; color: var(--forest); }
  .badge { display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 9px; font-size: 9px; background: var(--pink); color: var(--rose-ink); font-weight: 600; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 4px 0 6px; }
  .tab { border: 0; border-radius: 8px 8px 0 0; padding: 11px 16px; font-size: 12px; color: #756657; }
  .tab:hover { background: var(--soft); }
  .tab.active { background: var(--card); color: var(--rose-ink); font-weight: 600; box-shadow: inset 0 -2px #d1a1b3; }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; padding: 3px; background: var(--soft); border-radius: 9px; }
  .seg button { border: 0; border-radius: 7px; padding: 7px 12px; font-size: 11px; color: #756657; }
  .seg button.active { background: var(--card); color: var(--rose-ink); font-weight: 600; box-shadow: 0 1px 2px #0000000f; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
  .links a { font-size: 11px; border: 1px solid var(--line); padding: 7px 10px; border-radius: 5px; background: var(--card); }
  .subbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

  /* Tables */
  .table-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 20px 0 12px; }
  .table-toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); }
  .table-toolbar .primary { margin-left: auto; }
  .table-wrap { overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th { text-align: left; white-space: nowrap; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 13px 10px; background: #f2ede3; border-bottom: 1px solid var(--line); font-weight: 600; }
  td { padding: 7px 6px; border-bottom: 1px solid #efe8dc; vertical-align: middle; line-height: 1.5; }
  tbody tr:last-child td { border-bottom: 0; }
  .wide { min-width: 1080px; }
  .wide td:first-child { min-width: 170px; }
  .narrow { min-width: 720px; }
  .plain td { padding: 12px 14px; }
  .plain th { padding: 13px 14px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  td.empty { text-align: left; padding-left: 24px; }
  .fb-in { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 7px 8px; font-size: 12px; min-width: 90px; }
  .fb-in:hover:not(:disabled) { border-color: var(--line); }
  .fb-in:focus { border-color: #dca4b8; background: #fff; outline: none; }
  .fb-in:disabled { cursor: default; -webkit-text-fill-color: var(--ink); opacity: 1; }
  select.fb-in { min-width: 115px; cursor: pointer; }
  select.fb-in:disabled { appearance: none; }
  input.fb-in[type=date] { min-width: 132px; }
  .fb-num { text-align: right; min-width: 100px; }
  /* Notes: wide, readable, and tall enough to show everything (scrolls only past ~20 lines). */
  .fb-notes { resize: vertical; overflow-y: auto; line-height: 1.55; min-width: 260px; display: block; font-size: 12.5px; white-space: pre-wrap; max-height: 440px; }
  .fb-notes:not(:placeholder-shown) { background: #fbf8f3; border-left: 3px solid #e6d6c3; }
  .fb-notes:focus { border-left-color: #dca4b8; }
  .notes-cell { width: 30%; min-width: 270px; }
  .static { padding: 7px 8px; display: block; }
  .static.dim { color: var(--muted); }
  .center { text-align: center; }
  .check { accent-color: var(--sage); width: 17px; height: 17px; cursor: pointer; }
  .toggle { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 14px; font-weight: 700; line-height: 1; }
  .toggle.yes { background: #eef0e8; color: #697957; border-color: #c7cdbb; }
  .toggle.no { background: #f6e1e8; color: #a96b82; border-color: #e3bccb; }
  .toggle:disabled { opacity: 1; cursor: default; }
  .del { border: 0; padding: 4px 8px; font-size: 16px; color: var(--muted); line-height: 1; }
  .del:hover { color: var(--danger); background: transparent; }
  .row-tools { white-space: nowrap; text-align: right; }
  .row-tools .text-button { margin-right: 8px; }
  .st, .st-select { display: inline-block; padding: 3px 9px; border-radius: 9px; font-size: 11px; font-weight: 600; border: 1px solid transparent; }
  .st-select { cursor: pointer; padding: 4px 8px; font-family: inherit; }
  .st-new { background: #e6ebf3; color: #3f5f8f; } .st-progress { background: #f7e6cc; color: #8a5a14; } .st-done { background: #e3eedf; color: #4c6b3c; }
  .st-dup { background: #ecebe8; color: #6d655c; }
  .dup-hint, .dup-note { display: block; margin-top: 6px; font-size: 11px; padding: 4px 8px; border-radius: 6px; }
  .dup-hint { background: #fff4df; color: #8a5a14; } .dup-note { background: #f0eeea; color: #6d655c; }
  .dup-hint .text-button, .dup-note .text-button { font-size: 11px; margin-left: 4px; }
  .hint-badge { background: #fff4df; color: #8a5a14; }
  .bulk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
  .bulk-bar .grow { flex: 1; }
  .st-btn { border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  tr.picked td { background: #fbf1e3; }
  .prio { display: inline-block; padding: 2px 8px; border-radius: 9px; font-size: 10px; font-weight: 600; letter-spacing: .3px; }
  .prio-P1 { background: #f6dcdb; color: #a03d3a; } .prio-P2 { background: #f7e6cc; color: #8a5a14; }
  .prio-P3 { background: #e6ebf3; color: #3f5f8f; } .prio-P4 { background: var(--soft); color: var(--muted); }
  .prio-none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  .itr-issue { max-width: 460px; white-space: pre-wrap; line-height: 1.5; }
  .itr-note { display: block; margin-top: 6px; padding: 6px 9px; background: #fbf8f3; border-left: 3px solid #e6d6c3; border-radius: 4px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; max-width: 460px; color: var(--ink); }
  .itr-person { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  /* Quarterly business review */
  .qbr { display: grid; gap: 18px; }
  .qbr-panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .qbr-h { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; } .qbr-h h3 { font: 22px/1.2 'Libre Caslon Display', Georgia, serif; margin: 0; }
  .qbr-num { width: 30px; height: 30px; border-radius: 50%; background: #1f2a5c; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .qbr-tile strong { font-size: clamp(22px, 2.3vw, 30px); } .qbr-tile .eyebrow { margin-top: 2px; } .qbr-tile small { display: block; margin-top: 6px; }
  .qbr-panel .summary-cards { margin: 8px 0 12px; } .qbr-panel .grid-2 { gap: 16px; margin-bottom: 12px; }
  .qbr-missing { background: #fff6ec; border: 1px solid #f0d9b8; border-radius: 8px; padding: 8px 12px; margin: 0 0 10px; line-height: 1.5; }
  .qbr-missing > div + div { margin-top: 3px; } .qbr-err { font-family: Menlo, monospace; font-size: 11.5px; word-break: break-word; }
  .qbr-meter { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .qbr-big { font: 30px/1.1 'Libre Caslon Display', Georgia, serif; margin: 4px 0 10px; }
  .qbr-bar { position: relative; height: 14px; background: var(--soft); border-radius: 7px; }
  .qbr-bar span { position: absolute; left: 0; top: 0; bottom: 0; background: #3f6ba8; border-radius: 7px; }
  .qbr-bar i { position: absolute; right: 0; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .qbr-scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  .qbr-addrej { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; } .qbr-addrej input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); font: inherit; font-size: 12.5px; flex: 1; min-width: 140px; }
  /* Performance */
  .perf-alerts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #fff6ec; border: 1px solid #f0d9b8; border-radius: 12px; padding: 12px 16px; margin: 16px 0 18px; }
  .perf-alerts > b { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #8a5a14; margin-right: 4px; }
  .perf-alert { display: inline-flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
  .tier { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .3px; }
  .tier-0 { background: var(--soft); color: var(--muted); } .tier-1 { background: #fbecc8; color: #7c5a10; } .tier-2 { background: #f7d6b4; color: #8a4512; } .tier-3 { background: #f2c4c2; color: #9b2c28; }
  .strikes { display: inline-flex; gap: 3px; vertical-align: middle; } .strikes i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
  .strikes i.on { background: #c0504d; }
  .perf-entry { border-left: 3px solid var(--line); padding: 10px 0 10px 14px; margin-bottom: 6px; }
  .perf-entry.warning { border-left-color: #c0504d; } .perf-entry.cleared { border-left-color: #b9b2a8; opacity: .75; }
  .perf-entry .meta { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
  .perf-entry .txt { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; }
  .perf-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .perf-file { display: inline-flex; gap: 6px; align-items: center; background: var(--soft); border-radius: 7px; padding: 4px 8px; font-size: 12px; }
  .perf-file button { border: 0; background: none; padding: 0 2px; cursor: pointer; color: var(--rose-ink); font-size: 12px; }
  .ladder { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .rung { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--soft); color: var(--muted); }
  .rung.on { background: #f7d6b4; color: #8a4512; } .rung.end { background: none; border: 1px dashed var(--line); font-weight: 500; }
  .flag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 600; background: var(--soft); color: var(--muted); margin: 1px 2px 1px 0; }
  .flag.risk { background: #f6dcdb; color: #9b2c28; }
  .risk-grid { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; } .risk-grid label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .juris { background: #f4f1ec; border-radius: 9px; padding: 10px 14px; font-size: 12.5px; line-height: 1.5; } .juris div { margin: 2px 0; }
  .nstate { font-weight: 600; padding: 1px 7px; border-radius: 6px; font-size: 10.5px; } .nstate.yes { background: #e3eedf; color: #4c6b3c; }
  .nstate.no, .nstate.review { background: #fbecc8; color: #7c5a10; } .nstate.mis { background: #f6dcdb; color: #9b2c28; } .nstate.old { background: var(--soft); color: var(--muted); }
  .perf-entry.note-yes { border-left-color: #78846c; } .perf-entry.note-mis { border-left-color: #c0504d; } .perf-entry.note-no, .perf-entry.note-review { border-left-color: #d9a441; }
  .perf-table tr.picked td { background: #fbf1e3; }
  .pcards { display: grid; gap: 10px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .pcard.due { border-color: #ecc3b5; } .pcard.open { box-shadow: 0 2px 10px #0000000d; }
  .pcard-head { display: grid; grid-template-columns: minmax(150px, 1.4fr) auto minmax(90px, .8fr) minmax(130px, 1fr) minmax(120px, 1.6fr) 18px; gap: 12px; align-items: center; width: 100%;
    text-align: left; background: none; border: 0; padding: 14px 18px; cursor: pointer; font: inherit; color: var(--ink); }
  .pcard-head:hover { background: var(--soft); }
  .pc-name { display: flex; flex-direction: column; gap: 2px; } .pc-chev { color: var(--muted); }
  .pcard-body { border-top: 1px solid var(--line); padding: 16px 20px 20px; }
  .step-card > summary, .step-later { display: flex; align-items: center; gap: 10px; }
  .step-later { padding: 12px 16px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .step-card.later { background: #faf8f5; } .step-card.next { border-color: #ecc3b5; }
  .step-dot { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: var(--soft); color: var(--muted); flex: none; }
  .step-dot.on { background: #4c6b3c; color: #fff; } .step-dot.next { background: #c0504d; color: #fff; }
  .step-card > summary::before { display: none; }
  @media (max-width: 900px) { .pcard-head { grid-template-columns: 1fr auto; } .pc-count, .pc-next, .pc-flags { grid-column: 1 / -1; } .pc-chev { grid-row: 1; grid-column: 2; } }
  .rs-modal { position: fixed; inset: 0; background: rgba(40, 32, 26, .35); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .rs-card { background: var(--card); border-radius: 14px; padding: 22px 24px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
  .rs-card h3 { font: 22px/1.2 'Libre Caslon Display', Georgia, serif; margin: 0 0 8px; }
  .rs-card.rs-wide { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; }
  .rs-card.rs-wide textarea { min-height: 0; }
  .rs-card.rs-wide .nb-field { margin-bottom: 10px; }
  .rs-card .opt { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted, #8a8172); }
  .rs-preview { margin-top: 12px; padding: 12px 14px; border: 1px solid #e6dfd3; border-radius: 6px; background: #fff; font: 13px/1.5 "Segoe UI", Arial, sans-serif; color: #222; }
  .rs-preview p { margin: 0 0 8px; }
  .rs-pv-head { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a8172; margin-bottom: 4px; }

        <a href="https://claude.ai/new" target="_blank" rel="noopener noreferrer" title="Opens claude.ai in a new tab">Claude ↗</a>
        <button type="button" class="pink" id="quickAdd">+ Add row</button>
      </div>
    </header>
    <div id="view"></div>
    <footer class="foot">SOI AVIATION · DEPARTMENT TASK TRACKER <span>Internal use only · Saved to the SOI server</span></footer>
  </main>
</div>

<div id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  // ---------- Constants ----------
  var TOKEN_KEY = "soi_tracker_token";
  var COMPANY_KEY = "soi_tracker_company";
  var ALL = "AOG"; // "All companies" (full-access accounts with more than one company)
  var COMPANY_ORDER = ["SOI Aviation", "CAS", "RedSun Aviation", "NanoTech Aviation"];
  var COMPANY_SHORT = { "SOI Aviation": "SOI", "CAS": "CAS", "RedSun Aviation": "RedSun", "NanoTech Aviation": "Nano" };
  // Tab order follows the design; anything else the server lists comes after.
  var DEPT_ORDER = ["Procurement", "Purchasing", "Warehouse", "IT", "Administrative", "HR", "Accounting & Finance", "Business Development", "US Government"];
  var DEPT_SHORT = { "Administrative": "Admin", "Accounting & Finance": "Finance", "Business Development": "Business Dev" };
  var DEPT_TAGLINE = {
    "Business Development": "Pipeline analytics from Pentagon — RFQs, quotes and orders — plus business development projects.",
    "Procurement": "Parts, platforms and customers, plus RFQs and quotes from Pentagon.",
    "Purchasing": "Parts, platforms and customers, plus sales and purchase orders from Pentagon.",
    "Warehouse": "Parts, platforms and customers moving through the warehouse.",
    "Accounting & Finance": "Bank balances, payments to approve, expected receipts and tasks."
  };
  // Procurement / Purchasing / Warehouse use part rows; everything else is projects with sub-tasks.
  var OPS_DEPTS = ["Procurement", "Purchasing", "Warehouse"];
  var DEPARTMENTS_FALLBACK = ["Procurement", "Purchasing", "IT", "HR", "Business Development", "US Government", "Warehouse", "Administrative", "Accounting & Finance"];

  // Quick links per department. The department's Claude project (set in
  // /admin.html) is added automatically.
  var DEPARTMENT_RESOURCES = {
    "Procurement": [
      { label: "ILS", url: "https://www.ilsmart.com" },
      { label: "PartsBase", url: "https://www.partsbase.com" },
      { label: "Claude", url: "https://claude.ai" }
    ]
  };

  // Fallback copy of the Pentagon views; the real list comes from
  // /api/pentagon-views (pentagonViews.js on the server).
  var PENTAGON_VIEWS = {
    "Procurement": [
      { id: "rfqs", label: "RFQs", docLabel: "RFQ", queryName: "dashboards.rfq", layout: "doc", tasks: true,
        fields: { key: "RFQ_NO", part: "PN", party: "ACCOUNT_NAME", partyLabel: "Customer", person: "OURCONTACT", due: "DUE_DATE", notes: "NOTES" } },
      { id: "quotes", label: "Quotes", docLabel: "Quote", queryName: "dashboards.quotes", layout: "doc", tasks: true,
        fields: { key: "QUOTE_NO", part: "PN", party: "ACCOUNT_NAME", partyLabel: "Customer", person: "OURCONTACT", due: "DUE_DATE", notes: "NOTES" } }
    ],
    "Purchasing": [
      { id: "sales_orders", label: "Sales Orders", docLabel: "SO", queryName: "dashboards.so", layout: "doc", tasks: true,
        fields: { key: "SO_NO", part: "PN", party: "ACCOUNT_NAME", partyLabel: "Customer", person: "OURCONTACT", due: "DUE_DATE", notes: "NOTES" } },
      { id: "purchase_orders", label: "Purchase Orders", docLabel: "PO", queryName: "dashboards.po", layout: "doc", tasks: true,
        fields: { key: "PO_NO", part: "PN", party: "ACCOUNT_NAME", partyLabel: "Vendor", person: "OURCONTACT", due: "DUE_DATE", notes: "NOTES" } }
    ],
    "Accounting & Finance": [
      { id: "invoices", label: "Invoices", docLabel: "Invoice", queryName: "dashboards.invoice_search", layout: "raw" }
    ]
  };
  var FIELD_GUESSES = {
    key: [["RFQ_NO", "QUOTE_NO", "QT_NO", "PO_NO", "SO_NO", "DOC_NO", "RFQ_NUMBER", "DOC_NUMBER"], ["_NO", "NUMBER"]],
    part: [["PN", "PART_NUMBER", "PART_NO", "PARTNO"], ["PART"]],
    party: [["ACCOUNT_NAME", "CUSTOMER", "CUSTOMER_NAME", "VENDOR", "VENDOR_NAME", "COMPANY_NAME"], ["ACCOUNT_NAME", "CUSTOMER", "VENDOR", "COMPANY"]],
    person: [["OURCONTACT", "BUYER", "SALESPERSON", "ENTERED_BY"], ["OURCONTACT", "BUYER", "SALES", "ENTERED_BY"]],
    due: [["DUE_DATE", "DATE_DUE", "REQUIRED_DATE"], ["DUE"]],
    notes: [["NOTES", "REMARKS", "COMMENTS"], ["NOTE", "REMARK", "COMMENT"]]
  };

  // ---------- State ----------
  var me = null;
  var DEPARTMENTS = [];
  var activeCompany = null;
  var page = "departments";        // departments | overview | mentions | inbox | calendar | global
  var activeDept = null;
  var subView = {};                // dept -> "tasks" | "projects" | "finance" | … | Pentagon view id
  var tasks = [];                  // tasks made in the tracker
  var cards = [];                  // Pentagon rows as task-shaped cards
  var pentagonErrors = [];
  var drafts = [];                 // new rows not saved yet (need a name or part number first)
  var showSource = "all";          // all | tasks | <Pentagon view id>
  var showPerson = "";
  var addCompany = null;           // which company "+ Add row" uses on the All view
  var claudeProjects = {};
  var deptDefaults = {};           // department -> default person (set in /admin.html)
  var usersByCompany = {};         // company -> [usernames] (managers only)
  var finance = null;              // { company, data } or { company, error }
  var loadedOnce = false;
  var pollTimer = null;
  var renderPending = false;
  var focusAfter = null;
  var charts = [];
  // Local date (not UTC), so "today" and "overdue" don't flip early in the evening.
  var today = (function (d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })(new Date());

  // ---------- Helpers ----------
  function $(s) { return document.querySelector(s); }
  function E(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function sameUser(a, b) { return String(a || "").toLowerCase() === String(b || "").toLowerCase(); }
  function token() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
  function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(String(s).slice(0, 10) + "T00:00:00");
    return isNaN(d) ? String(s) : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function fmtTime(s) {
    if (!s) return "";
    var d = new Date(s);
    return isNaN(d) ? String(s) : d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function money(n) { n = Number(n); return isNaN(n) ? "—" : n.toLocaleString("en-US", { style: "currency", currency: "USD" }); }
  function sum(arr, k) { return arr.reduce(function (s, r) { return s + (Number(r[k]) || 0); }, 0); }
  function isDone(t) { return t.status === "done"; }
  function isOverdue(t) { return !!t.dueDate && !isDone(t) && t.dueDate < today; }
  function shortCo(c) { return c === ALL ? "All" : (COMPANY_SHORT[c] || c); }
  function shortDept(d) { return DEPT_SHORT[d] || d; }
  function isOps(d) { return OPS_DEPTS.indexOf(d) !== -1; }
  function isCard(t) { return t.source === "pentagon"; }
  // Tasks are quick one-off items; projects are long-term and hold sub-tasks.
  // Older rows have no kind: Procurement / Purchasing / Warehouse rows and
  // IT form tickets are tasks, everything else was a project.
  function itemKind(t) {
    if (t.parentId) return "sub";
    if (t.kind === "task" || t.kind === "project") return t.kind;
    if (isCard(t) || t.source === "form" || isOps(t.department)) return "task";
    return "project";
  }
  function safeLink(url) {
    try { var u = new URL(url); return u.protocol === "https:" || u.protocol === "http:" ? u.toString() : null; } catch (e) { return null; }
  }
  function cellText(v) { return v === null || v === undefined ? "" : String(v); }

  var toastTimer = null;
  function toast(msg, isError) {
    var el = $("#toast");
    el.textContent = msg;
    el.className = (isError ? "error " : "") + "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ""; }, 3400);
  }
  function setSync(state, text) {
    $("#syncDot").className = "live-dot" + (state === "off" ? " off" : state === "busy" ? " busy" : "");
    $("#syncText").textContent = text;
  }

  function api(path, options) {
    options = options || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    var t = token();
    if (t) headers.Authorization = "Bearer " + t;
    return fetch(path, Object.assign({}, options, { headers: headers })).then(function (res) {
      if (res.status === 401) { signOut(); throw new Error("Session expired"); }
      if (res.status === 204) return null;
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || "Request failed");
        return data;
      });
    });
  }

  // ---------- Who can do what (the server enforces all of this) ----------
  function isManager() { return !!(me && (me.fullAccess || me.manager)); }
  function canEditTask(t) {
    if (isCard(t)) return isManager();
    return isManager() || sameUser(t.createdBy, me.username);
  }
  function visibleDepartments() {
    var list = me.fullAccess ? DEPARTMENTS.slice() : me.departments.slice();
    return list.sort(function (a, b) {
      var ia = DEPT_ORDER.indexOf(a), ib = DEPT_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
  }
  function myCompanies() {
    return me.companies.slice().sort(function (a, b) {
      var ia = COMPANY_ORDER.indexOf(a), ib = COMPANY_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
  }
  function canUseAll() { return me.fullAccess && me.companies.length > 1; }
  function hasSOI() { return me.companies.indexOf("SOI Aviation") !== -1; }
  function canSeeFinance() {
    return activeCompany !== ALL && (me.fullAccess || me.departments.indexOf("Accounting & Finance") !== -1);
  }
  function pentagonViewsFor(dept) {
    var soi = activeCompany === "SOI Aviation" || (activeCompany === ALL && hasSOI());
    return soi ? (PENTAGON_VIEWS[dept] || []) : [];
  }

  // ---------- Sign in / out ----------
  function showLogin() {
    $("#loginScreen").style.display = "flex";
    $("#app").classList.add("app-hidden");
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  function signOut() { clearToken(); me = null; showLogin(); }
  $("#logoutBtn").addEventListener("click", signOut);

  $("#loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = $("#loginMsg");
    msg.textContent = "";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("#li-user").value.trim(), password: $("#li-pass").value })
    }).then(function (res) {
      return res.json().then(function (data) { if (!res.ok) throw new Error(data.error || "Sign-in failed"); return data; });
    }).then(function (data) {
      setToken(data.token);
      me = data;
      $("#li-pass").value = "";
      onSignedIn();
    }).catch(function (err) { msg.textContent = err.message; });
  });

  function onSignedIn() {
    me.departments = me.departments || [];
    if (me.performance) setTimeout(loadPerf, 1500);
    var saved = null;
    try { saved = localStorage.getItem(COMPANY_KEY); } catch (e) {}
    var ok = saved && ((saved === ALL && canUseAll()) || me.companies.indexOf(saved) !== -1);
    activeCompany = ok ? saved : myCompanies()[0];
    $("#whoName").textContent = me.username;
    $("#whoRole").textContent = (me.fullAccess ? "Full access" : me.departments.join(", ")) + (isManager() ? " · Manager" : "");
    $("#loginScreen").style.display = "none";
    $("#app").classList.remove("app-hidden");
    api("/api/departments").then(function (d) { DEPARTMENTS = d; }).catch(function () { DEPARTMENTS = DEPARTMENTS_FALLBACK; }).then(function () {
      var depts = visibleDepartments();
      if (!activeDept || depts.indexOf(activeDept) === -1) activeDept = depts[0] || null;
      readHash();
      render();
      refresh();
      if (!pollTimer) pollTimer = setInterval(function () { if (!document.hidden) refresh(); }, POLL_MS);
    });
    api("/api/pentagon-views").then(function (cfg) {
      if (cfg && cfg.views) PENTAGON_VIEWS = cfg.views;
      if (cfg && cfg.guesses) FIELD_GUESSES = cfg.guesses;
      requestRender();
    }).catch(function () {});
    api("/api/claude-projects").then(function (p) { claudeProjects = p || {}; requestRender(); }).catch(function () {});
    api("/api/department-defaults").then(function (d) { deptDefaults = d || {}; requestRender(); }).catch(function () {});
    loadInbox(true);
  }

  // ---------- Data ----------
  // Background sync: every 30 seconds, paused while the tab is hidden, and it
  // only redraws when something actually changed — and only on pages built
  // from that data. Calendar, Mentions you, Global and Pentagon load their
  // own data once and are left alone, so (for example) the HR calendar
  // doesn't reload under you.
  var POLL_MS = 30000;
  var lastSnapshot = "";
  function pageUsesLiveData() {
    if (page === "overview") return true;
    if (page !== "departments") return false;
    var sub = subView[activeDept];
    return !sub || sub === "tasks" || sub === "projects" || sub === "finance";
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && me) refresh(); });

  function refresh() {
    if (!me) return;
    setSync("busy", "Syncing…");
    var url = activeCompany === ALL ? "/api/tasks" : "/api/tasks?company=" + encodeURIComponent(activeCompany);
    var wantCards = activeCompany === "SOI Aviation" || (activeCompany === ALL && hasSOI());
    var pentagon = wantCards
      ? api("/api/pentagon-tasks").catch(function () { return { cards: [], errors: ["Couldn't load Pentagon rows."] }; })
      : Promise.resolve({ cards: [], errors: [] });
    var fin = page === "departments" && activeDept === "Accounting & Finance" && canSeeFinance() ? loadFinance() : Promise.resolve();
    loadMineCount().catch(function () {});
    return Promise.all([api(url), pentagon, fin]).then(function (r) {
      tasks = r[0];
      cards = r[1].cards || [];
      pentagonErrors = r[1].errors || [];
      setSync("on", "Live");
      var snapshot = JSON.stringify([activeCompany, tasks, cards, pentagonErrors, finance]);
      var changed = snapshot !== lastSnapshot;
      lastSnapshot = snapshot;
      var first = !loadedOnce;
      loadedOnce = true;
      if (first || (changed && pageUsesLiveData())) requestRender();
      else renderNav();
    }).catch(function (err) {
      if (err.message === "Session expired") return;
      setSync("off", "Sync error");
      if (!loadedOnce) setTimeout(refresh, 2000);
    });
  }

  function loadFinance() {
    var co = activeCompany;
    return api("/api/finance?company=" + encodeURIComponent(co)).then(function (data) {
      finance = { company: co, data: data };
    }).catch(function (err) { finance = { company: co, error: err.message }; });
  }

  // Responsible / Assigned to lists (managers only — everyone else can't assign).
  function usersFor(company) {
    if (!isManager()) return [];
    if (usersByCompany[company]) return usersByCompany[company];
    usersByCompany[company] = [];
    api("/api/users?company=" + encodeURIComponent(company)).then(function (users) {
      usersByCompany[company] = users.map(function (u) { return u.username; }).sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
      requestRender();
    }).catch(function () {});
    return usersByCompany[company];
  }

  // Don't redraw under someone's cursor: wait until they leave the field.
  function isEditing() {
    var a = document.activeElement;
    return !!(a && $("#view").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox");
  }
  function requestRender() {
    if (isEditing()) { renderPending = true; return; }
    render();
  }
  document.addEventListener("focusout", function () {
    setTimeout(function () { if (renderPending && !isEditing()) { renderPending = false; render(); } }, 60);
  });

  // ---------- Routing ----------
  function navItems() {
    var items = [{ group: "WORK", id: "departments", ic: "▣", label: "Departments" }];
    if (me.fullAccess || me.departments.length > 1) items.push({ id: "overview", ic: "◷", label: "Overview" });
    items.push({ group: "YOU", id: "mentions", ic: "@", label: "Mentions you", badge: mineOpen });
    items.push({ id: "inbox", ic: "✉", label: "Work inbox", badge: inboxNeeds });
    var tools = [];
    tools.push({ id: "calendar", ic: "▦", label: "Calendar" });
    if (me.performance) tools.push({ id: "performance", ic: "◐", label: "Performance", badge: perfFlagged });
    if (canUseAll()) tools.push({ id: "global", ic: "◎", label: "Global" });
    if (tools.length) { tools[0].group = "TOOLS"; items = items.concat(tools); }
    return items;
  }
  function readHash() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var parts = h.split("/");
    if (parts[0] === "dept" && parts[1] && visibleDepartments().indexOf(parts[1]) !== -1) { page = "departments"; activeDept = parts[1]; }
    else if (parts[0] !== "departments" && parts[0] !== "dept" && navItems().some(function (n) { return n.id === parts[0]; })) page = parts[0];
    else page = "departments";
  }
  window.addEventListener("hashchange", function () { if (!me) return; readHash(); render(); if (page === "departments") refresh(); });
  function go(hash) { if (location.hash === "#" + hash) { readHash(); render(); } else location.hash = hash; }

  // ---------- Render ----------
  function renderNav() {
    $("#nav").innerHTML = navItems().map(function (n) {
      var href = n.id === "departments" ? "dept/" + encodeURIComponent(activeDept || "") : n.id;
      return (n.group ? '<div class="nav-group">' + n.group + "</div>" : "") +
        '<a href="#' + href + '" class="' + (n.id === page ? "active" : "") + '"><span class="ic">' + n.ic + "</span>" + E(n.label) +
        (n.badge ? '<span class="badge">' + n.badge + "</span>" : "") + "</a>";
    }).join("");
  }

  function render() {
    if (!me) return;
    charts.concat(mnCharts).forEach(function (c) { try { c.destroy(); } catch (e) {} });
    charts = [];
    mnCharts = [];
    renderNav();
    $("#quickAdd").style.display = "none";
    var html;
    try {
      if (page === "overview") html = renderOverview();
      else if (page === "mentions") html = renderMentionsShell();
      else if (page === "calendar") html = renderCalendar();
      else if (page === "inbox") html = renderInbox();
      else if (page === "performance") html = renderPerformance();
      else if (page === "global") html = renderGlobalShell();
      else html = renderDepartment();
    } catch (e) {
      console.error(e);
      html = '<div class="empty">Something went wrong drawing this page. Reload to try again.</div>';
    }
    $("#view").innerHTML = html;
    autosize();
    afterRender();
  }

  function setBreadcrumb(parts) { $("#breadcrumb").textContent = parts.filter(Boolean).join(" / ").toUpperCase(); }

  function companySwitcher(count) {
    var cos = myCompanies();
    if (canUseAll()) cos.push(ALL);
    if (cos.length <= 1) return "";
    return '<div class="co-wrap"><div class="eyebrow">Company</div><div class="cos" role="radiogroup" aria-label="Company">' +
      cos.map(function (c) {
        var on = c === activeCompany;
        var n = on ? count : 0;
        return '<button type="button" role="radio" aria-checked="' + on + '" class="co ' + (on ? "active" : "") + '" data-co="' + E(c) + '">' +
          E(shortCo(c)) + (n ? '<span class="badge">' + n + "</span>" : "") + "</button>";
      }).join("") + "</div></div>";
  }

  // Everything on a department: tracker tasks and Pentagon cards.
  function deptItems(dept) {
    return tasks.filter(function (t) { return t.department === dept; })
      .concat(cards.filter(function (c) { return c.department === dept; }));
  }
  function openCount(dept) {
    return deptItems(dept).filter(function (t) { return !isDone(t); }).length;
  }

  // ---------- Department page ----------
  function renderDepartment() {
    var depts = visibleDepartments();
    if (!activeDept) return '<div class="empty">Your login has no departments yet. Ask an admin to add one.</div>';
    var dept = activeDept;
    var views = pentagonViewsFor(dept);
    var subs = [];
    if (dept === "Accounting & Finance" && canSeeFinance()) subs.push({ id: "finance", label: "Finance" });
    if (dept === "Business Development" && (activeCompany === "SOI Aviation" || (activeCompany === ALL && hasSOI()))) subs.push({ id: "analytics", label: "Analytics" });
    // Warehouse opens on Insights (the first tab is where a department lands).
    if (dept === "Warehouse" && (me.leadership || me.fullAccess || me.departments.indexOf("Warehouse") !== -1)) subs.push({ id: "insights", label: "Insights" });
    subs.push({ id: "tasks", label: "Tasks" });
    subs.push({ id: "projects", label: "Projects" });
    if (dept === "IT" && canSeeItRequests()) subs.push({ id: "requests", label: "Requests" });
    if (dept === "IT" && me.itNotebook) subs.push({ id: "resolved", label: "Resolved" });
    subs.push({ id: "sops", label: "SOPs" });
    views.forEach(function (v) { subs.push({ id: v.id, label: v.label }); });
    var sub = subView[dept];
    if (!sub || !subs.some(function (s) { return s.id === sub; })) sub = subView[dept] = subs[0].id;

    var totalOpen = depts.reduce(function (s, d) { return s + openCount(d); }, 0);
    setBreadcrumb(["Departments", shortCo(activeCompany), shortDept(dept)]);

    var links = (DEPARTMENT_RESOURCES[dept] || []).slice();
    if (claudeProjects[dept]) {
      links = links.filter(function (l) { return l.label !== "Claude"; });
      links.push({ label: "Claude project", url: claudeProjects[dept] });
    }
    var linkHtml = links.length ? '<div class="links">' + links.map(function (l) {
      var href = safeLink(l.url);
      return href ? '<a href="' + E(href) + '" target="_blank" rel="noopener noreferrer">' + E(l.label) + " ↗</a>" : "";
    }).join("") + "</div>" : "";

    var head =
      '<div class="intro"><div><div class="eyebrow">Departments / ' + E(shortCo(activeCompany)) + "</div>" +
      "<h1>" + E(dept) + " · " + E(shortCo(activeCompany)) + "</h1>" +
      "<p>" + E(DEPT_TAGLINE[dept] || "Projects, sub-tasks and who's responsible for each.") + "</p>" +
      '<p class="small-note">' + (isManager()
        ? "You're a manager: you can assign anything and tick things off."
        : "You can add your own rows. Only a manager ticks things off; anything a manager gave you is read-only.") +
      " · Saved to the SOI server</p>" + linkHtml + "</div>" +
      companySwitcher(totalOpen) + "</div>" +
      '<div class="tabs" role="tablist">' + depts.map(function (d) {
        var n = openCount(d);
        return '<button type="button" role="tab" class="tab ' + (d === dept ? "active" : "") + '" aria-selected="' + (d === dept) + '" data-dept="' + E(d) + '">' +
          E(shortDept(d)) + (n ? '<span class="badge">' + n + "</span>" : "") + "</button>";
      }).join("") + "</div>" +
      (subs.length > 1 ? '<div class="subbar"><div class="seg">' + subs.map(function (s) {
        return '<button type="button" data-sub="' + E(s.id) + '" class="' + (s.id === sub ? "active" : "") + '">' + E(s.label) + "</button>";
      }).join("") + "</div></div>" : "");

    var body;
    if (sub === "finance") body = renderFinance();
    else if (sub === "analytics") body = renderBdAnalytics();
    else if (sub === "requests") body = renderItRequests();
    else if (sub === "resolved") body = renderNotebook();
    else if (sub === "sops") body = renderSops(dept);
    else if (sub === "insights") body = renderWarehouseInsights();
    else if (sub === "tasks") body = isOps(dept) ? renderOpsTable(dept) : renderTaskTable(dept);
    else if (sub === "projects") body = renderProjectTable(dept);
    else {
      var view = views.filter(function (v) { return v.id === sub; })[0];
      body = view ? renderPentagonListShell(view) : "";
    }
    return head + body;
  }

  // Source / person filters shared by both table layouts.
  function filtered(list) {
    return list.filter(function (t) {
      if (showSource === "tasks" && isCard(t)) return false;
      if (showSource !== "all" && showSource !== "tasks" && t.view !== showSource) return false;
      if (showPerson && !sameUser(t.owner, showPerson) && !sameUser(t.createdBy, showPerson)) return false;
      return true;
    });
  }
  function sortRows(list) {
    return list.slice().sort(function (a, b) {
      return Number(isDone(a)) - Number(isDone(b)) ||
        String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999")) ||
        (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  // ---- Column filters ----
  // "+ Filter" → pick a column → pick one of the values actually in it
  // (with counts). Filters stack (all must match) and show as chips.
  // Each table passes its fields: { key, label, get(row) -> text }.
  var colFilters = {}, filterPick = {};
  function dueBucket(d) {
    d = String(d || "").slice(0, 10);
    if (!d) return "No due date";
    if (d < today) return "Overdue";
    if (d === today) return "Today";
    var wk = new Date(today + "T00:00:00"); wk.setDate(wk.getDate() + 7);
    return d <= ymdLocal(wk) ? "Next 7 days" : "Later";
  }
  function ymdLocal(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fval(f, row) { var v = f.get(row); v = v == null ? "" : String(v).trim(); return v || "—"; }
  function applyColFilters(scope, fields, rows) {
    var list = colFilters[scope] || [];
    if (!list.length) return rows;
    var byKey = {}; fields.forEach(function (f) { byKey[f.key] = f; });
    return rows.filter(function (r) {
      return list.every(function (c) { var f = byKey[c.key]; return !f || fval(f, r) === c.value; });
    });
  }
  function filterUi(scope, fields, rows, shown) {
    var list = (colFilters[scope] = (colFilters[scope] || []).filter(function (c) { return fields.some(function (f) { return f.key === c.key; }); }));
    var byKey = {}; fields.forEach(function (f) { byKey[f.key] = f; });
    var chips = list.map(function (c, i) {
      return '<span class="fchip">' + E(byKey[c.key].label) + ": <b>" + E(c.value) + '</b><button type="button" data-fdel="' + E(scope) + '" data-i="' + i + '" aria-label="Remove filter">✕</button></span>';
    }).join("");
    var pick = filterPick[scope] && byKey[filterPick[scope]];
    var html = '<div class="filter-row">' + chips;
    if (pick) {
      // Values among rows that match the other filters, most common first.
      var base = applyColFilters(scope, fields, rows), counts = {};
      base.forEach(function (r) { var v = fval(pick, r); counts[v] = (counts[v] || 0) + 1; });
      var vals = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, undefined, { numeric: true }); }).slice(0, 300);
      html += '<select data-fadd-value="' + E(scope) + '" aria-label="' + E(pick.label) + ' is"><option value="">' + E(pick.label) + " is…</option>" +
        vals.map(function (v) { return '<option value="' + E(v) + '">' + E(v.length > 60 ? v.slice(0, 60) + "…" : v) + " (" + counts[v] + ")</option>"; }).join("") + "</select>" +
        '<button type="button" class="text-button" data-fcancel="' + E(scope) + '">Cancel</button>';
    } else {
      html += '<select data-fadd-field="' + E(scope) + '" aria-label="Add a filter"><option value="">+ Filter</option>' +
        fields.map(function (f) { return '<option value="' + E(f.key) + '">' + E(f.label) + "</option>"; }).join("") + "</select>";
    }
    if (list.length) html += '<span class="fcount">' + shown + " of " + rows.length + ' shown</span><button type="button" class="text-button" data-fclear="' + E(scope) + '">Clear filters</button>';
    return html + "</div>";
  }
  function redrawFor(scope) { if (scope.indexOf("doc:") === 0) drawDocTable(); else render(); }
  document.addEventListener("change", function (e) {
    var t = e.target, sc;
    if ((sc = t.dataset && t.dataset.faddField) !== undefined && sc) { filterPick[sc] = t.value; redrawFor(sc); var n = document.querySelector('[data-fadd-value="' + sc + '"]'); if (n) n.focus(); return; }
    if ((sc = t.dataset && t.dataset.faddValue) !== undefined && sc && t.value) {
      (colFilters[sc] = colFilters[sc] || []).push({ key: filterPick[sc], value: t.value });
      filterPick[sc] = ""; redrawFor(sc);
    }
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-fdel],[data-fclear],[data-fcancel]");
    if (!t) return;
    var ds = t.dataset;
    if (ds.fdel) { colFilters[ds.fdel].splice(+ds.i, 1); redrawFor(ds.fdel); }
    else if (ds.fclear) { colFilters[ds.fclear] = []; filterPick[ds.fclear] = ""; redrawFor(ds.fclear); }
    else if (ds.fcancel) { filterPick[ds.fcancel] = ""; redrawFor(ds.fcancel); }
  });
  function personOf(t) { return t.owner || (isCard(t) ? t.assignee : "") || "Unassigned"; }
  function taskFields(dept, ops) {
    var f = [];
    if (ops) f.push({ key: "type", label: "Type", get: function (t) { return isCard(t) ? t.docLabel || "Pentagon" : "Task"; } });
    f.push({ key: "owner", label: "Responsible", get: personOf });
    f.push({ key: "status", label: "Status", get: function (t) { return isDone(t) ? "Done" : isOverdue(t) ? "Overdue" : "Open"; } });
    f.push({ key: "due", label: "Due", get: function (t) { return dueBucket(t.dueDate); } });
    if (ops) {
      f.push({ key: "part", label: "Part number", get: function (t) { return t.part; } });
      f.push({ key: "platform", label: "Platform", get: function (t) { return t.platform; } });
      f.push({ key: "customer", label: "Customer", get: function (t) { return t.customer || t.party; } });
      f.push({ key: "obsolete", label: "Obsolete", get: function (t) { return isCard(t) ? "" : t.obsolete || "No"; } });
    } else {
      f.push({ key: "src", label: "Came from", get: function (t) { return t.source === "form" ? (String(t.formResponseId || "").indexOf("manual-") === 0 ? "IT ticket" : "IT form") : "Added here"; } });
    }
    f.push({ key: "by", label: "Added by", get: function (t) { return isCard(t) ? "Pentagon" : t.createdBy; } });
    if (activeCompany === ALL) f.push({ key: "co", label: "Company", get: function (t) { return shortCo(t.company || "SOI Aviation"); } });
    return f;
  }

  function toolbar(dept, addLabel, kind) {
    var views = pentagonViewsFor(dept).filter(function (v) { return v.tasks; });
    var sources = [{ id: "all", label: "All" }, { id: "tasks", label: "Tasks" }].concat(views.map(function (v) { return { id: v.id, label: v.label }; }));
    if (!sources.some(function (s) { return s.id === showSource; })) showSource = "all";
    var html = '<div class="table-toolbar">';
    if (sources.length > 2) {
      html += '<div class="seg">' + sources.map(function (s) {
        return '<button type="button" data-source="' + E(s.id) + '" class="' + (s.id === showSource ? "active" : "") + '">' + E(s.label) + "</button>";
      }).join("") + "</div>";
    }
    if (isManager()) {
      var people = {};
      deptItems(dept).forEach(function (t) { if (t.owner) people[t.owner] = 1; if (t.createdBy && !isCard(t)) people[t.createdBy] = 1; });
      var names = Object.keys(people).sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
      if (showPerson && names.indexOf(showPerson) === -1) names.unshift(showPerson);
      html += '<select id="personFilter" aria-label="Show one person"><option value="">Everyone</option>' + names.map(function (n) {
        return '<option value="' + E(n) + '"' + (n === showPerson ? " selected" : "") + ">" + E(n) + "</option>";
      }).join("") + "</select>";
    }
    if (activeCompany === ALL) {
      if (!addCompany) addCompany = myCompanies()[0];
      html += '<select id="addCompany" aria-label="Add rows to">' + myCompanies().map(function (c) {
        return '<option value="' + E(c) + '"' + (c === addCompany ? " selected" : "") + ">Add to " + E(shortCo(c)) + "</option>";
      }).join("") + "</select>";
    }
    if (pentagonErrors.length && views.length) html += '<span class="small-note" title="' + E(pentagonErrors.join("; ")) + '">Some Pentagon rows couldn\'t load.</span>';
    html += '<button type="button" class="primary" data-add="' + E(dept + "|" + (kind || "task")) + '">+ ' + E(addLabel) + "</button></div>";
    return html;
  }

  // ---- inline controls ----
  function input(t, key, val, type, placeholder, enabled) {
    var attrs = ' data-id="' + E(t.id) + '" data-key="' + key + '"' + (enabled ? "" : " disabled");
    if (type === "textarea") return '<textarea class="fb-in fb-notes" rows="1"' + attrs + ' placeholder="' + (enabled ? "Notes…" : "") + '">' + E(val) + "</textarea>";
    if (type === "obsolete") {
      return '<select class="fb-in"' + attrs + ">" + ["No", "Yes"].map(function (o) {
        return '<option value="' + o + '"' + ((val || "No") === o ? " selected" : "") + ">" + o + "</option>";
      }).join("") + "</select>";
    }
    return '<input class="fb-in" type="' + (type || "text") + '"' + attrs + ' value="' + E(val) + '" placeholder="' + (enabled ? E(placeholder || "") : "") + '">';
  }
  function staticCell(v, cls) { return '<span class="static ' + (cls || "") + '">' + (v ? E(v) : '<span class="dim">—</span>') + "</span>"; }
  function doneToggle(t) {
    var done = isDone(t);
    var can = isManager() && !t.draft;
    return '<button type="button" class="toggle ' + (done ? "yes" : "no") + '" data-toggle="' + E(t.id) + '"' + (can ? "" : " disabled") +
      ' title="' + (done ? "Done" : "Not done") + (can ? " — click to change" : " — only a manager can change this") + '" aria-label="' + (done ? "Done" : "Not done") + '">' + (done ? "✓" : "✗") + "</button>";
  }
  function responsibleCell(t) {
    var company = t.company || activeCompany;
    var current = isCard(t) ? t.assignee : t.owner;
    if (!isManager()) return t.draft ? staticCell(deptDefaults[t.department] ? deptDefaults[t.department] + " (department default)" : "You") : staticCell(t.owner);
    var users = usersFor(company).slice();
    if (current && !users.some(function (u) { return sameUser(u, current); })) users.unshift(current);
    var none = isCard(t) && t.pentagonUser ? "Unassigned (" + t.pentagonUser + ")" : "Unassigned";
    return '<select class="fb-in" data-id="' + E(t.id) + '" data-key="owner" aria-label="Responsible"><option value="">' + E(none) + "</option>" +
      users.map(function (u) { return '<option value="' + E(u) + '"' + (sameUser(u, current) ? " selected" : "") + ">" + E(u) + "</option>"; }).join("") + "</select>";
  }
  function delButton(t) {
    if (t.draft) return '<button type="button" class="del" data-cancel="' + E(t.id) + '" title="Discard" aria-label="Discard new row">×</button>';
    if (isCard(t) || !canEditTask(t)) return "";
    return '<button type="button" class="del" data-del="' + E(t.id) + '" title="Delete" aria-label="Delete">×</button>';
  }
  function coNote(t) { return activeCompany === ALL && t.company ? '<span class="co-note">' + E(shortCo(t.company)) + "</span>" : ""; }
  function metric(label, n, note, alert) {
    return '<div class="metric' + (alert ? " alert" : "") + '"><div class="eyebrow">' + E(label) + "</div><strong>" + E(n) + "</strong><small>" + E(note) + "</small></div>";
  }
  function legend() {
    return '<p class="small-note" style="margin-top:12px;">Click a cell to edit; changes save when you leave the field. ✓ done · ✗ not done' +
      (isManager() ? " — click to change." : " — only a manager can change it.") +
      " Pentagon rows come straight from Pentagon; their assignee, ✓ and notes are kept here.</p>";
  }
  function setQuickAdd(label, target) {
    var b = $("#quickAdd");
    b.style.display = "";
    b.textContent = "+ " + label;
    b.dataset.add = target;
  }

  // ---- Procurement / Purchasing / Warehouse ----
  function opsRow(t) {
    var card = isCard(t);
    var ed = t.draft || (!card && canEditTask(t));
    var cls = (isDone(t) ? "done " : "") + (isOverdue(t) ? "overdue " : "") + (t.draft ? "draft" : "");
    var nameCell = card
      ? '<span class="static"><strong>' + E(t.docLabel + " " + t.docNo) + '</strong><span class="src">PENTAGON</span></span>'
      : input(t, "title", t.title, "text", "Task", ed);
    return '<tr class="' + cls + '">' +
      "<td>" + nameCell + coNote(t) + "</td>" +
      "<td>" + (card ? staticCell(t.part) : input(t, "part", t.part, "text", "Part number", ed)) + "</td>" +
      "<td>" + (card ? staticCell("") : input(t, "platform", t.platform, "text", "Aircraft", ed)) + "</td>" +
      "<td>" + (card ? staticCell(t.party) : input(t, "customer", t.customer, "text", "Customer", ed)) + "</td>" +
      "<td>" + (card ? staticCell("") : input(t, "obsolete", t.obsolete, "obsolete", "", ed)) + "</td>" +
      "<td>" + (card ? '<span class="static due-static">' + (t.dueDate ? E(fmtDate(t.dueDate)) : '<span class="dim">—</span>') + "</span>" : input(t, "dueDate", t.dueDate, "date", "", ed)) + "</td>" +
      "<td>" + responsibleCell(t) + "</td>" +
      '<td class="center">' + doneToggle(t) + "</td>" +
      '<td class="notes-cell">' + input(t, "notes", t.notes, "textarea", "", card ? isManager() : ed) + "</td>" +
      "<td>" + delButton(t) + "</td></tr>";
  }
  function renderOpsTable(dept) {
    var all = deptItems(dept).filter(function (t) { return itemKind(t) === "task"; });
    var fields = taskFields(dept, true), scope = "ops:" + dept;
    var pre = filtered(all), list = sortRows(applyColFilters(scope, fields, pre));
    var ds = drafts.filter(function (d) { return d.department === dept && !d.parentId && d.kind !== "project"; });
    var open = all.filter(function (t) { return !isDone(t); }).length;
    var late = all.filter(isOverdue).length;
    setQuickAdd("Add task", dept + "|task");
    return '<div class="summary-cards">' +
      metric("Open", open, "of " + all.length + " item" + (all.length === 1 ? "" : "s")) +
      metric("Overdue", late, "Past due and not done", late > 0) +
      metric("Obsolete", all.filter(function (t) { return t.obsolete === "Yes"; }).length, "Flagged obsolete") + "</div>" +
      toolbar(dept, "Add task", "task") + filterUi(scope, fields, pre, list.length) +
      '<div class="table-wrap"><table class="wide"><thead><tr><th>Task</th><th>Part number</th><th>Platform (aircraft)</th><th>Customer</th><th>Obsolete</th><th>Due date</th><th>Responsible</th><th>Done</th><th>Notes</th><th></th></tr></thead><tbody>' +
      (ds.length || list.length ? ds.map(opsRow).join("") + list.map(opsRow).join("") : '<tr><td colspan="10" class="empty">Nothing here yet. Add a row above.</td></tr>') +
      "</tbody></table></div>" + legend();
  }

  // ---- Projects with sub-tasks (IT, Admin, HR and the rest) ----
  function projectRow(p, subs) {
    var ed = p.draft || canEditTask(p);
    var doneSubs = subs.filter(isDone).length;
    var cls = "project " + (isDone(p) ? "done " : "") + (isOverdue(p) ? "overdue " : "") + (p.draft ? "draft" : "");
    var tools = (!p.draft && ed ? '<button type="button" class="text-button" data-add-sub="' + E(p.id) + '">+ Sub-task</button>' : "") + delButton(p);
    return '<tr class="' + cls + '"><td>' + input(p, "title", p.title, "text", "Project name", ed) +
      '<span class="co-note">' + (subs.length ? doneSubs + "/" + subs.length + " sub-tasks done" : "No sub-tasks yet") + (activeCompany === ALL && p.company ? " · " + E(shortCo(p.company)) : "") + "</span></td>" +
      "<td>" + responsibleCell(p) + "</td><td>" + input(p, "dueDate", p.dueDate, "date", "", ed) + "</td>" +
      '<td class="center">' + doneToggle(p) + '</td><td class="notes-cell">' + input(p, "notes", p.notes, "textarea", "", ed) + "</td>" +
      '<td class="row-tools">' + tools + "</td></tr>";
  }
  function subRow(s) {
    var ed = s.draft || canEditTask(s);
    var cls = (isDone(s) ? "done " : "") + (isOverdue(s) ? "overdue " : "") + (s.draft ? "draft" : "");
    return '<tr class="' + cls + '"><td><div class="name-cell"><span class="indent">↳</span>' + input(s, "title", s.title, "text", "Sub-task", ed) + "</div></td>" +
      "<td>" + responsibleCell(s) + "</td><td>" + input(s, "dueDate", s.dueDate, "date", "", ed) + "</td>" +
      '<td class="center">' + doneToggle(s) + '</td><td class="notes-cell">' + input(s, "notes", s.notes, "textarea", "", ed) + "</td>" +
      '<td class="row-tools">' + delButton(s) + "</td></tr>";
  }
  function renderProjectTable(dept) {
    var all = tasks.filter(function (t) { return t.department === dept && itemKind(t) !== "task"; });
    var ids = {};
    all.forEach(function (t) { ids[t.id] = true; });
    var tops = all.filter(function (t) { return !t.parentId || !ids[t.parentId]; });
    var subsOf = function (p) {
      return all.filter(function (s) { return s.parentId === p.id; })
        .concat(drafts.filter(function (d) { return d.parentId === p.id; }))
        .sort(function (a, b) { return (a.createdAt || 9e15) - (b.createdAt || 9e15); });
    };
    var pfields = [
      { key: "owner", label: "Responsible", get: personOf },
      { key: "status", label: "Status", get: function (t) { return isDone(t) ? "Done" : isOverdue(t) ? "Overdue" : "Open"; } },
      { key: "due", label: "Due", get: function (t) { return dueBucket(t.dueDate); } },
      { key: "subs", label: "Sub-tasks", get: function (p) { var n = all.filter(function (x) { return x.parentId === p.id; }); return !n.length ? "None" : n.every(isDone) ? "All done" : "Some open"; } },
      { key: "by", label: "Added by", get: function (t) { return t.createdBy; } }
    ];
    if (activeCompany === ALL) pfields.push({ key: "co", label: "Company", get: function (t) { return shortCo(t.company || "SOI Aviation"); } });
    var pscope = "proj:" + dept;
    var preTops = filtered(tops);
    var shown = sortRows(applyColFilters(pscope, pfields, preTops));
    // A project also shows when one of its sub-tasks belongs to the chosen person.
    if (showPerson) {

      });
    }
    var ds = drafts.filter(function (d) { return d.department === dept && !d.parentId && d.kind === "project"; });
    var open = all.filter(function (t) { return !isDone(t); }).length;
    var late = all.filter(isOverdue).length;
    setQuickAdd("Add project", dept + "|project");
    var rows = ds.map(function (d) { return projectRow(d, []); }).join("") +
      shown.map(function (p) { var subs = subsOf(p); return projectRow(p, subs.filter(function (s) { return !s.draft; })) + subs.map(subRow).join(""); }).join("");
    return '<div class="summary-cards">' +
      metric("Projects", tops.length, tops.filter(function (p) { return !isDone(p); }).length + " still open") +
      metric("Open items", open, "Projects and sub-tasks not done") +
      metric("Overdue", late, "Past due and not done", late > 0) + "</div>" +
      toolbar(dept, "Add project", "project") + filterUi(pscope, pfields, preTops, shown.length) +
      '<div class="table-wrap"><table class="wide"><thead><tr><th>Project / sub-task</th><th>Person responsible</th><th>Due date</th><th>Done</th><th>Notes</th><th></th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="6" class="empty">No projects yet. Projects are longer-term work with sub-tasks — add one above.</td></tr>') +
      "</tbody></table></div>" + legend();
  }

  // ---- Tasks (quick, one-off) for IT, Admin, HR and the rest ----
  function srcNote(t) {
    var bits = [];
    if (t.source === "form") bits.push((String(t.formResponseId || "").indexOf("manual-") === 0 ? "IT ticket" : "From the IT form") + (t.requester ? " · " + t.requester : ""));
    if (activeCompany === ALL && t.company) bits.push(shortCo(t.company));
    return bits.length ? '<span class="co-note">' + E(bits.join(" · ")) + "</span>" : "";
  }
  function taskRow(t) {
    var ed = t.draft || canEditTask(t);
    var cls = (isDone(t) ? "done " : "") + (isOverdue(t) ? "overdue " : "") + (t.draft ? "draft" : "");
    return '<tr class="' + cls + '"><td>' + input(t, "title", t.title, "text", "Task", ed) + srcNote(t) + "</td>" +
      "<td>" + responsibleCell(t) + "</td><td>" + input(t, "dueDate", t.dueDate, "date", "", ed) + "</td>" +
      '<td class="center">' + doneToggle(t) + '</td><td class="notes-cell">' + input(t, "notes", t.notes, "textarea", "", ed) + "</td>" +
      '<td class="row-tools">' + delButton(t) + "</td></tr>";
  }
  function renderTaskTable(dept) {
    var all = tasks.filter(function (t) { return t.department === dept && itemKind(t) === "task"; });
    var fields = taskFields(dept, false), scope = "tasks:" + dept;
    var pre = filtered(all), list = sortRows(applyColFilters(scope, fields, pre));
    var ds = drafts.filter(function (d) { return d.department === dept && !d.parentId && d.kind !== "project"; });
    var open = all.filter(function (t) { return !isDone(t); }).length;
    var late = all.filter(isOverdue).length;
    setQuickAdd("Add task", dept + "|task");
    return '<div class="summary-cards">' +
      metric("Open", open, "of " + all.length + " task" + (all.length === 1 ? "" : "s")) +
      metric("Overdue", late, "Past due and not done", late > 0) +
      metric("Done", all.filter(isDone).length, "Ticked off") + "</div>" +

  // ---- Business Development analytics (Pentagon) ----
  // Number tiles plus customer and by-person tables. Charts live on the

  var bdDays = 30, bdData = null, bdLoading = false;

      (capped.length ? '<div class="banner">' + E(capped.map(function (x) { return x.label; }).join(", ")) + " hit the query's 200-row limit, so totals may be low for this range. Raise <b>TOP 200</b> in those queries to see everything.</div>" : "") +
      '<div class="summary-cards four">' + tile("rfqs", "RFQs received") + tile("quotes", "Quotes") + tile("sales_orders", "Sales orders") + tile("purchase_orders", "Purchase orders") + "</div>" +
      '<div class="grid-2">' +

      '<div class="table-wrap"><table class="plain"><thead><tr><th>Person (Pentagon contact)</th><th>RFQs</th><th>Quotes</th><th>SOs</th><th>POs</th></tr></thead><tbody>' +
      (d.byPerson.length ? d.byPerson.map(function (p) {

      }).join("") : '<tr><td colspan="5" class="empty">No Pentagon contacts in this range.</td></tr>') + "</tbody></table></div></div>" +
      '<p class="small-note" style="margin-top:12px;">People are matched by the Pentagon code on their login; unmatched codes show as the code. Business Development projects are under <b>Projects</b>.</p>';

  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-bd-days]");
    if (!b) return;
