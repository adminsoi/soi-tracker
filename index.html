<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AOG Tracker — SOI Aviation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap">
<script src="/chart.umd.min.js"></script>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("soi_tracker_theme") || "light"; } catch (e) { document.documentElement.dataset.theme = "light"; }</script>
<link rel="stylesheet" href="/public/styles.css">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand">AOG<br><em>Tracker.</em><span>DEPARTMENT TASK TRACKER</span></div>
    <p>Sign in with the credentials your IT admin gave you.</p>
    <form id="loginForm">
      <div class="field"><label for="li-user">Username</label><input id="li-user" autocomplete="username" required></div>
      <div class="field"><label for="li-pass">Password</label><input id="li-pass" type="password" autocomplete="current-password" required></div>
      <label class="remember"><input type="checkbox" id="li-remember"> Remember me for 30 days</label>
      <button type="submit" class="primary">Sign in</button>
      <div class="login-msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<div id="app" class="app-hidden">
  <aside>
    <a class="brand" href="#departments">AOG<br><em>Tracker.</em><span>SOI · CAS · NANOTECH · REDSUN</span></a>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <span class="live-dot off" id="syncDot"></span><span id="syncText">Connecting…</span>
      <strong id="whoName"></strong>
      <small id="whoRole"></small>
      <button type="button" id="logoutBtn">Sign out</button><button type="button" id="themeBtn" class="theme-switch" title="Switch between the dark and light look"></button>
    </div>
  </aside>
  <main>
    <header class="top">
      <div id="breadcrumb">DEPARTMENTS</div>
      <div class="header-tools">
        <a href="https://claude.ai/new" target="_blank" rel="noopener noreferrer" title="Opens claude.ai in a new tab">Claude ↗</a>
        <button type="button" class="pink" id="quickAdd">+ Add row</button>
      </div>
    </header>
    <div id="view"></div>
    <footer class="foot">SOI AVIATION · DEPARTMENT TASK TRACKER <span>Internal use only · Saved to the SOI server</span></footer>
  </main>
</div>

<div id="toast" role="status"></div>

<script src="/public/js/core.js"></script>
<script src="/public/js/departments.js"></script>
<script src="/public/js/it-requests.js"></script>
<script src="/public/js/qbr.js"></script>
<script src="/public/js/performance.js"></script>
<script src="/public/js/sops.js"></script>
<script src="/public/js/it-notebook.js"></script>
<script src="/public/js/finance.js"></script>
<script src="/public/js/pentagon-lists.js"></script>
<script src="/public/js/overview.js"></script>
<script src="/public/js/mentions.js"></script>
<script src="/public/js/aog-board.js"></script>
<script src="/public/js/inbox.js"></script>
<script src="/public/js/calendar.js"></script>
<script src="/public/js/global.js"></script>
<script src="/public/js/company-pages.js"></script>
<script src="/public/js/app.js"></script>
</body>
</html>
