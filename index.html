<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOI Aviation — Department Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap">
<script src="/chart.umd.min.js"></script>
<style>
  /* Look and feel follows "The Daily Edit": paper, serif headings, sage and rose. */
  :root {
    --paper: #f8f3eb; --card: #fffdfa; --ink: #3f352c; --muted: #948575; --line: #e6dccc;
    --pink: #edcfda; --sage: #78846c; --forest: #354936; --soft: #eee8da; --rose-ink: #633f47;
    --danger: #a25e5e; --side: #efe9dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px 'DM Sans', system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 9px 14px; }
  button:hover { background: var(--soft); }
  button:disabled { cursor: not-allowed; opacity: .5; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #b75d80; outline-offset: 3px; }
  a { color: var(--forest); text-decoration: none; }
  h1, h2, h3 { font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; }
  h1 { font-size: 50px; line-height: 1.05; margin: 12px 0 14px; letter-spacing: -1.5px; }
  h2 { font-size: 27px; margin: 8px 0 16px; }
  h3 { font-size: 22px; margin: 0 0 14px; }
  .eyebrow, #breadcrumb { font-size: 9px; letter-spacing: 2px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .small-note { font-size: 11px; line-height: 1.7; color: var(--muted); }
  .pink { background: #f6dce5; border-color: #dca4b8; color: #864b65; }
  .primary { background: var(--forest); color: #fff; border-color: var(--forest); }
  .primary:hover { background: #46634a; }
  .text-button { border: 0; padding: 0; font-size: 11px; text-decoration: underline; text-underline-offset: 3px; color: #aa6882; background: none; }
  .text-button:hover { background: none; }

  /* Sidebar */
  aside { width: 222px; position: fixed; inset: 0 auto 0 0; padding: 32px 22px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 5; }
  .brand { font: 36px/.95 'Libre Caslon Display', Georgia, serif; color: var(--ink); letter-spacing: -1px; }
  .brand em { font-style: italic; }
  .brand span { display: block; margin-top: 17px; font: 8px 'DM Sans', sans-serif; letter-spacing: 2px; color: var(--muted); }
  nav { margin-top: 26px; flex: 1 1 auto; min-height: 0; overflow-y: auto; margin-right: -12px; padding-right: 12px; }
  nav .nav-group { font-size: 9px; letter-spacing: 2px; color: var(--muted); margin: 22px 10px 8px; }
  nav a { display: flex; gap: 12px; align-items: center; padding: 11px 12px; margin: 3px 0; color: #756657; font-size: 13px; border-radius: 6px; }
  nav a:hover { background: var(--soft); }
  nav a.active { background: var(--pink); color: var(--rose-ink); }
  nav a .ic { width: 19px; font-size: 15px; text-align: center; }
  nav a .badge { margin-left: auto; }
  .sidebar-foot { margin-top: auto; padding: 18px 7px 0; font-size: 11px; color: var(--sage); border-top: 1px solid var(--line); }
  .sidebar-foot strong { display: block; color: var(--ink); font-size: 13px; margin: 6px 0 2px; }
  .sidebar-foot small { display: block; color: var(--muted); font-size: 10px; line-height: 1.6; }
  .sidebar-foot button { margin-top: 10px; padding: 6px 12px; font-size: 11px; }
  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--sage); margin-right: 5px; }
  .live-dot.off { background: var(--danger); }
  .live-dot.busy { background: #c9a35c; }

  /* Main */
  main { margin-left: 222px; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { height: 78px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 44px; gap: 12px; }
  .header-tools { display: flex; gap: 10px; align-items: center; }
  .header-tools a { border: 1px solid var(--line); border-radius: 7px; padding: 9px 14px; color: var(--ink); }
  .header-tools a:hover { background: var(--soft); }
  #view { padding: 34px 44px 60px; max-width: 1550px; width: 100%; margin: 0 auto; flex: 1; }
  footer.foot { border-top: 1px solid var(--line); padding: 20px 44px; font-size: 9px; letter-spacing: 1px; color: var(--muted); display: flex; justify-content: space-between; }

  .intro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
  .intro > div:first-child { flex: 1 1 380px; min-width: 0; }
  .intro p { color: var(--muted); line-height: 1.7; font-size: 12px; margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .card + .card { margin-top: 18px; }
  .card-label { font-size: 9px; font-weight: 700; letter-spacing: 1.7px; color: #817567; text-transform: uppercase; }
  .summary-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 20px 0; }
  .summary-cards.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .metric { padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .metric strong { display: block; font: clamp(24px, 2.6vw, 34px) 'Libre Caslon Display', Georgia, serif; margin: 4px 0; overflow-wrap: anywhere; }
  .metric small { color: var(--muted); font-size: 10px; }
  .metric.alert strong { color: var(--danger); }
  .section-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 30px 0 13px; }
  .section-title h2 { margin: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .chart-wrap { position: relative; height: 230px; }

  /* Company switcher + department tabs */
  .co-wrap { display: grid; gap: 6px; justify-items: end; flex: 0 1 auto; max-width: 100%; margin-left: auto; }
  .cos { display: inline-flex; gap: 4px; padding: 4px; background: var(--soft); border-radius: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .co { border: 0; border-radius: 7px; padding: 9px 18px; font-size: 13px; font-weight: 600; color: #756657; }
  .co:hover { background: #e4dccb; }
  .co.active { background: var(--forest); color: #fff; }
  .co.active .badge { background: #fff; color: var(--forest); }
  .badge { display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 9px; font-size: 9px; background: var(--pink); color: var(--rose-ink); font-weight: 600; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 4px 0 6px; }
  .tab { border: 0; border-radius: 8px 8px 0 0; padding: 11px 16px; font-size: 12px; color: #756657; }
  .tab:hover { background: var(--soft); }
  .tab.active { background: var(--card); color: var(--rose-ink); font-weight: 600; box-shadow: inset 0 -2px #d1a1b3; }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; padding: 3px; background: var(--soft); border-radius: 9px; }
  .seg button { border: 0; border-radius: 7px; padding: 7px 12px; font-size: 11px; color: #756657; }
  .seg button.active { background: var(--card); color: var(--rose-ink); font-weight: 600; box-shadow: 0 1px 2px #0000000f; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
  .links a { font-size: 11px; border: 1px solid var(--line); padding: 7px 10px; border-radius: 5px; background: var(--card); }
  .subbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

  /* Tables */
  .table-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 20px 0 12px; }
  .table-toolbar input[type=search] { padding: 9px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; flex: 1; max-width: 300px; min-width: 160px; }
  .table-toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); }
  .table-toolbar .primary { margin-left: auto; }
  .table-wrap { overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th { text-align: left; white-space: nowrap; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 13px 10px; background: #f2ede3; border-bottom: 1px solid var(--line); font-weight: 600; }
  td { padding: 7px 6px; border-bottom: 1px solid #efe8dc; vertical-align: middle; line-height: 1.5; }
  tbody tr:last-child td { border-bottom: 0; }
  .wide { min-width: 1080px; }
  .wide td:first-child { min-width: 170px; }
  .narrow { min-width: 720px; }
  .plain td { padding: 12px 14px; }
  .plain th { padding: 13px 14px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  td.empty { text-align: left; padding-left: 24px; }
  .fb-in { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 7px 8px; font-size: 12px; min-width: 90px; }
  .fb-in:hover:not(:disabled) { border-color: var(--line); }
  .fb-in:focus { border-color: #dca4b8; background: #fff; outline: none; }
  .fb-in:disabled { cursor: default; -webkit-text-fill-color: var(--ink); opacity: 1; }
  select.fb-in { min-width: 115px; cursor: pointer; }
  select.fb-in:disabled { appearance: none; }
  input.fb-in[type=date] { min-width: 132px; }
  .fb-num { text-align: right; min-width: 100px; }
  .fb-notes { resize: none; overflow: hidden; line-height: 1.5; min-width: 170px; display: block; }
  .notes-cell { width: 24%; }
  .static { padding: 7px 8px; display: block; }
  .static.dim { color: var(--muted); }
  .center { text-align: center; }
  .check { accent-color: var(--sage); width: 17px; height: 17px; cursor: pointer; }
  .toggle { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 14px; font-weight: 700; line-height: 1; }
  .toggle.yes { background: #eef0e8; color: #697957; border-color: #c7cdbb; }
  .toggle.no { background: #f6e1e8; color: #a96b82; border-color: #e3bccb; }
  .toggle:disabled { opacity: 1; cursor: default; }
  .del { border: 0; padding: 4px 8px; font-size: 16px; color: var(--muted); line-height: 1; }
  .del:hover { color: var(--danger); background: transparent; }
  .row-tools { white-space: nowrap; text-align: right; }
  .row-tools .text-button { margin-right: 8px; }
  .src { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; font-size: 9px; background: #eef0e8; color: #697957; font-weight: 600; letter-spacing: .5px; vertical-align: 1px; }
  .co-note { display: block; padding: 0 8px; font-size: 10px; color: var(--muted); }
  tr.project td { background: #f7f3ea; }
  tr.project .fb-in { font-weight: 600; }
  tr.draft td { background: #fdf7f9; }
  .name-cell { display: flex; align-items: center; }
  .indent { color: var(--muted); padding: 0 4px 0 22px; }
  tr.done .fb-in, tr.done .static { opacity: .55; }
  tr.done td:first-child .fb-in, tr.done td:first-child .static { text-decoration: line-through; }
  tr.overdue input.fb-in[type=date], tr.overdue .due-static { color: var(--danger); font-weight: 600; }
  .pill { display: inline-block; white-space: nowrap; border-radius: 4px; font-size: 10px; background: #eef0e8; color: #697957; padding: 3px 7px; }
  .pill.rose { background: #f6e1e8; color: #a96b82; }

  /* Filter bars, forms */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 18px 0 14px; }
  .field label { display: block; font-size: 10px; font-weight: 600; color: var(--muted); margin-bottom: 5px; letter-spacing: .5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; background: #fff; font-size: 13px; }
  .field { min-width: 130px; }
  .banner { background: var(--side); border-radius: 10px; padding: 14px 18px; font-size: 12px; line-height: 1.7; margin-bottom: 18px; }
  .banner b { color: var(--ink); }
  details summary { cursor: pointer; }
  pre.raw { white-space: pre-wrap; word-break: break-word; font-size: 11px; max-height: 40vh; overflow: auto; background: var(--paper); padding: 12px; border-radius: 7px; border: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .cal-event { padding: 11px 12px 11px 16px; border-left: 2px solid #bbc6ad; background: #f1f3ed; margin: 7px 0; line-height: 1.6; font-size: 12px; border-radius: 0 6px 6px 0; }
  .cal-event.all-day { border-color: #d1a1b3; background: #fcf0f4; }
  .cal-time { display: block; font-size: 10px; font-weight: 600; color: #8e7d6d; }
  .cal-links { display: flex; gap: 14px; margin-top: 2px; font-size: 11px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 100px; padding: 6px 12px; font-size: 12px; }
  .chip .x { border: 0; padding: 0 0 0 6px; color: var(--muted); }

  /* Login */
  .login-screen { position: fixed; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 60; }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 34px 32px; max-width: 380px; width: 100%; }
  .login-card .brand { font-size: 40px; margin-bottom: 26px; }
  .login-card p { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
  .login-card .field { margin-bottom: 12px; }
  .login-card button[type=submit] { width: 100%; margin-top: 6px; }
  .login-msg { font-size: 12px; color: var(--danger); min-height: 1.3em; margin-top: 8px; }
  .app-hidden { display: none !important; }

  #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--forest); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 80; }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); }

  @media (max-width: 1150px) { #view { padding: 28px; } header.top { padding: 0 28px; } .grid-2 { grid-template-columns: 1fr; } .summary-cards.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 850px) {
    aside { width: 175px; padding: 24px 14px; } main { margin-left: 175px; } .brand { font-size: 30px; }
    h1 { font-size: 40px; } .intro { flex-direction: column; } .co-wrap { justify-items: start; }
  }
  @media (max-width: 600px) {
    aside { position: static; width: 100%; padding: 16px; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { font-size: 26px; } .brand br, .brand span { display: none; }
    nav { margin: 12px 0 0; padding: 0; display: flex; overflow-x: auto; gap: 4px; }
    nav .nav-group, .sidebar-foot { display: none; }
    nav a { white-space: nowrap; padding: 8px; font-size: 11px; } nav a .ic { display: none; }
    main { margin-left: 0; } header.top { padding: 12px 16px; height: auto; flex-wrap: wrap; }
    #view { padding: 22px 16px; } h1 { font-size: 34px; }
    .summary-cards, .summary-cards.four { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .metric { padding: 12px; } .metric strong { font-size: 26px; }
    footer.foot { padding: 16px; display: block; line-height: 2; }
    .table-toolbar .primary { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand">SOI<br><em>Tracker.</em><span>DEPARTMENT TASK TRACKER</span></div>
    <p>Sign in with the credentials your IT admin gave you.</p>
    <form id="loginForm">
      <div class="field"><label for="li-user">Username</label><input id="li-user" autocomplete="username" required></div>
      <div class="field"><label for="li-pass">Password</label><input id="li-pass" type="password" autocomplete="current-password" required></div>
      <button type="submit" class="primary">Sign in</button>
      <div class="login-msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<div id="app" class="app-hidden">
  <aside>
    <a class="brand" href="#departments">SOI<br><em>Tracker.</em><span>SOI · CAS · NANOTECH · REDSUN</span></a>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <span class="live-dot off" id="syncDot"></span><span id="syncText">Connecting…</span>
      <strong id="whoName"></strong>
      <small id="whoRole"></small>
      <button type="button" id="logoutBtn">Sign out</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <div id="breadcrumb">DEPARTMENTS</div>
      <div class="header-tools">
        <a href="https://claude.ai/new" target="_blank" rel="noopener noreferrer" title="Opens claude.ai in a new tab">Claude ↗</a>
        <button type="button" class="pink" id="quickAdd">+ Add row</button>
      </div>
    </header>
    <div id="view"></div>
    <footer class="foot">SOI AVIATION · DEPARTMENT TASK TRACKER <span>Internal use only · Saved to the SOI server</span></footer>
  </main>
</div>

<div id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  // ---------- Constants ----------
  var TOKEN_KEY = "soi_tracker_token";
  var COMPANY_KEY = "soi_tracker_company";
  var ALL = "AOG"; // "All companies" (full-access accounts with more than one company)
  var COMPANY_ORDER = ["SOI Aviation", "CAS", "RedSun Aviation", "NanoTech Aviation"];
  var COMPANY_SHORT = { "SOI Aviation": "SOI", "CAS": "CAS", "RedSun Aviation": "RedSun", "NanoTech Aviation": "Nano" };
  // Tab order follows the design; anything else the server lists comes after.
  var DEPT_ORDER = ["Procurement", "Purchasing", "Warehouse", "IT", "Administrative", "HR", "Accounting & Finance", "Operations", "US Government"];
  var DEPT_SHORT = { "Administrative": "Admin", "Accounting & Finance": "Finance" };
  var DEPT_TAGLINE = {
    "Procurement": "Parts, platforms and customers, plus RFQs and quotes from Pentagon.",
    "Purchasing": "Parts, platforms and customers, plus sales and purchase orders from Pentagon.",
    "Warehouse": "Parts, platforms and customers moving through the warehouse.",
    "Accounting & Finance": "Bank balances, payments to approve, expected receipts and tasks."
  };
  // Procurement / Purchasing / Warehouse use part rows; everything else is projects with sub-tasks.
  var OPS_DEPTS = ["Procurement", "Purchasing", "Warehouse"];
  var DEPARTMENTS_FALLBACK = ["Procurement", "Purchasing", "IT", "HR", "Operations", "US Government", "Warehouse", "Administrative", "Accounting & Finance"];

  // Quick links per department. The department's Claude project (set in
  // /admin.html) is added automatically.
  var DEPARTMENT_RESOURCES = {
    "Procurement": [
      { label: "ILS", url: "https://www.ilsmart.com" },
      { label: "PartsBase", url: "https://www.partsbase.com" },
      { label: "Claude", url: "https://claude.ai" }
    ]
  };

  // Fallback copy of the Pentagon views; the real list comes from
  // /api/pentagon-views (pentagonViews.js on the server).
  var PENTAGON_VIEWS = {
    "Procurement": [
      { id: "rfqs", label: "RFQs", docLabel: "RFQ", queryName: "dashboards.rfq", layout: "doc", tasks: true,
        fields: { key: "RFQ_NO", part: "PN", party: "ACCOUNT_NAME", partyLabel: "Customer", person: "OURCONTACT", due: "DUE_DATE", notes: "NOTES" } },
      { id: "quotes", label: "Quotes", docLabel: "Quote", queryName: "dashboards.quotes", layout: "doc", tasks: true,
        fields: { key: "QUOTE_NO", part: "PN", party: "ACCOUNT_NAME", partyLabel: "Customer", person: "OURCONTACT", due: "DUE_DATE", notes: "NOTES" } }
    ],
    "Purchasing": [
      { id: "sales_orders", label: "Sales Orders", docLabel: "SO", queryName: "dashboards.so", layout: "doc", tasks: true,
        fields: { key: "SO_NO", part: "PN", party: "ACCOUNT_NAME", partyLabel: "Customer", person: "OURCONTACT", due: "DUE_DATE", notes: "NOTES" } },
      { id: "purchase_orders", label: "Purchase Orders", docLabel: "PO", queryName: "dashboards.po", layout: "doc", tasks: true,
        fields: { key: "PO_NO", part: "PN", party: "ACCOUNT_NAME", partyLabel: "Vendor", person: "OURCONTACT", due: "DUE_DATE", notes: "NOTES" } }
    ],
    "Accounting & Finance": [
      { id: "invoices", label: "Invoices", docLabel: "Invoice", queryName: "dashboards.invoice_search", layout: "raw" }
    ]
  };
  var FIELD_GUESSES = {
    key: [["RFQ_NO", "QUOTE_NO", "QT_NO", "PO_NO", "SO_NO", "DOC_NO", "RFQ_NUMBER", "DOC_NUMBER"], ["_NO", "NUMBER"]],
    part: [["PN", "PART_NUMBER", "PART_NO", "PARTNO"], ["PART"]],
    party: [["ACCOUNT_NAME", "CUSTOMER", "CUSTOMER_NAME", "VENDOR", "VENDOR_NAME", "COMPANY_NAME"], ["ACCOUNT_NAME", "CUSTOMER", "VENDOR", "COMPANY"]],
    person: [["OURCONTACT", "BUYER", "SALESPERSON", "ENTERED_BY"], ["OURCONTACT", "BUYER", "SALES", "ENTERED_BY"]],
    due: [["DUE_DATE", "DATE_DUE", "REQUIRED_DATE"], ["DUE"]],
    notes: [["NOTES", "REMARKS", "COMMENTS"], ["NOTE", "REMARK", "COMMENT"]]
  };

  // ---------- State ----------
  var me = null;
  var DEPARTMENTS = [];
  var activeCompany = null;
  var page = "departments";        // departments | overview | mentions | calendar | global | pentagon
  var activeDept = null;
  var subView = {};                // dept -> "tasks" | "finance" | Pentagon view id
  var tasks = [];                  // tasks made in the tracker
  var cards = [];                  // Pentagon rows as task-shaped cards
  var pentagonErrors = [];
  var drafts = [];                 // new rows not saved yet (need a name or part number first)
  var search = "";
  var showSource = "all";          // all | tasks | <Pentagon view id>
  var showPerson = "";
  var addCompany = null;           // which company "+ Add row" uses on the All view
  var claudeProjects = {};
  var usersByCompany = {};         // company -> [usernames] (managers only)
  var finance = null;              // { company, data } or { company, error }
  var loadedOnce = false;
  var pollTimer = null;
  var renderPending = false;
  var focusAfter = null;
  var charts = [];
  var today = new Date().toISOString().slice(0, 10);

  // ---------- Helpers ----------
  function $(s) { return document.querySelector(s); }
  function E(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function sameUser(a, b) { return String(a || "").toLowerCase() === String(b || "").toLowerCase(); }
  function token() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
  function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(String(s).slice(0, 10) + "T00:00:00");
    return isNaN(d) ? String(s) : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function fmtTime(s) {
    if (!s) return "";
    var d = new Date(s);
    return isNaN(d) ? String(s) : d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function money(n) { n = Number(n); return isNaN(n) ? "—" : n.toLocaleString("en-US", { style: "currency", currency: "USD" }); }
  function sum(arr, k) { return arr.reduce(function (s, r) { return s + (Number(r[k]) || 0); }, 0); }
  function isDone(t) { return t.status === "done"; }
  function isOverdue(t) { return !!t.dueDate && !isDone(t) && t.dueDate < today; }
  function shortCo(c) { return c === ALL ? "All" : (COMPANY_SHORT[c] || c); }
  function shortDept(d) { return DEPT_SHORT[d] || d; }
  function isOps(d) { return OPS_DEPTS.indexOf(d) !== -1; }
  function isCard(t) { return t.source === "pentagon"; }
  function safeLink(url) {
    try { var u = new URL(url); return u.protocol === "https:" || u.protocol === "http:" ? u.toString() : null; } catch (e) { return null; }
  }
  function cellText(v) { return v === null || v === undefined ? "" : String(v); }

  var toastTimer = null;
  function toast(msg, isError) {
    var el = $("#toast");
    el.textContent = msg;
    el.className = (isError ? "error " : "") + "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ""; }, 3400);
  }
  function setSync(state, text) {
    $("#syncDot").className = "live-dot" + (state === "off" ? " off" : state === "busy" ? " busy" : "");
    $("#syncText").textContent = text;
  }

  function api(path, options) {
    options = options || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    var t = token();
    if (t) headers.Authorization = "Bearer " + t;
    return fetch(path, Object.assign({}, options, { headers: headers })).then(function (res) {
      if (res.status === 401) { signOut(); throw new Error("Session expired"); }
      if (res.status === 204) return null;
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || "Request failed");
        return data;
      });
    });
  }

  // ---------- Who can do what (the server enforces all of this) ----------
  function isManager() { return !!(me && (me.fullAccess || me.manager)); }
  function canEditTask(t) {
    if (isCard(t)) return isManager();
    return isManager() || sameUser(t.createdBy, me.username);
  }
  function visibleDepartments() {
    var list = me.fullAccess ? DEPARTMENTS.slice() : me.departments.slice();
    return list.sort(function (a, b) {
      var ia = DEPT_ORDER.indexOf(a), ib = DEPT_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
  }
  function myCompanies() {
    return me.companies.slice().sort(function (a, b) {
      var ia = COMPANY_ORDER.indexOf(a), ib = COMPANY_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
  }
  function canUseAll() { return me.fullAccess && me.companies.length > 1; }
  function hasSOI() { return me.companies.indexOf("SOI Aviation") !== -1; }
  function canSeeFinance() {
    return activeCompany !== ALL && (me.fullAccess || me.departments.indexOf("Accounting & Finance") !== -1);
  }
  function pentagonViewsFor(dept) {
    var soi = activeCompany === "SOI Aviation" || (activeCompany === ALL && hasSOI());
    return soi ? (PENTAGON_VIEWS[dept] || []) : [];
  }

  // ---------- Sign in / out ----------
  function showLogin() {
    $("#loginScreen").style.display = "flex";
    $("#app").classList.add("app-hidden");
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  function signOut() { clearToken(); me = null; showLogin(); }
  $("#logoutBtn").addEventListener("click", signOut);

  $("#loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = $("#loginMsg");
    msg.textContent = "";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("#li-user").value.trim(), password: $("#li-pass").value })
    }).then(function (res) {
      return res.json().then(function (data) { if (!res.ok) throw new Error(data.error || "Sign-in failed"); return data; });
    }).then(function (data) {
      setToken(data.token);
      me = data;
      $("#li-pass").value = "";
      onSignedIn();
    }).catch(function (err) { msg.textContent = err.message; });
  });

  function onSignedIn() {
    me.departments = me.departments || [];
    var saved = null;
    try { saved = localStorage.getItem(COMPANY_KEY); } catch (e) {}
    var ok = saved && ((saved === ALL && canUseAll()) || me.companies.indexOf(saved) !== -1);
    activeCompany = ok ? saved : myCompanies()[0];
    $("#whoName").textContent = me.username;
    $("#whoRole").textContent = (me.fullAccess ? "Full access" : me.departments.join(", ")) + (isManager() ? " · Manager" : "");
    $("#loginScreen").style.display = "none";
    $("#app").classList.remove("app-hidden");
    api("/api/departments").then(function (d) { DEPARTMENTS = d; }).catch(function () { DEPARTMENTS = DEPARTMENTS_FALLBACK; }).then(function () {
      var depts = visibleDepartments();
      if (!activeDept || depts.indexOf(activeDept) === -1) activeDept = depts[0] || null;
      readHash();
      render();
      refresh();
      if (!pollTimer) pollTimer = setInterval(refresh, 15000);
    });
    api("/api/pentagon-views").then(function (cfg) {
      if (cfg && cfg.views) PENTAGON_VIEWS = cfg.views;
      if (cfg && cfg.guesses) FIELD_GUESSES = cfg.guesses;
      requestRender();
    }).catch(function () {});
    api("/api/claude-projects").then(function (p) { claudeProjects = p || {}; requestRender(); }).catch(function () {});
  }

  // ---------- Data ----------
  function refresh() {
    if (!me) return;
    setSync("busy", "Syncing…");
    var url = activeCompany === ALL ? "/api/tasks" : "/api/tasks?company=" + encodeURIComponent(activeCompany);
    var wantCards = activeCompany === "SOI Aviation" || (activeCompany === ALL && hasSOI());
    var pentagon = wantCards
      ? api("/api/pentagon-tasks").catch(function () { return { cards: [], errors: ["Couldn't load Pentagon rows."] }; })
      : Promise.resolve({ cards: [], errors: [] });
    var fin = page === "departments" && activeDept === "Accounting & Finance" && canSeeFinance() ? loadFinance() : Promise.resolve();
    loadMineCount().catch(function () {});
    return Promise.all([api(url), pentagon, fin]).then(function (r) {
      tasks = r[0];
      cards = r[1].cards || [];
      pentagonErrors = r[1].errors || [];
      loadedOnce = true;
      setSync("on", "Live");
      requestRender();
    }).catch(function (err) {
      if (err.message === "Session expired") return;
      setSync("off", "Sync error");
      if (!loadedOnce) setTimeout(refresh, 2000);
    });
  }

  function loadFinance() {
    var co = activeCompany;
    return api("/api/finance?company=" + encodeURIComponent(co)).then(function (data) {
      finance = { company: co, data: data };
    }).catch(function (err) { finance = { company: co, error: err.message }; });
  }

  // Responsible / Assigned to lists (managers only — everyone else can't assign).
  function usersFor(company) {
    if (!isManager()) return [];
    if (usersByCompany[company]) return usersByCompany[company];
    usersByCompany[company] = [];
    api("/api/users?company=" + encodeURIComponent(company)).then(function (users) {
      usersByCompany[company] = users.map(function (u) { return u.username; }).sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
      requestRender();
    }).catch(function () {});
    return usersByCompany[company];
  }

  // Don't redraw under someone's cursor: wait until they leave the field.
  function isEditing() {
    var a = document.activeElement;
    return !!(a && $("#view").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox");
  }
  function requestRender() {
    if (isEditing()) { renderPending = true; return; }
    render();
  }
  document.addEventListener("focusout", function () {
    setTimeout(function () { if (renderPending && !isEditing()) { renderPending = false; render(); } }, 60);
  });

  // ---------- Routing ----------
  function navItems() {
    var items = [{ group: "WORK", id: "departments", ic: "▣", label: "Departments" }];
    if (me.fullAccess || me.departments.length > 1) items.push({ id: "overview", ic: "◷", label: "Overview" });
    items.push({ group: "YOU", id: "mentions", ic: "✉", label: "Mentions you", badge: mineOpen });
    var tools = [];
    tools.push({ id: "calendar", ic: "▦", label: "Calendar" });
    if (canUseAll()) tools.push({ id: "global", ic: "◎", label: "Global" });
    if (hasSOI() && (me.fullAccess || me.departments.indexOf("Procurement") !== -1)) tools.push({ id: "pentagon", ic: "⌕", label: "Pentagon" });
    if (tools.length) { tools[0].group = "TOOLS"; items = items.concat(tools); }
    return items;
  }
  function readHash() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var parts = h.split("/");
    if (parts[0] === "dept" && parts[1] && visibleDepartments().indexOf(parts[1]) !== -1) { page = "departments"; activeDept = parts[1]; }
    else if (parts[0] !== "departments" && parts[0] !== "dept" && navItems().some(function (n) { return n.id === parts[0]; })) page = parts[0];
    else page = "departments";
  }
  window.addEventListener("hashchange", function () { if (!me) return; readHash(); render(); if (page === "departments") refresh(); });
  function go(hash) { if (location.hash === "#" + hash) { readHash(); render(); } else location.hash = hash; }

  // ---------- Render ----------
  function render() {
    if (!me) return;
    charts.forEach(function (c) { try { c.destroy(); } catch (e) {} });
    charts = [];
    $("#nav").innerHTML = navItems().map(function (n) {
      var href = n.id === "departments" ? "dept/" + encodeURIComponent(activeDept || "") : n.id;
      return (n.group ? '<div class="nav-group">' + n.group + "</div>" : "") +
        '<a href="#' + href + '" class="' + (n.id === page ? "active" : "") + '"><span class="ic">' + n.ic + "</span>" + E(n.label) +
        (n.badge ? '<span class="badge">' + n.badge + "</span>" : "") + "</a>";
    }).join("");
    $("#quickAdd").style.display = "none";
    var html;
    try {
      if (page === "overview") html = renderOverview();
      else if (page === "mentions") html = renderMentionsShell();
      else if (page === "calendar") html = renderCalendar();
      else if (page === "global") html = renderGlobalShell();
      else if (page === "pentagon") html = renderPentagonShell();
      else html = renderDepartment();
    } catch (e) {
      console.error(e);
      html = '<div class="empty">Something went wrong drawing this page. Reload to try again.</div>';
    }
    $("#view").innerHTML = html;
    autosize();
    afterRender();
  }

  function setBreadcrumb(parts) { $("#breadcrumb").textContent = parts.filter(Boolean).join(" / ").toUpperCase(); }

  function companySwitcher(count) {
    var cos = myCompanies();
    if (canUseAll()) cos.push(ALL);
    if (cos.length <= 1) return "";
    return '<div class="co-wrap"><div class="eyebrow">Company</div><div class="cos" role="radiogroup" aria-label="Company">' +
      cos.map(function (c) {
        var on = c === activeCompany;
        var n = on ? count : 0;
        return '<button type="button" role="radio" aria-checked="' + on + '" class="co ' + (on ? "active" : "") + '" data-co="' + E(c) + '">' +
          E(shortCo(c)) + (n ? '<span class="badge">' + n + "</span>" : "") + "</button>";
      }).join("") + "</div></div>";
  }

  // Everything on a department: tracker tasks and Pentagon cards.
  function deptItems(dept) {
    return tasks.filter(function (t) { return t.department === dept; })
      .concat(cards.filter(function (c) { return c.department === dept; }));
  }
  function openCount(dept) {
    return deptItems(dept).filter(function (t) { return !isDone(t); }).length;
  }

  // ---------- Department page ----------
  function renderDepartment() {
    var depts = visibleDepartments();
    if (!activeDept) return '<div class="empty">Your login has no departments yet. Ask an admin to add one.</div>';
    var dept = activeDept;
    var views = pentagonViewsFor(dept);
    var subs = [];
    if (dept === "Accounting & Finance" && canSeeFinance()) subs.push({ id: "finance", label: "Finance" });
    subs.push({ id: "tasks", label: isOps(dept) ? "Tasks" : "Projects" });
    views.forEach(function (v) { subs.push({ id: v.id, label: v.label }); });
    var sub = subView[dept];
    if (!sub || !subs.some(function (s) { return s.id === sub; })) sub = subView[dept] = subs[0].id;

    var totalOpen = depts.reduce(function (s, d) { return s + openCount(d); }, 0);
    setBreadcrumb(["Departments", shortCo(activeCompany), shortDept(dept)]);

    var links = (DEPARTMENT_RESOURCES[dept] || []).slice();
    if (claudeProjects[dept]) {
      links = links.filter(function (l) { return l.label !== "Claude"; });
      links.push({ label: "Claude project", url: claudeProjects[dept] });
    }
    var linkHtml = links.length ? '<div class="links">' + links.map(function (l) {
      var href = safeLink(l.url);
      return href ? '<a href="' + E(href) + '" target="_blank" rel="noopener noreferrer">' + E(l.label) + " ↗</a>" : "";
    }).join("") + "</div>" : "";

    var head =
      '<div class="intro"><div><div class="eyebrow">Departments / ' + E(shortCo(activeCompany)) + "</div>" +
      "<h1>" + E(dept) + " · " + E(shortCo(activeCompany)) + "</h1>" +
      "<p>" + E(DEPT_TAGLINE[dept] || "Projects, sub-tasks and who's responsible for each.") + "</p>" +
      '<p class="small-note">' + (isManager()
        ? "You're a manager: you can assign anything and tick things off."
        : "You can add your own rows. Only a manager ticks things off; anything a manager gave you is read-only.") +
      " · Saved to the SOI server</p>" + linkHtml + "</div>" +
      companySwitcher(totalOpen) + "</div>" +
      '<div class="tabs" role="tablist">' + depts.map(function (d) {
        var n = openCount(d);
        return '<button type="button" role="tab" class="tab ' + (d === dept ? "active" : "") + '" aria-selected="' + (d === dept) + '" data-dept="' + E(d) + '">' +
          E(shortDept(d)) + (n ? '<span class="badge">' + n + "</span>" : "") + "</button>";
      }).join("") + "</div>" +
      (subs.length > 1 ? '<div class="subbar"><div class="seg">' + subs.map(function (s) {
        return '<button type="button" data-sub="' + E(s.id) + '" class="' + (s.id === sub ? "active" : "") + '">' + E(s.label) + "</button>";
      }).join("") + "</div></div>" : "");

    var body;
    if (sub === "finance") body = renderFinance();
    else if (sub === "tasks") body = isOps(dept) ? renderOpsTable(dept) : renderProjectTable(dept);
    else {
      var view = views.filter(function (v) { return v.id === sub; })[0];
      body = view ? renderPentagonListShell(view) : "";
    }
    return head + body;
  }

  // Search / source / person filters shared by both table layouts.
  function filtered(list) {
    var q = search.trim().toLowerCase();
    return list.filter(function (t) {
      if (showSource === "tasks" && isCard(t)) return false;
      if (showSource !== "all" && showSource !== "tasks" && t.view !== showSource) return false;
      if (showPerson && !sameUser(t.owner, showPerson) && !sameUser(t.createdBy, showPerson)) return false;
      if (!q) return true;
      return [t.title, t.part, t.platform, t.customer, t.party, t.owner, t.notes, t.docNo, t.docLabel, t.company]
        .some(function (v) { return v && String(v).toLowerCase().indexOf(q) !== -1; });
    });
  }
  function sortRows(list) {
    return list.slice().sort(function (a, b) {
      return Number(isDone(a)) - Number(isDone(b)) ||
        String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999")) ||
        (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  function toolbar(dept, addLabel) {
    var views = pentagonViewsFor(dept).filter(function (v) { return v.tasks; });
    var sources = [{ id: "all", label: "All" }, { id: "tasks", label: "Tasks" }].concat(views.map(function (v) { return { id: v.id, label: v.label }; }));
    if (!sources.some(function (s) { return s.id === showSource; })) showSource = "all";
    var html = '<div class="table-toolbar"><input type="search" id="tableSearch" placeholder="Search this table" value="' + E(search) + '">';
    if (sources.length > 2) {
      html += '<div class="seg">' + sources.map(function (s) {
        return '<button type="button" data-source="' + E(s.id) + '" class="' + (s.id === showSource ? "active" : "") + '">' + E(s.label) + "</button>";
      }).join("") + "</div>";
    }
    if (isManager()) {
      var people = {};
      deptItems(dept).forEach(function (t) { if (t.owner) people[t.owner] = 1; if (t.createdBy && !isCard(t)) people[t.createdBy] = 1; });
      var names = Object.keys(people).sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
      if (showPerson && names.indexOf(showPerson) === -1) names.unshift(showPerson);
      html += '<select id="personFilter" aria-label="Show one person"><option value="">Everyone</option>' + names.map(function (n) {
        return '<option value="' + E(n) + '"' + (n === showPerson ? " selected" : "") + ">" + E(n) + "</option>";
      }).join("") + "</select>";
    }
    if (activeCompany === ALL) {
      if (!addCompany) addCompany = myCompanies()[0];
      html += '<select id="addCompany" aria-label="Add rows to">' + myCompanies().map(function (c) {
        return '<option value="' + E(c) + '"' + (c === addCompany ? " selected" : "") + ">Add to " + E(shortCo(c)) + "</option>";
      }).join("") + "</select>";
    }
    if (pentagonErrors.length && views.length) html += '<span class="small-note" title="' + E(pentagonErrors.join("; ")) + '">Some Pentagon rows couldn\'t load.</span>';
    html += '<button type="button" class="primary" data-add="' + E(dept) + '">+ ' + E(addLabel) + "</button></div>";
    return html;
  }

  // ---- inline controls ----
  function input(t, key, val, type, placeholder, enabled) {
    var attrs = ' data-id="' + E(t.id) + '" data-key="' + key + '"' + (enabled ? "" : " disabled");
    if (type === "textarea") return '<textarea class="fb-in fb-notes" rows="1"' + attrs + ' placeholder="' + (enabled ? "Notes…" : "") + '">' + E(val) + "</textarea>";
    if (type === "obsolete") {
      return '<select class="fb-in"' + attrs + ">" + ["No", "Yes"].map(function (o) {
        return '<option value="' + o + '"' + ((val || "No") === o ? " selected" : "") + ">" + o + "</option>";
      }).join("") + "</select>";
    }
    return '<input class="fb-in" type="' + (type || "text") + '"' + attrs + ' value="' + E(val) + '" placeholder="' + (enabled ? E(placeholder || "") : "") + '">';
  }
  function staticCell(v, cls) { return '<span class="static ' + (cls || "") + '">' + (v ? E(v) : '<span class="dim">—</span>') + "</span>"; }
  function doneToggle(t) {
    var done = isDone(t);
    var can = isManager() && !t.draft;
    return '<button type="button" class="toggle ' + (done ? "yes" : "no") + '" data-toggle="' + E(t.id) + '"' + (can ? "" : " disabled") +
      ' title="' + (done ? "Done" : "Not done") + (can ? " — click to change" : " — only a manager can change this") + '" aria-label="' + (done ? "Done" : "Not done") + '">' + (done ? "✓" : "✗") + "</button>";
  }
  function responsibleCell(t) {
    var company = t.company || activeCompany;
    var current = isCard(t) ? t.assignee : t.owner;
    if (!isManager()) return t.draft ? staticCell("You") : staticCell(t.owner);
    var users = usersFor(company).slice();
    if (current && !users.some(function (u) { return sameUser(u, current); })) users.unshift(current);
    var none = isCard(t) && t.pentagonUser ? "Unassigned (" + t.pentagonUser + ")" : "Unassigned";
    return '<select class="fb-in" data-id="' + E(t.id) + '" data-key="owner" aria-label="Responsible"><option value="">' + E(none) + "</option>" +
      users.map(function (u) { return '<option value="' + E(u) + '"' + (sameUser(u, current) ? " selected" : "") + ">" + E(u) + "</option>"; }).join("") + "</select>";
  }
  function delButton(t) {
    if (t.draft) return '<button type="button" class="del" data-cancel="' + E(t.id) + '" title="Discard" aria-label="Discard new row">×</button>';
    if (isCard(t) || !canEditTask(t)) return "";
    return '<button type="button" class="del" data-del="' + E(t.id) + '" title="Delete" aria-label="Delete">×</button>';
  }
  function coNote(t) { return activeCompany === ALL && t.company ? '<span class="co-note">' + E(shortCo(t.company)) + "</span>" : ""; }
  function metric(label, n, note, alert) {
    return '<div class="metric' + (alert ? " alert" : "") + '"><div class="eyebrow">' + E(label) + "</div><strong>" + E(n) + "</strong><small>" + E(note) + "</small></div>";
  }
  function legend() {
    return '<p class="small-note" style="margin-top:12px;">Click a cell to edit; changes save when you leave the field. ✓ done · ✗ not done' +
      (isManager() ? " — click to change." : " — only a manager can change it.") +
      " Pentagon rows come straight from Pentagon; their assignee, ✓ and notes are kept here.</p>";
  }
  function setQuickAdd(label, target) {
    var b = $("#quickAdd");
    b.style.display = "";
    b.textContent = "+ " + label;
    b.dataset.add = target;
  }

  // ---- Procurement / Purchasing / Warehouse ----
  function opsRow(t) {
    var card = isCard(t);
    var ed = t.draft || (!card && canEditTask(t));
    var cls = (isDone(t) ? "done " : "") + (isOverdue(t) ? "overdue " : "") + (t.draft ? "draft" : "");
    var nameCell = card
      ? '<span class="static"><strong>' + E(t.docLabel + " " + t.docNo) + '</strong><span class="src">PENTAGON</span></span>'
      : input(t, "title", t.title, "text", "Task", ed);
    return '<tr class="' + cls + '">' +
      "<td>" + nameCell + coNote(t) + "</td>" +

  function renderProjectTable(dept) {
    var all = tasks.filter(function (t) { return t.department === dept; });
    var ids = {};
    all.forEach(function (t) { ids[t.id] = true; });
    var tops = all.filter(function (t) { return !t.parentId || !ids[t.parentId]; });
    var subsOf = function (p) {
      return all.filter(function (s) { return s.parentId === p.id; })
        .concat(drafts.filter(function (d) { return d.parentId === p.id; }))
        .sort(function (a, b) { return (a.createdAt || 9e15) - (b.createdAt || 9e15); });
    };
    var shown = sortRows(filtered(tops));
    // A project also shows when one of its sub-tasks matches the search or person.
    if (search.trim() || showPerson) {
      tops.forEach(function (p) {
        if (shown.indexOf(p) === -1 && filtered(subsOf(p).filter(function (s) { return !s.draft; })).length) shown.push(p);
      });
    }
    var ds = drafts.filter(function (d) { return d.department === dept && !d.parentId; });
    var open = all.filter(function (t) { return !isDone(t); }).length;
    var late = all.filter(isOverdue).length;
    setQuickAdd("Add project", dept);
    var rows = ds.map(function (d) { return projectRow(d, []); }).join("") +
      shown.map(function (p) { var subs = subsOf(p); return projectRow(p, subs.filter(function (s) { return !s.draft; })) + subs.map(subRow).join(""); }).join("");
    return '<div class="summary-cards">' +
      metric("Projects", tops.length, tops.filter(function (p) { return !isDone(p); }).length + " still open") +

      }).join("") : '<tr><td colspan="5" class="empty">No accounts yet.</td></tr>') + "</tbody></table></div>" +
      sect("Daily payments", "Payments due. A manager ticks Approve and the row moves to Approved to pay.", "dailyPayments", "Add payment") +

          '</td><td class="notes-cell">' + fin("dailyPayments", r, "notes", "textarea") + '</td><td class="center"><input class="check" type="checkbox" data-approve="' + E(r.id) + '"' + (mgr ? "" : " disabled") + ' aria-label="Approve payment to ' + E(r.vendor || "vendor") + '"></td><td>' + del("dailyPayments", r) + "</td></tr>";
      }).join("") : '<tr><td colspan="6" class="empty">Nothing waiting for approval.</td></tr>') + "</tbody></table></div>" +
      sect("Approved to pay", "Untick Approved to send a row back to Daily payments.", "", "") +

          '</td><td class="small-note">' + E(fmtTime(r.approvedAt)) + (r.approvedBy ? "<br>by " + E(r.approvedBy) : "") + '</td><td class="notes-cell">' + fin("approvedToPay", r, "notes", "textarea") +
          '</td><td class="center"><input class="check" type="checkbox" checked data-unapprove="' + E(r.id) + '"' + (mgr ? "" : " disabled") + ' aria-label="Remove approval"></td><td class="center">' + tick("approvedToPay", r, "paid", "Paid") + "</td><td>" + del("approvedToPay", r) + "</td></tr>";
      }).join("") : '<tr><td colspan="8" class="empty">No approved payments yet.</td></tr>') + "</tbody></table></div>" +
      sect("Expected receipts", "Money coming in: who from, how much and when.", "expectedReceipts", "Add receipt") +

      (f.expectedReceipts.length ? f.expectedReceipts.map(function (r) {
        return '<tr class="' + (r.received ? "done " : "") + (r.expected && !r.received && r.expected < today ? "overdue" : "") + '"><td>' + fin("expectedReceipts", r, "party", "text", "Customer or vendor") + "</td><td>" + fin("expectedReceipts", r, "amount", "number", "0.00") +
          "</td><td>" + fin("expectedReceipts", r, "expected", "date") + '</td><td class="center">' + tick("expectedReceipts", r, "received", "Received") + '</td><td class="notes-cell">' + fin("expectedReceipts", r, "notes", "textarea") + "</td><td>" + del("expectedReceipts", r) + "</td></tr>";
      }).join("") : '<tr><td colspan="6" class="empty">No expected receipts yet.</td></tr>') + "</tbody></table></div>";
  }
  function financeOp(body, okMsg) {

  function financeDefaults(list) {
    if (list === "accounts") return { name: "", balance: 0, asOf: today, notes: "" };
    if (list === "dailyPayments") return { vendor: "", amount: 0, due: today, notes: "" };

  // ---- Pentagon lists (RFQs, Quotes, SOs, POs, Invoices) ----
  var docState = { view: null, rows: null, marks: {}, showAll: false, filters: {} };
  function renderPentagonListShell(view) {
    var f = docState.filters[view.id] || { from: "", to: "", status: "", account: "" };
    setTimeout(function () { runPentagonList(view); }, 0);
    return '<div class="filter-bar">' +
      '<div class="field"><label for="plv-from">From</label><input type="date" id="plv-from" value="' + E(f.from) + '"></div>' +
      '<div class="field"><label for="plv-to">To</label><input type="date" id="plv-to" value="' + E(f.to) + '"></div>' +
      '<div class="field"><label for="plv-status">Status</label><input id="plv-status" placeholder="Any" value="' + E(f.status) + '"></div>' +
      '<div class="field"><label for="plv-account">Account #</label><input id="plv-account" placeholder="Any" value="' + E(f.account) + '"></div>' +
      '<button type="button" class="primary" id="plv-search">Search</button><span class="small-note" id="plv-msg"></span></div>' +
      '<div class="grid-2" id="plv-charts" style="display:none;margin-bottom:18px;">' +
      '<div class="card"><div class="card-label" id="plv-line-title">Total value over time</div><div class="chart-wrap"><canvas id="plv-line"></canvas></div></div>' +
      '<div class="card"><div class="card-label" id="plv-pie-title">By status</div><div class="chart-wrap"><canvas id="plv-pie"></canvas></div></div></div>' +
      '<div id="plv-toolbar" class="table-toolbar" style="display:none;"></div>' +
      '<div class="table-wrap"><table class="wide" id="plv-table" style="display:none;"></table><div class="empty" id="plv-empty">Loading…</div></div>';
  }
  function findField(row, exact, subs) {
    var keys = Object.keys(row);
    for (var i = 0; i < exact.length; i++) if (keys.indexOf(exact[i]) !== -1) return exact[i];
    for (var j = 0; j < keys.length; j++) for (var k = 0; k < subs.length; k++) if (keys[j].toUpperCase().indexOf(subs[k]) !== -1) return keys[j];
    return null;
  }
  function docField(view, row, name) {
    var named = view.fields && view.fields[name];
    if (named && Object.prototype.hasOwnProperty.call(row, named)) return named;
    var g = FIELD_GUESSES[name];
    return g ? findField(row, g[0], g[1]) : null;
  }
  function markKey(view, docNo) { return view.id === "rfqs" ? docNo : view.id + ":" + docNo; }
  function docLabelOf(view) { return view.docLabel || (view.fields && view.fields.docLabel) || "Doc"; }
  function findResultRows(data) {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.rows)) return data.rows;
    if (data && Array.isArray(data.result_sets) && data.result_sets[0] && Array.isArray(data.result_sets[0].rows)) return data.result_sets[0].rows;
    return null;
  }
  function autoTable(rows) {
    if (!rows || !rows.length) return null;
    var cols = [];
    rows.forEach(function (r) { Object.keys(r).forEach(function (k) { if (cols.indexOf(k) === -1) cols.push(k); }); });
    return "<thead><tr>" + cols.map(function (c) { return "<th>" + E(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      rows.map(function (r) { return "<tr>" + cols.map(function (c) { return '<td style="padding:10px 12px;">' + E(cellText(r[c])) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
  }
  function runPentagonList(view) {
    var btn = $("#plv-search");
    if (!btn) return;
    btn.onclick = function () { runPentagonList(view); };
    var f = docState.filters[view.id] = {
      from: $("#plv-from").value, to: $("#plv-to").value, status: $("#plv-status").value.trim(), account: $("#plv-account").value.trim()
    };
    $("#plv-msg").textContent = "Searching…";
    api("/api/pentagon/" + encodeURIComponent(view.queryName), {
      method: "POST",
      body: JSON.stringify({ params: { date_from: f.from, date_to: f.to, status: f.status, account_no: f.account }, limit: 200 })
    }).then(function (data) {
      if (!$("#plv-table")) return;
      $("#plv-msg").textContent = "";
      var rows = findResultRows(data);
      try { pentagonCharts("plv", rows); } catch (e) { console.error(e); }
      if (view.layout === "doc" && rows && rows.length) {
        docState.view = view;
        docState.rows = rows;
        return api("/api/rfq-marks").catch(function () { return {}; }).then(function (m) {
          docState.marks = m || {};
          drawDocTable();
        });
      }
      $("#plv-toolbar").style.display = "none";
      var html = autoTable(rows);
      if (!html) {
        $("#plv-table").style.display = "none";
        $("#plv-empty").style.display = "block";
        $("#plv-empty").textContent = rows && rows.length === 0 ? "No results for those filters." : "No table-shaped data came back.";
        return;
      }
      $("#plv-table").innerHTML = html;
      $("#plv-table").style.display = "table";
      $("#plv-empty").style.display = "none";
    }).catch(function (err) {
      if (!$("#plv-table")) return;
      $("#plv-msg").textContent = "";
      $("#plv-table").style.display = "none";
      $("#plv-empty").style.display = "block";
      $("#plv-empty").textContent = err.message || "Search failed.";
    });
  }
  function drawDocTable() {
    var view = docState.view, rows = docState.rows || [];
    var table = $("#plv-table"), empty = $("#plv-empty"), bar = $("#plv-toolbar");
    if (!table || !rows.length) return;
    var sample = rows[0], f = {};
    ["key", "part", "party", "person", "due", "notes"].forEach(function (k) { f[k] = docField(view, sample, k); });
    var mgr = isManager();
    var missing = [];
    if (!f.part) missing.push("part number");
    if (!f.person) missing.push("Pentagon user");
    bar.style.display = "flex";
    bar.innerHTML = '<label class="small-note" style="display:flex;gap:6px;align-items:center;cursor:pointer;"><input type="checkbox" class="check" id="plv-all"' + (docState.showAll ? " checked" : "") + "> Show all Pentagon columns</label>" +
      '<span class="small-note">' + (mgr ? "Assign, tick ✓ / ✗ and add notes — managers only." : "Only managers can assign, tick or add notes.") + "</span>" +
      (missing.length ? '<span class="small-note">This query doesn\'t return ' + missing.join(" or ") + " yet.</span>" : "") +
      (f.key ? "" : '<span class="small-note" style="color:var(--danger)">No document number column found, so changes can\'t be saved.</span>');
    $("#plv-all").onchange = function () { docState.showAll = this.checked; drawDocTable(); };
    if (docState.showAll) {
      table.innerHTML = autoTable(rows);
    } else {
      var users = mgr ? usersFor("SOI Aviation") : [];
      table.innerHTML = "<thead><tr><th>Part number</th><th>" + E((view.fields && view.fields.partyLabel) || "Customer") + "</th><th>Pentagon user</th><th>Due date</th><th>Assigned to</th><th>Done</th><th>Notes</th></tr></thead><tbody>" +
        rows.map(function (r, i) {
          var docNo = f.key ? cellText(r[f.key]) : "";
          var key = docNo ? markKey(view, docNo) : "";
          var m = key ? docState.marks[key] || {} : {};
          var done = !!m.done;
          var assignee = m.assignee || "";
          var opts = users.concat(assignee && !users.some(function (u) { return sameUser(u, assignee); }) ? [assignee] : []);
          var assign = mgr && key
            ? '<select class="fb-in" data-doc="' + i + '" data-doc-act="assign" aria-label="Assigned to"><option value="">Unassigned</option>' +
              opts.map(function (u) { return '<option value="' + E(u) + '"' + (sameUser(u, assignee) ? " selected" : "") + ">" + E(u) + "</option>"; }).join("") + "</select>"
            : staticCell(assignee);
          var tick = '<button type="button" class="toggle ' + (done ? "yes" : "no") + '" data-doc="' + i + '" data-doc-act="toggle"' + (mgr && key ? "" : " disabled") + ' aria-label="' + (done ? "Done" : "Not done") + '">' + (done ? "✓" : "✗") + "</button>";
          var pnote = f.notes ? cellText(r[f.notes]) : "";
          var notes = (mgr && key
            ? '<textarea class="fb-in fb-notes" rows="1" data-doc="' + i + '" data-doc-act="notes" placeholder="Notes…">' + E(m.notes || "") + "</textarea>"
            : staticCell(m.notes)) + (pnote ? '<span class="co-note">Pentagon: ' + E(pnote) + "</span>" : "");
          var part = f.part ? cellText(r[f.part]) : "";
          return '<tr class="' + (done ? "done" : "") + '"><td><span class="static">' + (part ? E(part) : '<span class="dim">—</span>') + "</span>" +
            (docNo ? '<span class="co-note">' + E(docLabelOf(view)) + " " + E(docNo) + "</span>" : "") + "</td>" +
            "<td>" + staticCell(f.party ? cellText(r[f.party]) : "") + "</td>" +
            "<td>" + staticCell(f.person ? cellText(r[f.person]) : "") + "</td>" +
            "<td>" + staticCell(f.due ? fmtDate(cellText(r[f.due])) : "") + "</td>" +
            "<td>" + assign + '</td><td class="center">' + tick + '</td><td class="notes-cell">' + notes + "</td></tr>";
        }).join("") + "</tbody>";
    }
    table.style.display = "table";
    empty.style.display = "none";
    autosize();
    function info(i) {
      var r = rows[i], docNo = cellText(r[f.key]);
      return {
        key: markKey(view, docNo),
        snapshot: { label: docLabelOf(view), docNo: docNo, party: f.party ? cellText(r[f.party]) : "", dueDate: f.due ? cellText(r[f.due]).slice(0, 10) : "", pentagonUser: f.person ? cellText(r[f.person]) : "" }

    $("#pq-name").value = name; $("#pq-params").value = JSON.stringify(params || {}, null, 2); $("#pq-limit").value = limit || 10;
    $("#pq-status").textContent = "Running…";
    api("/api/pentagon/" + encodeURIComponent(name), { method: "POST", body: JSON.stringify({ params: params || {}, limit: limit || 10 }) }).then(function (data) {
      $("#pq-status").textContent = "Done.";
      $("#pq-result").textContent = JSON.stringify(data, null, 2);
      var rows = findResultRows(data), html = autoTable(rows);
      if (!html) { $("#pq-table").style.display = "none"; $("#pq-empty").style.display = "block"; $("#pq-empty").textContent = rows && !rows.length ? "Query ran fine — no rows came back." : "No table-shaped data in this response — see raw response below."; return; }
      $("#pq-table").innerHTML = html; $("#pq-table").style.display = "table"; $("#pq-empty").style.display = "none";
    }).catch(function (err) {
      $("#pq-status").textContent = "Error.";
      $("#pq-table").style.display = "none"; $("#pq-empty").style.display = "block";
      $("#pq-empty").textContent = err.message || "Query failed."; $("#pq-result").textContent = err.message || "Query failed.";
    });
  }
  function loadPresets() {
    api("/api/pentagon-presets").then(function (presets) {
      var wrap = $("#pq-presets");
      if (!wrap) return;
      $("#pq-presets-empty").style.display = presets.length ? "none" : "block";
      wrap.innerHTML = presets.map(function (p) {
        return '<span class="chip"><button type="button" class="text-button" style="color:var(--ink);text-decoration:none;font-size:12px;" data-preset="' + E(p.id) + '">' + E(p.name) +
          '</button><button type="button" class="x" data-preset-del="' + E(p.id) + '" title="Remove" aria-label="Remove saved search">×</button></span>';
      }).join("");
      wrap.querySelectorAll("[data-preset]").forEach(function (b) {
        b.onclick = function () { var p = presets.filter(function (x) { return x.id === b.dataset.preset; })[0]; if (p) runPq(p.queryName, p.params, p.limit); };
      });
      wrap.querySelectorAll("[data-preset-del]").forEach(function (b) {
        b.onclick = function () {
          var p = presets.filter(function (x) { return x.id === b.dataset.presetDel; })[0];
          if (!p || !confirm('Remove saved search "' + p.name + '"?')) return;
          api("/api/pentagon-presets/" + encodeURIComponent(p.id), { method: "DELETE" }).then(loadPresets).catch(function (err) { toast(err.message, true); });
        };
      });
    }).catch(function () { toast("Couldn't load saved searches.", true); });
  }

  // ---------- After each render: charts, focus, Pentagon tester buttons ----------
  function afterRender() {
    if (page === "overview") drawOverviewCharts();
    if (page === "pentagon") {
      $("#pq-run").onclick = function () {
        var params;
        try { params = readPq(); } catch (e) { $("#pq-status").textContent = "Params isn't valid JSON: " + e.message; return; }
        if (!pq.name) { $("#pq-status").textContent = "Enter a query name."; return; }
        runPq(pq.name, params, pq.limit);
      };
      $("#pq-save").onclick = function () {
        var params;
        try { params = readPq(); } catch (e) { toast("Params isn't valid JSON.", true); return; }
        if (!pq.name) { toast("Enter a query name first.", true); return; }
        var name = prompt("Name this saved search:", pq.name);
        if (!name) return;
        api("/api/pentagon-presets", { method: "POST", body: JSON.stringify({ name: name, queryName: pq.name, params: params, limit: pq.limit }) })
          .then(function () { toast("Saved."); loadPresets(); }).catch(function (err) { toast(err.message || "Couldn't save.", true); });
      };
    }
    if (focusAfter) {
      var el = document.querySelector('#view [data-id="' + focusAfter.id + '"][data-key="' + focusAfter.key + '"]');
      if (el) el.focus();
      focusAfter = null;
    }
  }
  function autosize() {
    document.querySelectorAll("#view .fb-notes").forEach(function (t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; });
  }

  // ---------- Writes ----------
  function findItem(id) {
    return tasks.filter(function (t) { return t.id === id; })[0] ||
      cards.filter(function (t) { return t.id === id; })[0] ||
      drafts.filter(function (t) { return t.id === id; })[0] || null;
  }
  function replaceTask(t) {
    var i = tasks.findIndex(function (x) { return x.id === t.id; });
    if (i === -1) tasks.unshift(t); else tasks[i] = t;
  }
  function patchTask(t, change) {
    setSync("busy", "Saving…");
    return api("/api/tasks/" + encodeURIComponent(t.id), { method: "PATCH", body: JSON.stringify(change) })
      .then(function (updated) { setSync("on", "Live"); replaceTask(updated); requestRender(); })
      .catch(function (err) { setSync("on", "Live"); if (err.message !== "Session expired") toast(err.message, true); refresh(); });
  }
  function cardChange(t, change) {
    return saveMark(t.view, t.markKey, { label: t.docLabel, docNo: t.docNo, party: t.party, dueDate: t.dueDate, pentagonUser: t.pentagonUser }, change)
      .then(function () { refresh(); }).catch(function () { refresh(); });
  }
  function newDraft(dept, parentId) {
    var co = activeCompany === ALL ? (addCompany || myCompanies()[0]) : activeCompany;
    if (parentId) { var parent = findItem(parentId); if (parent && parent.company) co = parent.company; }
    var d = {
      id: "draft-" + Date.now() + "-" + Math.random().toString(16).slice(2, 6), draft: true, company: co, department: dept,
      title: "", part: "", platform: "", customer: "", obsolete: "No", dueDate: "", notes: "", owner: "", status: "todo"
    };
    if (parentId) d.parentId = parentId;
    drafts.unshift(d);
    focusAfter = { id: d.id, key: "title" };
    render();
  }
  // A draft becomes a real row once it has a name or a part number.
  function saveDraft(d) {
    if (d.saving || (!String(d.title).trim() && !String(d.part).trim())) return;
    d.saving = true;
    var body = { company: d.company, department: d.department, title: d.title, part: d.part, platform: d.platform, customer: d.customer, obsolete: d.obsolete, dueDate: d.dueDate, notes: d.notes };
    if (d.parentId) body.parentId = d.parentId;
    if (isManager()) body.owner = d.owner;
    setSync("busy", "Saving…");
    api("/api/tasks", { method: "POST", body: JSON.stringify(body) }).then(function (t) {
      setSync("on", "Live");
      drafts = drafts.filter(function (x) { return x !== d; });
      replaceTask(t);
      toast("Saved.");
      requestRender();
    }).catch(function (err) {
      d.saving = false;
      setSync("on", "Live");
      toast(err.message, true);
    });
  }
  function addFor(target) {
    if (!target) return;
    if (target.indexOf("fin:") === 0) {
      var list = target.slice(4);
      financeOp({ op: "add", list: list, fields: financeDefaults(list) }, "Row added.");
      return;
    }
    newDraft(target, null);
  }
  $("#quickAdd").addEventListener("click", function () { addFor(this.dataset.add); });

  document.addEventListener("click", function (e) {
    if (!me) return;
    var mineLink = e.target.closest("[data-mine-co]");
    if (mineLink && mineLink.dataset.mineCo !== activeCompany && me.companies.indexOf(mineLink.dataset.mineCo) !== -1) {
      activeCompany = mineLink.dataset.mineCo;
      try { localStorage.setItem(COMPANY_KEY, activeCompany); } catch (x) {}
      tasks = []; cards = []; drafts = []; finance = null;
    }
    var cd = e.target.closest("[data-cal-days]");
    if (cd && $("#view").contains(cd)) { calDays = +cd.dataset.calDays; render(); return; }
    var t = e.target.closest("[data-co],[data-dept],[data-sub],[data-source],[data-add],[data-add-sub],[data-del],[data-cancel],[data-toggle],[data-fin-del]");
    if (!t || !$("#view").contains(t)) return;
    var d = t.dataset;
    if (d.co) {
      if (d.co === activeCompany) return;
      activeCompany = d.co;
      try { localStorage.setItem(COMPANY_KEY, activeCompany); } catch (x) {}
      tasks = []; cards = []; drafts = []; finance = null; showPerson = ""; breakdown.at = 0;
      render(); refresh();
    } else if (d.dept) {
      search = ""; showPerson = ""; showSource = "all";
      go("dept/" + encodeURIComponent(d.dept));
    } else if (d.sub) {
      subView[activeDept] = d.sub;
      render();
      if (d.sub === "finance") refresh();
    } else if (d.source) {
      showSource = d.source; render();
    } else if (d.add) {
      addFor(d.add);
    } else if (d.addSub) {
      newDraft(activeDept, d.addSub);
    } else if (d.cancel) {
      drafts = drafts.filter(function (x) { return x.id !== d.cancel; }); render();
    } else if (d.del) {
      var item = findItem(d.del);
      if (!item) return;
      var subs = tasks.filter(function (x) { return x.parentId === item.id; }).length;
      if (!confirm("Delete " + (item.title || item.part || "this row") + "?" + (subs ? " Its " + subs + " sub-task" + (subs === 1 ? "" : "s") + " will go too." : ""))) return;
      api("/api/tasks/" + encodeURIComponent(item.id), { method: "DELETE" }).then(function () {
        tasks = tasks.filter(function (x) { return x.id !== item.id && x.parentId !== item.id; });
        toast("Deleted."); render();
      }).catch(function (err) { toast(err.message, true); refresh(); });
    } else if (d.toggle) {
      var it = findItem(d.toggle);
      if (!it || !isManager()) return;
      var next = isDone(it) ? "todo" : "done";
      if (isCard(it)) cardChange(it, { status: next });
      else patchTask(it, { status: next });
    } else if (d.finDel) {
      if (!confirm("Delete this row?")) return;
      financeOp({ op: "delete", list: d.finDel, id: d.fid }, "Row removed.");
    }
  });

  document.addEventListener("change", function (e) {
    if (!me) return;
    var el = e.target;
    if (!$("#view").contains(el)) return;
    if (el.id === "personFilter") { showPerson = el.value; render(); return; }
    if (el.id === "addCompany") { addCompany = el.value; return; }
    if (el.dataset.approve) { financeOp({ op: "approve", list: "dailyPayments", id: el.dataset.approve }, "Approved to pay. Nothing has been sent."); return; }
    if (el.dataset.unapprove) { financeOp({ op: "unapprove", list: "approvedToPay", id: el.dataset.unapprove }, "Approval removed."); return; }
    if (el.dataset.finTick) { var tf = {}; tf[el.dataset.key] = el.checked; financeOp({ op: "update", list: el.dataset.finTick, id: el.dataset.fid, fields: tf }); return; }
    if (el.dataset.fin) {
      var ff = {}; ff[el.dataset.key] = el.type === "number" ? (el.value === "" ? 0 : Number(el.value)) : el.value;
      financeOp({ op: "update", list: el.dataset.fin, id: el.dataset.fid, fields: ff });
      return;
    }
    if (!el.dataset.id || !el.dataset.key) return;
    var item = findItem(el.dataset.id);
    if (!item) return;
    var key = el.dataset.key, value = el.value;
    if (item.draft) { item[key] = value; saveDraft(item); return; }
    if (isCard(item)) {
      if (key === "owner") cardChange(item, { assignee: value });
      else if (key === "notes") cardChange(item, { notes: value });
      return;
    }
    var change = {}; change[key] = value;
    item[key] = value;
    patchTask(item, change);
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "tableSearch") {
      search = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var s = $("#tableSearch");
      if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (x) {} }
      return;
    }
    if (e.target.classList && e.target.classList.contains("fb-notes")) {
      e.target.style.height = "auto";
      e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px";
    }
  });

  // ---------- Init ----------
  function init() {
    if (!token()) { showLogin(); return; }
    api("/api/me").then(function (data) { me = data; onSignedIn(); }).catch(function () { clearToken(); showLogin(); });
  }
  init();
})();
</script>
</body>
</html>
