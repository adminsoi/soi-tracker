  // ---- IT requests (IT → Requests) ----
  // Every IT form response: the Excel import plus new ones the flow emails.
  // Tabs by status (New / In progress / Resolved); tick rows to change many
  // at once. Managers give each an internal priority (P1–P4, separate from
  // the form's own urgency). People are matched across spellings (below).
  var IT_PRIOS = [
    { id: "P1", label: "P1 · Critical", note: "drop everything" },
    { id: "P2", label: "P2 · High", note: "today" },
    { id: "P3", label: "P3 · Normal", note: "this week" },
    { id: "P4", label: "P4 · Low", note: "when there's time" }
  ];
  var IT_STATUSES = [
    { id: "new", label: "New", note: "Just came in from the form" },
    { id: "progress", label: "In progress", note: "Being worked on" },
    { id: "done", label: "Resolved", note: "Fixed and closed" }
  ];
  var IT_STATUS_LABEL = { new: "New", progress: "In progress", done: "Resolved" };
  var itr = { data: null, at: 0, loading: false, error: "", person: "", tab: "all", sort: "newest", picked: {}, adding: false, form: {}, saving: false };
  function canSeeItRequests() { return !!(me && (me.fullAccess || me.departments.indexOf("IT") !== -1)); }
  function loadItRequests() {
    if (itr.loading) return;
    itr.loading = true;
    api("/api/it-requests").then(function (d) { matchPeople(d.requests); itr.data = d; itr.error = ""; }, function (err) { itr.error = err.message; })
      .then(function () { itr.loading = false; itr.at = Date.now(); requestRender(); });
  }

  // One person, however they typed their name: "ELVIS", "elvis" and
  // "Elvis Smith" are the same. Requests join up on the same name (ignoring
  // capitals and spacing), or the same email when the names agree; a first
  // name on its own joins a full name when only one person has that first
  // name. Names show in normal capitals. Sets r.pkey and r.pname.
  function matchPeople(list) {
    var parent = [];
    var find = function (i) { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    var join = function (a, b) { a = find(a); b = find(b); if (a !== b) parent[b] = a; };
    var norm = function (n) { return String(n || "").toLowerCase().replace(/[^a-zÀ-ɏ'\- ]+/g, " ").replace(/\s+/g, " ").trim(); };
    // Two names can be one person: the same, one missing, a first name on
    // its own, or an initial ("J Smith" / "John Smith").
    var fits = function (a, b) {
      if (!a || !b || a === b) return true;
      var x = a.split(" "), y = b.split(" ");
      if (x.length === 1 || y.length === 1) return x[0] === y[0] || (x[0].length === 1 || y[0].length === 1) && x[0][0] === y[0][0];
      return x[x.length - 1] === y[y.length - 1] && x[0][0] === y[0][0] && (x[0].length === 1 || y[0].length === 1 || x[0] === y[0]);
    };
    var byEmail = {}, byName = {};
    list.forEach(function (r, i) {
      parent[i] = i;
      var em = String(r.email || "").trim().toLowerCase();
      var nm = String(r.name || "").indexOf("@") === -1 ? norm(r.name) : "";
      r._em = em; r._nm = nm;
      if (nm) { if (byName[nm] != null) join(byName[nm], i); else byName[nm] = i; }
      // A shared address (front desk, a manager filing for someone) mustn't
      // merge different people, so the names have to agree too.
      if (em) {
        (byEmail[em] = byEmail[em] || []).forEach(function (k) { if (fits(nm, list[k]._nm)) join(k, i); });
        byEmail[em].push(i);
      }
    });
    // First name only -> the one person whose full name starts with it.
    var fullByFirst = {};
    list.forEach(function (r, i) {
      if (r._nm.indexOf(" ") === -1) return;
      var f = r._nm.split(" ")[0];
      (fullByFirst[f] = fullByFirst[f] || {})[find(i)] = 1;
    });
    list.forEach(function (r, i) {
      if (!r._nm || r._nm.indexOf(" ") !== -1) return;
      var roots = Object.keys(fullByFirst[r._nm] || {}).map(function (x) { return find(+x); });
      var uniq = roots.filter(function (x, k) { return roots.indexOf(x) === k; });
      if (uniq.length === 1) join(uniq[0], i);
    });
    // Display name: the fullest version used, in normal capitals.
    var names = {};
    list.forEach(function (r, i) {
      var g = find(i), n = names[g] || (names[g] = { counts: {}, email: "" });
      if (r._nm) n.counts[r._nm] = (n.counts[r._nm] || 0) + 1;
      if (!n.email && r._em) n.email = r._em;
    });
    var title = function (n) { return n.replace(/(^|[\s'\-])([a-zà-ɏ])/g, function (m, a, b) { return a + b.toUpperCase(); }); };
    list.forEach(function (r, i) {
      var g = find(i), n = names[g];
      var best = Object.keys(n.counts).sort(function (a, b) {
        return b.split(" ").length - a.split(" ").length || n.counts[b] - n.counts[a] || b.length - a.length;
      })[0];
      r.pkey = "p" + g;
      r.pname = best ? title(best) : n.email || "Unknown";
      delete r._em; delete r._nm;
    });
    return list;
  }
  function itrPerson(r) { return r.pname || r.name || r.email || "Unknown"; }

  // Duplicates. r.duplicateOf links a request to its original (set by a
  // manager). r.repeatOf is only a hint: the same person sent something
  // similar (or anything on the same day) in the 7 days before, and nobody
  // has said "not a duplicate". r.dupes counts duplicates on an original.
  var STOP = { the: 1, and: 1, for: 1, you: 1, please: 1, with: 1, this: 1, that: 1, have: 1, can: 1, not: 1, are: 1, was: 1, but: 1, all: 1, our: 1, from: 1, need: 1, issue: 1, help: 1, its: 1, it: 1 };
  function words(t) {
    var w = {};
    String(t || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(" ").forEach(function (x) { if (x.length > 2 && !STOP[x]) w[x] = 1; });
    return w;
  }
  function similar(a, b) {
    var x = words(a), y = words(b), both = 0, either = 0, k;
    for (k in x) { either++; if (y[k]) both++; }
    for (k in y) if (!x[k]) either++;
    return either ? both / either : 0;
  }
  function findRepeats(list) {
    var byId = {}, byPerson = {};
    list.forEach(function (r) { byId[r.id] = r; r.repeatOf = ""; r.dupes = 0; });
    list.forEach(function (r) { if (r.duplicateOf && byId[r.duplicateOf]) byId[r.duplicateOf].dupes++; });
    list.forEach(function (r) { if (!r.duplicateOf) (byPerson[r.pkey] = byPerson[r.pkey] || []).push(r); });
    Object.keys(byPerson).forEach(function (k) {
      var mine = byPerson[k].slice().sort(function (a, b) { return String(a.submittedAt).localeCompare(String(b.submittedAt)); });
      mine.forEach(function (r, i) {
        if (r.notDuplicate) return;
        var t = Date.parse(String(r.submittedAt).replace(" ", "T"));
        for (var j = i - 1; j >= 0; j--) {
          var o = mine[j], ot = Date.parse(String(o.submittedAt).replace(" ", "T"));
          if (t - ot > 7 * 864e5) break;
          if (String(o.submittedAt).slice(0, 10) === String(r.submittedAt).slice(0, 10) || similar(r.issue, o.issue) >= 0.3) { r.repeatOf = o.id; break; }
        }
      });
    });
    return byId;
  }

  function renderItRequests() {
    if (!itr.data || Date.now() - itr.at > 120000) loadItRequests();
    if (itr.error) return '<div class="banner">' + E(itr.error) + "</div>";
    if (!itr.data) return '<div class="empty">Loading requests…</div>';
    var every = itr.data.requests, can = itr.data.canRate;
    var byId = findRepeats(every);
    var dupes = every.filter(function (r) { return r.duplicateOf; });
    // Duplicates live on their own tab; everything else counts once.
    var all = every.filter(function (r) { return !r.duplicateOf; });
    var since30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    var count = function (st) { return all.filter(function (r) { return r.status === st; }).length; };
    var first = all.length ? all[all.length - 1].submittedAt : "";
    var unrated = all.filter(function (r) { return r.status !== "done" && !r.priority; }).length;

    // By person
    var people = {};
    all.forEach(function (r) {
      var p = people[r.pkey] || (people[r.pkey] = { key: r.pkey, name: itrPerson(r), company: r.company, n: 0, new: 0, progress: 0, done: 0, p12: 0, last: "" });
      p.n++; p[r.status] = (p[r.status] || 0) + 1;
      if (r.priority === "P1" || r.priority === "P2") p.p12++;
      if (r.submittedAt > p.last) p.last = r.submittedAt;
      if (!p.company && r.company) p.company = r.company;
    });
    var plist = Object.keys(people).map(function (k) { return people[k]; })
      .sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name); });
    if (itr.person && !people[itr.person]) itr.person = "";

    var mineOnly = function (r) { return !itr.person || r.pkey === itr.person; };
    var inPerson = all.filter(mineOnly);
    var hints = inPerson.filter(function (r) { return r.repeatOf && r.status !== "done"; });
    var rows = itr.tab === "dupes"
      ? hints.concat(dupes.filter(mineOnly))
      : inPerson.filter(function (r) { return itr.tab === "all" || r.status === itr.tab; });
    var prank = function (r) { return r.priority ? +r.priority.slice(1) : 9; };
    rows.sort(function (a, b) {
      if (itr.sort === "oldest") return String(a.submittedAt).localeCompare(String(b.submittedAt));
      if (itr.sort === "priority") return prank(a) - prank(b) || String(b.submittedAt).localeCompare(String(a.submittedAt));
      if (itr.sort === "person") return itrPerson(a).localeCompare(itrPerson(b)) || String(b.submittedAt).localeCompare(String(a.submittedAt));
      return String(b.submittedAt).localeCompare(String(a.submittedAt));
    });
    // Keep only ticks on rows that still exist.
    var ids = {}; every.forEach(function (r) { ids[r.id] = 1; });
    Object.keys(itr.picked).forEach(function (id) { if (!ids[id]) delete itr.picked[id]; });
    var picked = Object.keys(itr.picked);
    var allShownPicked = rows.length > 0 && rows.every(function (r) { return itr.picked[r.id]; });

    var prioCell = function (r) {
      if (!can) return r.priority ? '<span class="prio prio-' + r.priority + '">' + E(r.priority) + "</span>" : '<span class="prio prio-none">Not rated</span>';
      return '<select class="fb-in" data-itr-prio="' + E(r.id) + '" aria-label="Internal priority"><option value="">Rate…</option>' + IT_PRIOS.map(function (p) {
        return '<option value="' + p.id + '"' + (r.priority === p.id ? " selected" : "") + ">" + E(p.label) + "</option>";
      }).join("") + "</select>";
    };
    var statusCell = function (r) {
      if (r.duplicateOf) {
        if (!can) return '<span class="st st-dup">Duplicate</span>';
        // Picking a status takes it out of duplicates.
        return '<select class="st-select st-dup" data-itr-st="' + E(r.id) + '" aria-label="Status"><option value="dup" selected>Duplicate</option>' + IT_STATUSES.map(function (s) {
          return '<option value="' + s.id + '">Move to ' + E(s.label) + "</option>";
        }).join("") + "</select>";
      }
      if (!can) return '<span class="st st-' + r.status + '">' + E(IT_STATUS_LABEL[r.status]) + "</span>";
      return '<select class="st-select st-' + r.status + '" data-itr-st="' + E(r.id) + '" aria-label="Status">' + IT_STATUSES.map(function (s) {
        return '<option value="' + s.id + '"' + (r.status === s.id ? " selected" : "") + ">" + E(s.label) + "</option>";
      }).join("") + "</select>";
    };
    var when = function (s) { return s ? E(fmtDate(s)) + '<span class="co-note">' + E(String(s).slice(11, 16)) + "</span>" : "—"; };
    var tabCount = function (st) {
      if (st === "dupes") return dupes.filter(mineOnly).length;
      return st === "all" ? inPerson.length : inPerson.filter(function (r) { return r.status === st; }).length;
    };
    var short = function (o) { return o ? fmtDate(o.submittedAt) + " — " + (String(o.issue || "").length > 60 ? o.issue.slice(0, 60) + "…" : o.issue || "no description") : "a request that's gone"; };
    var dupCell = function (r) {
      if (r.duplicateOf) return '<span class="dup-note">Duplicate of ' + E(short(byId[r.duplicateOf])) +
        (can ? ' <button type="button" class="text-button" data-itr-main="' + E(r.id) + '">Make this the main one</button>' +
          ' <button type="button" class="text-button" data-itr-undup="' + E(r.id) + '">Undo</button>' : "") + "</span>";
      var out = r.dupes ? '<span class="co-note">+' + r.dupes + (r.dupes === 1 ? " duplicate" : " duplicates") + "</span>" : "";
      if (r.repeatOf && r.status !== "done") {
        out += '<span class="dup-hint">Looks like a repeat of their ' + E(fmtDate(byId[r.repeatOf].submittedAt)) + " request" +
          (can ? ' <button type="button" class="text-button" data-itr-dup="' + E(r.id) + '" data-of="' + E(r.repeatOf) + '">Mark duplicate</button>' +
            ' <button type="button" class="text-button" data-itr-notdup="' + E(r.id) + '">Not a duplicate</button>' : "") + "</span>";
      }

    };

    var personOpts = '<option value="">Everyone</option>' + plist.map(function (p) {
      return '<option value="' + E(p.key) + '"' + (p.key === itr.person ? " selected" : "") + ">" + E(p.name) + " (" + p.n + ")</option>";
    }).join("");

    var bulk = can && picked.length
      ? '<div class="bulk-bar"><b>' + picked.length + " selected</b><span>Mark as</span>" + IT_STATUSES.map(function (s) {
          return '<button type="button" class="st-btn st-' + s.id + '" data-itr-bulk="' + s.id + '">' + E(s.label) + "</button>";
        }).join("") + (picked.length > 1 ? '<span>Merge as duplicates,</span>' +
          '<button type="button" class="st-btn st-dup" data-itr-merge="newest" title="The most recent one stays; the others become its duplicates">keep newest</button>' +
          '<button type="button" class="st-btn st-dup" data-itr-merge="oldest" title="The earliest one stays; the others become its duplicates">keep oldest</button>' : "") +
        '<span class="grow"></span><button type="button" class="text-button" data-itr-clear>Clear</button></div>'
      : "";

    var replied = all.filter(function (r) { return r.replyPending; });
    var replyBanner = replied.length ? '<div class="banner itr-reply-banner"><b>' + replied.length + (replied.length === 1 ? " person" : " people") + " replied to a resolved ticket</b> — " +
      E(replied.slice(0, 3).map(itrPerson).join(", ")) + (replied.length > 3 ? " and more" : "") + '. <button type="button" class="text-button" data-itr-replied>Show them</button></div>' : "";
    return itSyncLine(itr.data.sync, can) + replyBanner + '<div class="summary-cards four">' +
        metric("Requests", all.length, (first ? "Since " + fmtDate(first) + " · " : "") + all.filter(function (r) { return r.submittedAt >= since30; }).length + " in the last 30 days") +
        metric("New", count("new"), "Just came in from the form", count("new") > 0) +
        metric("In progress", count("progress"), unrated ? unrated + " open ones not rated yet" : "All rated") +
        metric("Resolved", count("done"), "Fixed and closed") + "</div>" +
      '<div class="tabs" role="tablist" style="margin-top:4px;">' + [{ id: "all", label: "All" }].concat(IT_STATUSES, [{ id: "dupes", label: "Duplicates" }]).map(function (t) {
        var n = tabCount(t.id);
        return '<button type="button" role="tab" class="tab ' + (itr.tab === t.id ? "active" : "") + '" aria-selected="' + (itr.tab === t.id) + '" data-itr-tab="' + t.id + '">' +
          E(t.label) + (n ? '<span class="badge">' + n + "</span>" : "") + (t.id === "dupes" && hints.length ? '<span class="badge hint-badge" title="Possible repeats to review">' + hints.length + " to review</span>" : "") + "</button>";
      }).join("") + "</div>" +
      (itr.tab === "dupes" ? '<p class="small-note" style="margin:6px 0 0;">Possible repeats to review come first (same person, something similar within 7 days), then the ones you\'ve marked. Duplicates don\'t count in the other tabs, the numbers or the charts.</p>' : "") +
      '<div class="table-toolbar"><select id="itrPerson" aria-label="Show one person">' + personOpts + "</select>" +
        '<select id="itrSort" aria-label="Sort by">' + [["newest", "Newest first"], ["oldest", "Oldest first"], ["priority", "Priority"], ["person", "Person A–Z"]].map(function (x) {
          return '<option value="' + x[0] + '"' + (itr.sort === x[0] ? " selected" : "") + ">Sort: " + x[1] + "</option>";
        }).join("") + "</select>" +
        (itr.person ? '<button type="button" class="text-button" data-itr-who="">Show everyone</button>' : "") +
        '<span class="grow" style="flex:1"></span>' +
        (can ? '<input type="file" id="itrFile" accept=".xlsx" hidden><button type="button" id="itrImport">Import from Excel</button>' : "") +
        '<button type="button" class="primary" data-itr-add>+ Add ticket</button></div>' +
      (itr.adding ? itrAddForm(plist) : "") +
      bulk +
      '<div class="table-wrap"><table class="wide"><thead><tr>' +
        (can ? '<th class="center" style="width:34px;"><input type="checkbox" class="check" data-itr-pickall' + (allShownPicked ? " checked" : "") + ' aria-label="Select all shown"></th>' : "") +
        "<th>Submitted</th><th>Person</th><th>Issue</th><th>Form says</th><th>Priority</th><th>Status</th><th>Contact</th></tr></thead><tbody>" +
      (rows.length ? rows.map(function (r) {
        var on = !!itr.picked[r.id];

          (can ? '<td class="center"><input type="checkbox" class="check" data-itr-pick="' + E(r.id) + '"' + (on ? " checked" : "") + ' aria-label="Select this request"></td>' : "") +
          "<td>" + when(r.submittedAt) + "</td>" +

      api("/api/sops/" + encodeURIComponent(sop.id), { method: "DELETE" }).then(function () { toast("Removed."); sopReload(dept); }, function (err) { toast(err.message, true); });
    }
  });

  // ---- Private IT notebook (IT → Resolved) ----
  // Only for logins with "Private IT notebook" ticked (the server checks).
  // Left: resolved tickets or knowledge base articles. Right: the open one,
  // saved as you type. A ticket's write-up can become an article in one click.
  var NB_CATEGORIES = ["Hardware", "Software", "Account & access", "Email & Teams", "Network & VPN", "Printer", "Phone", "Other"];
  var nb = { data: null, at: 0, loading: false, error: "", view: "tickets", sel: { tickets: "", kb: "" }, show: "all", q: "", edit: {}, timers: {} };
  function loadNotebook() {
    if (nb.loading) return;
    nb.loading = true;
    api("/api/it-notebook").then(function (d) { matchPeople(d.resolved); nb.data = d; nb.error = ""; }, function (err) { nb.error = err.message; })
      .then(function () { nb.loading = false; nb.at = Date.now(); requestRender(); });
  }
  function nbCategories() {
    var seen = {};
    NB_CATEGORIES.concat((nb.data ? nb.data.articles.map(function (a) { return a.category; }).concat(nb.data.resolved.map(function (r) { return r.writeup && r.writeup.category; })) : []))
      .forEach(function (c) { if (c) seen[c] = 1; });

  function nbWhen(ms) { return ms ? new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : ""; }

  function renderNotebook() {
    if (!nb.data || Date.now() - nb.at > 300000) loadNotebook();
    if (nb.error) return '<div class="banner">' + E(nb.error) + "</div>";
    if (!nb.data) return '<div class="empty">Loading your notebook…</div>';
    var d = nb.data;
    var todo = d.resolved.filter(function (r) { return !(r.writeup && r.writeup.fix); }).length;
    return '<div class="table-toolbar" style="margin-top:16px;"><div class="seg">' +
        '<button type="button" data-nb-view="tickets" class="' + (nb.view === "tickets" ? "active" : "") + '">Resolved tickets (' + d.resolved.length + ")</button>" +
        '<button type="button" data-nb-view="kb" class="' + (nb.view === "kb" ? "active" : "") + '">Knowledge base (' + d.articles.length + ")</button></div>" +
        '<span class="small-note">Private — only you can see this.' + (nb.view === "tickets" && todo ? " " + todo + " still need a write-up." : "") + "</span>" +
        (nb.view === "kb" ? '<button type="button" class="primary" data-nb-new>+ New article</button>' : "") + "</div>" +
      nbCategories() + (nb.view === "kb" ? renderKb() : renderNbTickets());
  }

  function renderNbTickets() {
    var list = nb.data.resolved.filter(function (r) { return nb.show === "all" || !(r.writeup && r.writeup.fix); });
    if (!nb.sel.tickets || !nbTicket(nb.sel.tickets)) nb.sel.tickets = list.length ? list[0].id : "";
    var items = list.length ? list.map(function (r) {
      var w = r.writeup || {};
      return '<button type="button" class="nb-item' + (r.id === nb.sel.tickets ? " active" : "") + '" data-nb-ticket="' + E(r.id) + '">' +
        "<b>" + E(itrPerson(r)) + "</b>" + '<span class="nb-snip">' + E(r.issue || "—") + "</span>" +
        '<span class="nb-meta">' + E(fmtDate(r.submittedAt)) + " " + (w.fix ? '<span class="nb-chip">' + E(w.category || "Written up") + "</span>" : '<span class="nb-chip todo">Needs write-up</span>') + "</span></button>";
    }).join("") : '<div class="nb-empty">' + (nb.data.resolved.length ? "Everything's written up." : "Requests you mark done on the Requests tab show up here.") + "</div>";
    var head = '<div class="nb-list-head"><div class="seg">' + [["all", "All"], ["todo", "Needs write-up"]].map(function (x) {

  function renderNbTicketPane(r) {
    if (!r) return '<div class="nb-empty">Pick a ticket on the left.</div>';
    var w = r.writeup || {};
    var meta = [r.company, r.submittedAt ? "submitted " + fmtDate(r.submittedAt) : "", r.urgency ? "form said " + r.urgency : "", r.priority ? "rated " + r.priority : ""].filter(Boolean).join(" · ");
    var art = w.articleId && nbArticle(w.articleId);
    return "<h3>" + E(itrPerson(r)) + '</h3><div class="nb-sub">' + E(meta) + "</div>" +
      '<div class="nb-quote">' + E(r.issue || "No description.") + (r.notes ? "\n\n" + E(r.notes) : "") + "</div>" +
      '<div class="nb-field"><label for="nb-cat">Category</label><input id="nb-cat" list="nbCats" data-nb-t="category" data-id="' + E(r.id) + '" value="' + E(w.category || "") + '" placeholder="e.g. Hardware" autocomplete="off"></div>' +
      '<div class="nb-field"><label for="nb-fix">What fixed it</label><textarea id="nb-fix" rows="4" data-nb-t="fix" data-id="' + E(r.id) + '" placeholder="Steps you took, so next time is quicker.">' + E(w.fix || "") + "</textarea></div>" +
      '<div class="nb-field"><label for="nb-notes">Private notes</label><textarea id="nb-notes" rows="3" data-nb-t="notes" data-id="' + E(r.id) + '" placeholder="Anything else worth remembering — follow-ups, device details, who helped.">' + E(w.notes || "") + "</textarea></div>" +

      (art ? '<button type="button" data-nb-open="' + E(art.id) + '">Open article →</button>' : '<button type="button" class="primary" data-nb-promote="' + E(r.id) + '">Turn into article →</button>') + "</div>";
  }

  function kbNo(a) { return a && a.kb ? "KB-" + String(a.kb).padStart(4, "0") : ""; }

  // A title from the article's Problem (or first) line, or a ticket's issue:
  // drop greetings and filler, then "Fix: …" for something broken, "How to
  // …" for a request, otherwise the sentence itself. Simple rules, no AI.
  function suggestTitle(text) {
    var src = String(text || "");
    var m = src.match(/^#+\s*problem\s*\n+([\s\S]*?)(\n#|$)/im);
    src = (m ? m[1] : src.replace(/^#+.*$/gm, "")).replace(/!\[[^\]]*\]\([^)]*\)/g, " ").trim();
    var first = (src.split(/(?<=[.!?])\s|\n/)[0] || "").trim();
    var t = first
      .replace(/^(hi|hello|hey|good (morning|afternoon))\b[^a-z0-9]*/i, "")
      .replace(/^(please|pls|kindly)\s+/i, "")
      .replace(/^(can|could|would) (you|someone|i|we)( please)?\s+/i, "")
      .replace(/^(help( me)?( with)?|i need( help with)?|we need|need( help with)?|i('m| am) having( an issue with| trouble with| issues with)?|having (an )?(issue|problem|trouble)s? with|issue with|problem with|is there a way to)\s+/i, "")
      .replace(/^(my|our|the)\s+/i, "")
      .replace(/\b(my|our)\s+/gi, "")
      .replace(/^access to\b/i, "get access to")
      .replace(/\b(again|anymore|please|asap|thank(s| you))\b/gi, "")
      .replace(/\s{2,}/g, " ").replace(/[\s.!?,;:]+$/, "").trim();
    if (!t) return "";
    var broken = /\b(can'?t|cannot|won'?t|isn'?t|is not|not working|doesn'?t|does not|error|fail(s|ed|ing)?|broken|stuck|keeps|freez(e|es|ing)|crash(es|ing)?|slow|offline|down|jammed|no (sound|internet|signal))\b/i.test(t);
    var how = /^(get access|set ?up|install|add|create|reset|change|connect|request|get|configure|enable|disable|remove|update|map|share|access|order)\b/i.test(t);
    t = t.charAt(0).toUpperCase() + t.slice(1);
    if (t.length > 80) t = t.slice(0, 80).replace(/\s+\S*$/, "") + "…";
    return broken ? "Fix: " + t : how ? "How to " + t.charAt(0).toLowerCase() + t.slice(1) : t;
  }

  // Images (![caption](kb-img:ID)) load with your sign-in, then show inline.
  var nbImgs = {};
  function nbImgUrl(id) {
    if (!nbImgs[id]) {
      nbImgs[id] = fetch("/api/it-notebook/images/" + encodeURIComponent(id), { headers: { Authorization: "Bearer " + token() } })
        .then(function (r) { if (!r.ok) throw new Error("missing"); return r.blob(); })
        .then(function (b) { return URL.createObjectURL(b); });
      nbImgs[id].catch(function () { delete nbImgs[id]; });
    }
    return nbImgs[id];
  }
  function nbHydrate(root) {
    var imgs = (root || document).querySelectorAll("img[data-kbimg]:not([src])");
    return Promise.all(Array.prototype.map.call(imgs, function (img) {
      return nbImgUrl(img.dataset.kbimg).then(function (u) { img.src = u; return new Promise(function (ok) { if (img.complete) ok(); else { img.onload = ok; img.onerror = ok; } }); },
        function () { img.alt = "Image not found"; });
    }));
  }
  function nbImageIds(body) { var out = [], re = /kb-img:([a-z0-9]+)/g, m; while ((m = re.exec(String(body || "")))) out.push(m[1]); return out; }
  function nbUpload(files, ta) {
    var list = Array.prototype.filter.call(files || [], function (f) { return /^image\//.test(f.type); });
    if (!list.length) return;
    var saved = $("#nb-saved"); if (saved) saved.textContent = "Uploading " + (list.length === 1 ? "image" : list.length + " images") + "…";
    list.reduce(function (p, f) {
      return p.then(function () {
        return fetch("/api/it-notebook/images", { method: "POST", headers: { Authorization: "Bearer " + token(), "Content-Type": f.type }, body: f })
          .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || "Upload failed"); return d; }); })
          .then(function (d) {
            var cap = (f.name && !/^image\.(png|jpe?g)$/i.test(f.name) ? f.name.replace(/\.[a-z0-9]+$/i, "") : "Screenshot").replace(/[\[\]()]/g, "");
            var tag = "![" + cap + "](kb-img:" + d.id + ")";
            var pos = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
            var before = ta.value.slice(0, pos), after = ta.value.slice(pos);
            ta.value = before + (before && !/\n$/.test(before) ? "\n" : "") + tag + "\n" + after;
            ta.selectionStart = ta.selectionEnd = (before + tag).length + 2;
            nbSave("a", ta.dataset.id, "body", ta.value);
          });
      });
    }, Promise.resolve()).then(function () { drawNbThumbs(ta.dataset.id); }, function (err) { toast(err.message, true); var s2 = $("#nb-saved"); if (s2) s2.textContent = "Upload failed"; });
  }
  function drawNbThumbs(id) {
    var a = nbArticle(id), box = $("#nb-thumbs");
    if (!a || !box) return;
    var ids = nbImageIds(a.body);
    box.innerHTML = ids.map(function (x) { return '<img data-kbimg="' + E(x) + '" alt="Image in this article" title="Click to open">'; }).join("");
    nbHydrate(box);
  }
  // Download as PDF: a clean print page (choose "Save as PDF" in the dialog).
  function nbPrint(a) {
    var box = $("#nbPrint");
    if (!box) { box = document.createElement("div"); box.id = "nbPrint"; document.body.appendChild(box); }
    var when = new Date(a.updatedAt || Date.now()).toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
    box.innerHTML = '<div class="pk">' + E(kbNo(a)) + " · SOI AVIATION IT</div><h1>" + E(a.title) + '</h1><div class="pm">' +
      E([a.category, "Updated " + when].filter(Boolean).join(" · ")) + "</div>" + nbFormat(a.body) +
      '<div class="pf">' + E(kbNo(a) + " — " + a.title) + " · Printed " + E(new Date().toLocaleDateString()) + " · Internal use</div>";
    var oldTitle = document.title;
    toast("Getting it ready…");
    nbHydrate(box).then(function () {
      document.title = (kbNo(a) + " " + a.title).replace(/[\\/:*?"<>|]+/g, " ").trim();
      document.body.classList.add("nb-printing");
      var done = function () { document.body.classList.remove("nb-printing"); document.title = oldTitle; window.removeEventListener("afterprint", done); };
      window.addEventListener("afterprint", done);
      window.print();
      setTimeout(done, 1000);
    });
  }

  function renderKb() {
    var q = nb.q.trim().toLowerCase();
    var list = nb.data.articles.filter(function (a) { return !q || (kbNo(a) + " " + a.title + " " + a.category + " " + a.body).toLowerCase().indexOf(q.replace(/^kb\s*-?\s*(\d+)$/, function (m, n) { return "kb-" + String(n).padStart(4, "0"); })) !== -1; });
    if (!nb.sel.kb || !nbArticle(nb.sel.kb)) nb.sel.kb = list.length ? list[0].id : "";
    var items = list.length ? list.map(function (a) {
      return '<button type="button" class="nb-item' + (a.id === nb.sel.kb ? " active" : "") + '" data-nb-article="' + E(a.id) + '">' +
        '<span class="nb-kb">' + E(kbNo(a)) + "</span><b>" + E(a.title) + "</b>" + '<span class="nb-snip">' + E(a.body.replace(/!\[[^\]]*\]\([^)]*\)/g, "[image]").replace(/^#+\s*/gm, "").slice(0, 160) || "Empty") + "</span>" +
        '<span class="nb-meta">' + (a.category ? '<span class="nb-chip">' + E(a.category) + "</span>" : "") + "Updated " + E(nbWhen(a.updatedAt)) + "</span></button>";
    }).join("") : '<div class="nb-empty">' + (nb.data.articles.length ? "No articles match." : "No articles yet. Start one with + New article, or turn a resolved ticket into one.") + "</div>";
    var head = '<div class="nb-list-head"><input type="text" id="nbFind" placeholder="Find an article or KB number" value="' + E(nb.q) + '" aria-label="Find an article" autocomplete="off"></div>';
    return '<div class="nb-grid"><div class="nb-list">' + head + items + '</div><div class="nb-pane">' + renderKbPane(nbArticle(nb.sel.kb)) + "</div></div>";
  }
  // Light formatting for reading: "# " headings, "- " bullets, `code`.
  function nbFormat(text) {
    var out = "", bullets = [];
    var inline = function (s) { return E(s).replace(/`([^`]+)`/g, "<code>$1</code>"); };
    var flush = function () { if (bullets.length) { out += "<ul>" + bullets.map(function (b) { return "<li>" + inline(b) + "</li>"; }).join("") + "</ul>"; bullets = []; } };
    String(text || "").split(/\n{2,}/).forEach(function (block) {
      block.split("\n").forEach(function (line, i, lines) {
        var im = line.trim().match(/^!\[([^\]]*)\]\(kb-img:([a-z0-9]+)\)$/);
        if (im) { flush(); out += '<figure><img data-kbimg="' + E(im[2]) + '" alt="' + E(im[1] || "Image") + '">' + (im[1] && im[1] !== "Screenshot" ? "<figcaption>" + E(im[1]) + "</figcaption>" : "") + "</figure>"; return; }
        if (/^#+\s/.test(line)) { flush(); out += "<h4>" + inline(line.replace(/^#+\s*/, "")) + "</h4>"; }
        else if (/^\s*[-*]\s/.test(line)) bullets.push(line.replace(/^\s*[-*]\s/, ""));
        else if (line.trim()) { flush(); out += "<p>" + inline(line) + "</p>"; }
      });
      flush();
    });
    return out || '<p class="dim">Nothing written yet.</p>';
  }
  function renderKbPane(a) {
    if (!a) return '<div class="nb-empty">Pick an article on the left, or start a new one.</div>';
    var editing = nb.edit[a.id] || !a.body;
    var from = a.fromRequest && nbTicket(a.fromRequest);
    var top = '<div class="nb-foot" style="margin:0 0 14px;"><div class="seg">' +
      '<button type="button" data-nb-mode="read" class="' + (editing ? "" : "active") + '">Read</button>' +
      '<button type="button" data-nb-mode="edit" class="' + (editing ? "active" : "") + '">Edit</button></div><span class="grow"></span>' +
      '<span class="nb-saved" id="nb-saved">Updated ' + E(nbWhen(a.updatedAt)) + "</span>" +
      '<button type="button" data-nb-pdf="' + E(a.id) + '" title="Opens a print-ready page — choose Save as PDF, or print it">Download PDF</button></div>';
    setTimeout(function () { nbHydrate($("#view")); drawNbThumbs(a.id); }, 0);
    if (!editing) {
      return top + '<div class="nb-kb">' + E(kbNo(a)) + "</div><h3>" + E(a.title) + '</h3><div class="nb-sub">' + E([a.category, from ? "from " + itrPerson(from) + "'s ticket" : ""].filter(Boolean).join(" · ")) + "</div>" +
        '<div class="nb-read">' + nbFormat(a.body) + "</div>";
    }
    return top + '<div class="nb-kb">' + E(kbNo(a)) + "</div>" +
      '<input class="nb-title" data-nb-a="title" data-id="' + E(a.id) + '" value="' + E(a.title) + '" placeholder="Title" aria-label="Title">' +
      '<div class="nb-tools"><button type="button" data-nb-suggest="' + E(a.id) + '" title="Writes a title from the Problem section">✨ Suggest title</button></div>' +
      '<div class="nb-field" style="max-width:280px;margin-top:8px;"><label for="nb-acat">Category</label><input id="nb-acat" list="nbCats" data-nb-a="category" data-id="' + E(a.id) + '" value="' + E(a.category) + '" placeholder="e.g. Network & VPN" autocomplete="off"></div>' +
      '<div class="nb-field"><label for="nb-body">Article</label><textarea id="nb-body" rows="14" data-nb-a="body" data-id="' + E(a.id) + '" placeholder="# Problem&#10;What people see.&#10;&#10;# Fix&#10;- Step one&#10;- Step two">' + E(a.body) + "</textarea>" +
      '<div class="nb-tools" style="margin-top:8px;"><input type="file" id="nbImgFile" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>' +
        '<button type="button" data-nb-addimg>🖼 Add image</button><span class="small-note">…or paste a screenshot (⌘V) or drag a picture into the article.</span></div>' +
      '<div class="nb-thumbs" id="nb-thumbs"></div>' +
      '<span class="small-note">Tip: start a line with # for a heading, - for a bullet, and wrap commands in `backticks`.</span></div>' +
      '<div class="nb-foot"><span class="grow"></span><button type="button" class="text-button" data-nb-delete="' + E(a.id) + '">Delete article</button></div>';
  }

  // Saving: debounced per field, without re-rendering while you type.
  function nbSave(kind, id, key, value) {
    var tk = kind + id + key;
    // Keep the local copy current, so switching views shows what you typed.
    if (kind === "t") { var lr = nbTicket(id); if (lr) { lr.writeup = lr.writeup || {}; lr.writeup[key] = value; } }
    else { var la = nbArticle(id); if (la) la[key] = value; }
    var saved = $("#nb-saved");
    if (saved) saved.textContent = "Saving…";
    clearTimeout(nb.timers[tk]);
    nb.timers[tk] = setTimeout(function () {
      var change = {}; change[key] = value;
      var req = kind === "t"
        ? api("/api/it-notebook/tickets/" + encodeURIComponent(id), { method: "PUT", body: JSON.stringify(change) })
        : api("/api/it-notebook/articles/" + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify(change) });
      req.then(function (res) {
        if (kind === "t") { var r = nbTicket(id); if (r) r.writeup = res; }
        else { var a = nbArticle(id); if (a) Object.assign(a, res); }
        var s = $("#nb-saved"); if (s) s.textContent = "Saved";
      }, function (err) { toast(err.message, true); var s = $("#nb-saved"); if (s) s.textContent = "Not saved"; });
    }, 700);
  }
  function nbNewArticle(fields) {
    return api("/api/it-notebook/articles", { method: "POST", body: JSON.stringify(fields) }).then(function (a) {
      nb.data.articles.unshift(a);
      nb.view = "kb"; nb.sel.kb = a.id; nb.edit[a.id] = true; nb.q = "";
      render();
      var t = $(".nb-title"); if (t) { t.focus(); t.select(); }
      return a;
    }, function (err) { toast(err.message, true); });
  }
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "nbFind") {
      nb.q = t.value; var pos = t.selectionStart; render();
      var f = $("#nbFind"); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (x) {} }
      return;
    }
    if (t.dataset && t.dataset.nbT) nbSave("t", t.dataset.id, t.dataset.nbT, t.value);
    else if (t.dataset && t.dataset.nbA) nbSave("a", t.dataset.id, t.dataset.nbA, t.value);
  });
  document.addEventListener("click", function (e) {
    var img = e.target.closest && e.target.closest("img[data-kbimg]");
    if (img && img.src) { window.open(img.src, "_blank", "noopener"); return; }
    var t = e.target.closest && e.target.closest("[data-nb-view],[data-nb-show],[data-nb-ticket],[data-nb-article],[data-nb-mode],[data-nb-new],[data-nb-promote],[data-nb-open],[data-nb-delete],[data-nb-pdf],[data-nb-suggest],[data-nb-addimg]");
    if (!t) return;
    var ds = t.dataset;
    if (ds.nbPdf) { var pa = nbArticle(ds.nbPdf); if (pa) nbPrint(pa); return; }
    if ("nbAddimg" in ds) { var fi = $("#nbImgFile"); if (fi) fi.click(); return; }
    if (ds.nbSuggest) {
      var sa = nbArticle(ds.nbSuggest), ti = $(".nb-title");
      var sug = sa && (suggestTitle(sa.body) || (sa.fromRequest && nbTicket(sa.fromRequest) ? suggestTitle(nbTicket(sa.fromRequest).issue) : ""));
      if (!sug) { toast("Write a Problem section first, then try again.", true); return; }
      if (ti) { ti.value = sug; ti.focus(); }
      nbSave("a", sa.id, "title", sug);
      return;
    }
    if (ds.nbView) { nb.view = ds.nbView; render(); }
    else if (ds.nbShow) { nb.show = ds.nbShow; render(); }
    else if (ds.nbTicket) { nb.sel.tickets = ds.nbTicket; render(); }
    else if (ds.nbArticle) { nb.sel.kb = ds.nbArticle; render(); }

  // IT requests on the Overview: requests per week (one hue) and open
  // requests by internal priority. Details live on IT → Requests.
  function itWeeks() {
    var monday = function (d) { d = new Date(d); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
    var start = monday(Date.now()); start.setDate(start.getDate() - 7 * 11);
    var weeks = [];
    for (var i = 0; i < 12; i++) { var w = new Date(start); w.setDate(start.getDate() + 7 * i); weeks.push({ from: w, n: 0 }); }
    (itr.data ? itr.data.requests : []).forEach(function (r) {
      if (r.duplicateOf) return;
      var d = new Date(String(r.submittedAt).replace(" ", "T"));
      if (isNaN(d) || d < start) return;
      var i = Math.floor((monday(d) - start) / (7 * 864e5));
      if (weeks[i]) weeks[i].n++;
    });
    return weeks;
  }
  function renderItOverview() {
    if (!itr.data || Date.now() - itr.at > 120000) loadItRequests();

    if (itr.error) return html + '<div class="empty">' + E(itr.error) + "</div>";
    if (!itr.data) return html + '<div class="empty">Loading…</div>';
    var open = itr.data.requests.filter(function (r) { return r.status !== "done" && !r.duplicateOf; });
    var rows = IT_PRIOS.map(function (p) { return { label: p.label, n: open.filter(function (r) { return r.priority === p.id; }).length }; });
    rows.push({ label: "Not rated", n: open.filter(function (r) { return !r.priority; }).length });
    var weeks = itWeeks(), total = weeks.reduce(function (s, w) { return s + w.n; }, 0);
    return html + '<div class="grid-2"><div class="card"><div class="card-label">Requests per week — last 12 weeks (' + total + ")</div>" +
      '<div class="chart-wrap"><canvas id="ov-it-weekly" aria-label="IT requests per week"></canvas></div></div>' +

      rows.map(function (r) { return "<tr><td>" + E(r.label) + "</td><td>" + r.n + "</td></tr>"; }).join("") +

  // Pentagon document kinds (dashboards.mine's DOC_KIND) -> tracker view.

  function loadMentions() {

          .then(function (d) { return { rows: findResultRows(d) || [] }; }, function (err) { return { rows: [], error: err }; })
      : Promise.resolve({ rows: [] });

        return {
          type: "task", done: isDone(task), due: task.dueDate || "",
          what: task.title || task.part || "Untitled task",

          where: shortCo(task.company || "SOI Aviation") + " · " + task.department,

        };

        });

            where: "SOI · " + v.dept, link: "dept/" + encodeURIComponent(v.dept), company: "SOI Aviation",

          ? '<div class="table-wrap"><table class="plain"><thead><tr><th>What</th><th>Where</th><th>Due date</th><th>Done</th><th>Notes</th><th>From</th></tr></thead><tbody>' +
            list.map(mnRowHtml).join("") + "</tbody></table></div>"
          : '<div class="small-note" style="padding:6px 2px 10px;">Nothing here.</div>') +
        "</details>";
    }).join("");
    box.innerHTML = rows.length || mnFilter !== "all" ? html : '<div class="card empty">Nothing is assigned to you right now.' + (mnPentError ? " (Couldn't load your Pentagon documents: " + E(mnPentError.message) + ")" : "") + "</div>";
    if (open.length) drawMentionCharts(open);
  }

  function mnRowHtml(x) {
    var late = x.due && !x.done && x.due < today;
    return '<tr class="' + (x.done ? "done" : "") + '"><td><a href="#' + x.link + '" data-mine-co="' + E(x.company) + '"><strong>' + E(x.what) + "</strong></a>" +
      (x.pentagon ? '<span class="src">PENTAGON</span>' : "") + (x.sub ? '<span class="co-note" style="padding:0">' + E(x.sub) + "</span>" : "") + "</td>" +
      "<td>" + E(x.where) + '</td><td style="' + (late ? "color:var(--danger);font-weight:600" : "") + '">' + E(fmtDate(x.due) || "—") + "</td>" +
      '<td><span class="pill ' + (x.done ? "" : "rose") + '">' + (x.done ? "✓ Done" : "✗ Open") + "</span></td><td>" + E(x.notes) + "</td><td>" + E(x.by) + "</td></tr>";
  }

  // Value labels at the end of each bar, in text ink (never the bar color).
  var mnValueLabels = {
    id: "mnValueLabels",
    afterDatasetsDraw: function (chart) {
      var ctx = chart.ctx;
      chart.data.datasets.forEach(function (ds, i) {
        chart.getDatasetMeta(i).data.forEach(function (bar, j) {
          var v = ds.data[j];
          if (!v) return;
          ctx.save();
          ctx.fillStyle = "#3f352c";
          ctx.font = "600 11px 'DM Sans', system-ui, sans-serif";
          if (chart.options.indexAxis === "y") { ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(v, bar.x + 6, bar.y); }
          else { ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.fillText(v, bar.x, bar.y - 4); }
          ctx.restore();
        });
      });
    }
  };

  function drawMentionCharts(open) {
    if (typeof Chart === "undefined") return;
    var tick = { color: "#948575", font: { size: 11 } };
    var grid = { color: "rgba(63,53,44,0.06)" };
    var tooltip = { backgroundColor: "#3f352c", padding: 8, displayColors: false };

    // 1. Open by type — one hue; the axis labels carry identity.
    var counts = {};
    open.forEach(function (x) { counts[x.type] = (counts[x.type] || 0) + 1; });
    var typeIds = Object.keys(MN_TYPE_LABEL).filter(function (k) { return counts[k]; });
    var el1 = $("#mn-bytype");
    if (el1) {
      var max1 = Math.max.apply(null, typeIds.map(function (k) { return counts[k]; }));
      mnCharts.push(new Chart(el1, {
        type: "bar",
        data: { labels: typeIds.map(function (k) { return MN_TYPE_LABEL[k]; }), datasets: [{ label: "Open", data: typeIds.map(function (k) { return counts[k]; }), backgroundColor: MN_BLUE, borderRadius: 4, borderSkipped: "start", maxBarThickness: 18 }] },
        options: {
          indexAxis: "y", responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: tooltip },
          scales: { x: { beginAtZero: true, suggestedMax: Math.ceil(max1 * 1.2) || 1, ticks: Object.assign({ precision: 0 }, tick), grid: grid, border: { display: false } },
                    y: { ticks: tick, grid: { display: false }, border: { display: false } } }
        },
        plugins: [mnValueLabels]
      }));
    }

    // 2. Due over the next 4 weeks — Overdue in red (labelled), the rest in the same blue.
    var buckets = [
      { label: "Overdue", n: 0, red: true },
      { label: "This week", n: 0 }, { label: "Next week", n: 0 }, { label: "In 2 weeks", n: 0 }, { label: "In 3 weeks", n: 0 }
    ];
    var later = 0, nodue = 0;
    open.forEach(function (x) {
      if (!x.due) { nodue++; return; }
      if (x.due < today) { buckets[0].n++; return; }
      var days = Math.round((new Date(x.due + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);
      var w = Math.floor(days / 7);
      if (w < 4) buckets[1 + w].n++; else later++;
    });
    var el2 = $("#mn-byweek");
    if (el2) {
      var max2 = Math.max.apply(null, buckets.map(function (b) { return b.n; }));
      mnCharts.push(new Chart(el2, {
        type: "bar",
        data: { labels: buckets.map(function (b) { return b.label; }), datasets: [{ label: "Due", data: buckets.map(function (b) { return b.n; }), backgroundColor: buckets.map(function (b) { return b.red ? MN_RED : MN_BLUE; }), borderRadius: 4, borderSkipped: "start", maxBarThickness: 34 }] },
        options: {
          responsive: true, maintainAspectRatio: false, layout: { padding: { top: 16 } },
          plugins: { legend: { display: false }, tooltip: tooltip },
          scales: { x: { ticks: tick, grid: { display: false }, border: { display: false } },
                    y: { beginAtZero: true, suggestedMax: Math.ceil(max2 * 1.2) || 1, ticks: Object.assign({ precision: 0 }, tick), grid: grid, border: { display: false } } }
        },
        plugins: [mnValueLabels]
      }));
      var note = [later ? later + " due later" : "", nodue ? nodue + " with no due date" : ""].filter(Boolean).join(" · ");
      if ($("#mn-week-note")) $("#mn-week-note").textContent = note;
    }
  }

  // The full Pentagon list (collapsed by default); its charts are drawn when opened.
  function drawPentagonList() {
    var pt = $("#mn-table"), pe = $("#mn-empty");
    if (!pt) return;
    $("#mn-msg").textContent = mnPentRows.length ? " · " + mnPentRows.length + " document" + (mnPentRows.length === 1 ? "" : "s") : "";
    if (mnPentError) { pe.textContent = mnPentError.message; return; }
    var html = autoTable(mnPentRows);
    if (!html) { pe.textContent = "Nothing found for your Pentagon code."; return; }
    pt.innerHTML = html; pt.style.display = "table"; pe.style.display = "none";
    var all = $("#mn-all");
    if (all && all.open) { try { pentagonCharts("mn", mnPentRows); } catch (x) { console.error(x); } }
  }

  document.addEventListener("toggle", function (e) {
    var d = e.target;
    if (!d || d.tagName !== "DETAILS" || page !== "mentions") return;
    if (d.dataset.mnGroup) { mnOpen[d.dataset.mnGroup] = d.open; saveMnOpen(); }
    if (d.id === "mn-all" && d.open && mnPentRows.length) { try { pentagonCharts("mn", mnPentRows); } catch (x) { console.error(x); } }
  }, true);

  document.addEventListener("click", function (e) {
    if (page !== "mentions") return;
    var f = e.target.closest("[data-mn-filter]");
    if (f) { mnFilter = f.dataset.mnFilter; drawMentions(); return; }
    var j = e.target.closest("[data-mn-jump]");
    if (j) {
      var id = j.dataset.mnJump;
      var target = id === "open" ? (document.querySelector("#mn-g-overdue .badge").textContent !== "0" ? "overdue" : "week") : id;
      var d = $("#mn-g-" + target);
      if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "start" }); }
    }
  });

  // ---------- Work inbox ----------
  // Your own unread Outlook mail, one card per conversation, with Outlook's
  // preview text (no AI). "Needs you" = flagged, high importance or sent to
  // you directly; the rest is FYI. Done is remembered on this device and a
  // conversation comes back if a newer message arrives. Read-only: replying
  // happens in Outlook.
  var inboxDays = 3, inboxData = null, inboxError = null, inboxNeeds = 0, inboxSig = "";
  var inboxBox = "all"; // "all", or one mailbox address (tabs when there's more than one)
  function boxLabel(m) { return inboxData && m === inboxData.mailbox ? "Mine" : String(m).split("@")[0] + "@"; }
  function inboxDoneKey() { return "soi_tracker_inbox_done_" + (me ? me.username.toLowerCase() : ""); }
  function inboxDone() { try { return JSON.parse(localStorage.getItem(inboxDoneKey()) || "{}"); } catch (e) { return {}; } }
  function setInboxDone(id, receivedAt, done) {
    var d = inboxDone();
    if (done) d[id] = receivedAt; else delete d[id];
    // Keep it small: forget anything older than a month.
    var cutoff = new Date(Date.now() - 31 * 86400000).toISOString();
    Object.keys(d).forEach(function (k) { if (String(d[k]) < cutoff) delete d[k]; });
    try { localStorage.setItem(inboxDoneKey(), JSON.stringify(d)); } catch (e) {}
  }
  function isInboxDone(t, done) { return !!done[t.id] && String(done[t.id]) >= String(t.receivedAt); }

  function renderInbox() {
    setBreadcrumb(["You", "Work inbox"]);
    setTimeout(function () { loadInbox(false); }, 0);
    var several = inboxData && inboxData.mailboxes && inboxData.mailboxes.length > 1;
    return '<div class="intro"><div><div class="eyebrow">Outlook' + (inboxData ? " · " + E(several ? inboxData.mailboxes.length + " inboxes" : inboxData.mailbox) : "") + '</div><h1>Work inbox</h1>' +
      "<p>Your unread Outlook mail" + (several ? " and your shared inboxes" : "") + ", newest first. Reply in Outlook when you're ready — nothing here sends or changes your mail.</p>" +
      '<p class="small-note" id="inbox-note"></p></div>' +
      '<div class="co-wrap"><div class="eyebrow">Received in the last</div><div class="cos">' + [[1, "Day"], [3, "3 days"], [7, "Week"]].map(function (d) {
        return '<button type="button" class="co ' + (d[0] === inboxDays ? "active" : "") + '" data-inbox-days="' + d[0] + '">' + d[1] + "</button>";
      }).join("") + '</div><a class="links-a" href="https://outlook.office.com/mail/" target="_blank" rel="noopener noreferrer">Open Outlook ↗</a></div></div>' +
      '<div id="inbox-tabs"></div><div id="inbox-body"><div class="empty">Loading…</div></div>';
  }

  function loadInbox(quiet) {
    api("/api/inbox?days=" + inboxDays).then(function (data) {
      inboxError = null;
      var sig = JSON.stringify(data.items);
      var same = sig === inboxSig;
      inboxSig = sig;
      inboxData = data;
      updateInboxBadge();
      if (quiet && same) return;
      drawInbox();
    }).catch(function (err) {
      if (quiet) return;
      inboxError = err;
      var box = $("#inbox-body");
      if (box) box.innerHTML = '<div class="banner">' + E(err.message) + "</div>";
    });
  }
  function updateInboxBadge() {
    if (!inboxData) return;
    var done = inboxDone();
    var n = inboxData.items.filter(function (t) { return t.needsYou && !isInboxDone(t, done); }).length;
    if (n !== inboxNeeds) { inboxNeeds = n; renderNav(); }
  }

  function drawInbox() {
    var box = $("#inbox-body");
    if (!box || !inboxData) return;
    var done = inboxDone();
    var boxes = inboxData.mailboxes || [inboxData.mailbox];
    if (inboxBox !== "all" && boxes.indexOf(inboxBox) === -1) inboxBox = "all";
    var tabs = $("#inbox-tabs");
    if (tabs) {
      var open = function (m) { return inboxData.items.filter(function (t) { return (m === "all" || t.mailbox === m) && t.needsYou && !isInboxDone(t, done); }).length; };
      tabs.innerHTML = boxes.length > 1 ? '<div class="tabs" role="tablist" style="margin-top:6px;">' + ["all"].concat(boxes).map(function (m) {
        var n = open(m);
        return '<button type="button" role="tab" class="tab ' + (m === inboxBox ? "active" : "") + '" aria-selected="' + (m === inboxBox) + '" data-inbox-box="' + E(m) + '" title="' + E(m === "all" ? "Every inbox together" : m) + '">' +
          E(m === "all" ? "All inboxes" : boxLabel(m)) + (n ? '<span class="badge">' + n + "</span>" : "") + "</button>";
      }).join("") + "</div>" : "";
    }
    var problems = (inboxData.errors || []).filter(function (x) { return inboxBox === "all" || x.mailbox === inboxBox; });
    var items = inboxData.items.filter(function (t) { return inboxBox === "all" || t.mailbox === inboxBox; });
    var needs = items.filter(function (t) { return t.needsYou && !isInboxDone(t, done); });
    var fyi = items.filter(function (t) { return !t.needsYou && !isInboxDone(t, done); });
    var finished = items.filter(function (t) { return isInboxDone(t, done); });
    var note = $("#inbox-note");
    if (note) note.textContent = "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) + " · " + items.length + " unread conversation" + (items.length === 1 ? "" : "s") + " · checks again every few minutes";
    var section = function (id, title, list, open) {
      return '<details class="mn-group" id="inbox-' + id + '"' + (open ? " open" : "") + '><summary><span class="mn-title">' + title + '</span><span class="badge">' + list.length + "</span></summary>" +
        (list.length ? list.map(mailCard).join("") : '<div class="small-note" style="padding:6px 2px 14px;">Nothing here.</div>') + "</details>";
    };
    box.innerHTML = problems.map(function (x) { return '<div class="banner">' + E(boxLabel(x.mailbox)) + " (" + E(x.mailbox) + "): " + E(x.error) + "</div>"; }).join("") + (items.length
      ? section("needs", "Needs you", needs, true) + section("fyi", "FYI", fyi, needs.length === 0) + (finished.length ? section("done", "Done", finished, false) : "")
      : '<div class="card empty">No unread mail in the last ' + (inboxDays === 1 ? "day" : inboxDays === 7 ? "week" : inboxDays + " days") + ". 🎉</div>");
    function mailCard(t) {
      var isDone = isInboxDone(t, done);
      var when = new Date(t.receivedAt).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      var link = safeLink(t.webLink);
      var names = function (list) { return list.map(function (p) { return p.name || p.email; }).join(", "); };
      return '<article class="mail-card' + (isDone ? " is-done" : "") + '">' +
        '<div class="mail-head"><div class="mail-from">' + E(t.from.name || t.from.email) + (t.from.email && t.from.name ? " &lt;" + E(t.from.email) + "&gt;" : "") + " · " + E(when) + "</div>" +
        '<label class="mail-done"><input type="checkbox" class="check" data-inbox-done="' + E(t.id) + '" data-received="' + E(t.receivedAt) + '"' + (isDone ? " checked" : "") + "> Done</label></div>" +
        '<h3 class="mail-subject">' + E(t.subject) + "</h3>" +
        '<div class="mail-tags">' + (boxes.length > 1 && inboxBox === "all" ? '<span class="pill" title="' + E(t.mailbox) + '">' + E(t.mailbox === inboxData.mailbox ? "Your inbox" : t.mailbox) + "</span>" : "") + (t.unread > 1 ? '<span class="pill">' + t.unread + " unread in thread</span>" : "") +
        (t.needsYou ? '<span class="pill rose">' + E(t.reason) + "</span>" : '<span class="pill">' + E(t.reason) + "</span>") +
        (t.attachments ? '<span class="pill">Attachments</span>' : "") + "</div>" +
        (t.preview ? '<p class="mail-preview">' + E(t.preview) + (t.preview.length >= 400 ? "…" : "") + "</p>" : "") +
        '<div class="small-note">To: ' + E(names(t.to) || "—") + (t.cc.length ? " · cc: " + E(names(t.cc)) : "") + "</div>" +
        (link ? '<a class="mail-open" href="' + E(link) + '" target="_blank" rel="noopener noreferrer">Open in Outlook ↗</a>' : "") +
        "</article>";
    }
  }

  // Checks every few minutes on any page, so the sidebar count stays current.
  setInterval(function () { if (!document.hidden && me) loadInbox(true); }, 3 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && page === "inbox" && me) loadInbox(true); });
  document.addEventListener("change", function (e) {
    var cb = e.target.closest && e.target.closest("[data-inbox-done]");
    if (!cb) return;
    setInboxDone(cb.dataset.inboxDone, cb.dataset.received, cb.checked);
    updateInboxBadge();
    drawInbox();
  });
  document.addEventListener("click", function (e) {
    var tb = e.target.closest && e.target.closest("[data-inbox-box]");
    if (tb) { inboxBox = tb.dataset.inboxBox; drawInbox(); return; }
    var b = e.target.closest && e.target.closest("[data-inbox-days]");
    if (!b || page !== "inbox") return;
    inboxDays = +b.dataset.inboxDays;
    inboxSig = "";
    render();
  });

  // ---------- Calendar ----------
  // Tabs: "Personal calendar" (your own Outlook, read-only) for everyone, as a
  // List or a Month grid; and for Leadership logins, "HR global calendar"
  // (the published Outlook link from /admin.html) and "Who's in office"
  // (status per person per weekday). The server checks Leadership too.
  var calDays = 14;
  var calTab = "personal";
  var calMode = "list";            // list | month
  var calMonth = today.slice(0, 7) + "-01";
  var whoWeek = today;
  var hrCal = null;                // { name, url } once loaded
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function shiftDays(s, n) { var d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); }
  function shiftMonths(s, n) { var d = new Date(s + "T00:00:00"); d.setDate(1); d.setMonth(d.getMonth() + n); return ymd(d); }

  function renderCalendar() {
    if (!me.leadership) calTab = "personal";
    setBreadcrumb(["Tools", "Calendar", { personal: "Personal", hr: "HR global", whos: "Who's in office" }[calTab]]);
    var hrName = (hrCal && hrCal.name) || "HR global calendar";
    var tabList = [["personal", "Personal calendar"]].concat(me.leadership ? [["hr", hrName], ["whos", "Who's in office"]] : []);
    var tabs = tabList.length > 1 ? '<div class="tabs" role="tablist">' + tabList.map(function (t) {
      return '<button type="button" role="tab" class="tab ' + (calTab === t[0] ? "active" : "") + '" aria-selected="' + (calTab === t[0]) + '" data-cal-tab="' + t[0] + '">' + E(t[1]) + "</button>";
    }).join("") + "</div>" : "";
    var intro, body;
    if (calTab === "hr" && hrCal && !hrCal.hasFeed) {
      intro = introBlock("The HR calendar, published from Outlook.", "");
      body = '<div id="cal-hr" style="margin-top:18px;"><div class="empty">Loading…</div></div>';
      setTimeout(loadHrCalendar, 0);
    } else if (calTab === "whos") {
      intro = introBlock("Who's in, out or remote each weekday — from people's own Outlook (Out of office / Working elsewhere) and the HR calendar. Status only; no event details.",
        '<div class="co-wrap"><div class="eyebrow">Week</div><div class="cos"><button type="button" class="co" data-who-week="-7" aria-label="Previous week">‹</button>' +
        '<button type="button" class="co active" data-who-week="0">' + E(weekLabel(whoWeek)) + '</button><button type="button" class="co" data-who-week="7" aria-label="Next week">›</button></div></div>');
      body = '<div id="cal-who" style="margin-top:18px;"><div class="empty">Loading…</div></div>';
      setTimeout(loadWhosIn, 0);
    } else {
      var picker = '<div class="co-wrap"><div class="eyebrow">View</div><div class="cos">' +
        '<button type="button" class="co ' + (calMode === "list" ? "active" : "") + '" data-cal-mode="list">List</button>' +
        '<button type="button" class="co ' + (calMode === "month" ? "active" : "") + '" data-cal-mode="month">Month</button></div>' +
        (calMode === "list"
          ? '<div class="cos">' + [7, 14, 28].map(function (d) {
              return '<button type="button" class="co ' + (d === calDays ? "active" : "") + '" data-cal-days="' + d + '">' + (d === 7 ? "1 week" : d / 7 + " weeks") + "</button>";
            }).join("") + "</div>"
          : '<div class="cos"><button type="button" class="co" data-cal-month="-1" aria-label="Previous month">‹</button><button type="button" class="co active" data-cal-month="0">' +
            E(new Date(calMonth + "T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" })) + '</button><button type="button" class="co" data-cal-month="1" aria-label="Next month">›</button></div>') +
        "</div>";
      var isHr = calTab === "hr";
      intro = introBlock(isHr
        ? "The HR calendar, read from its Outlook feed. View only — updates every few minutes."
        : "Your Outlook calendar, straight from Microsoft 365. Read-only — nothing here changes your calendar.", picker);
      var title = isHr ? hrName : "Your calendar";
      body = '<div class="section-title"><div><h2>' + E(title) + '</h2><span class="small-note" id="cal-note">Loading…</span></div></div>' +
        (calMode === "month" ? '<div id="cal-month"></div>' : '<div id="cal-mine"></div>');
      setTimeout(calMode === "month" ? loadMonth : loadCalendar, 0);
    }
    if (me.leadership && !hrCal) setTimeout(loadHrName, 0);
    return intro + tabs + body;
  }
  function introBlock(text, right) {
    return '<div class="intro"><div><div class="eyebrow">Tools</div><h1>Calendar</h1><p>' + E(text) + "</p></div>" + right + "</div>";
  }
  function dayKey(e) { return e.allDay ? e.start : ymd(new Date(e.start)); }
  function timeOf(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
  function calError(boxSel, err) {
    var box = $(boxSel);
    if (!box) return;
    var note = $("#cal-note");
    if (note) note.textContent = "";
    box.innerHTML = '<div class="banner">' + E(err.message) + "</div>";
  }

  // ---- Quiet auto-update ----
  // Every few minutes the open calendar tab re-checks its data and redraws
  // only that part of the page, and only if something changed. Paused while
  // the browser tab is hidden; the embedded Outlook page is never reloaded.
  var CAL_POLL_MS = 3 * 60 * 1000;
  var calLast = {};
  function calKey(kind) { return [kind, calTab, calDays, calMonth, whoWeek].join("|"); }
  function unchanged(key, data, quiet) {
    var sig = JSON.stringify(data);
    var same = calLast[key] === sig;
    calLast[key] = sig;
    return quiet && same;
  }
  function quietCalendarRefresh() {
    if (page !== "calendar" || document.hidden || !me) return;
    if (calTab === "whos") loadWhosIn(true);
    else if (calTab === "hr" && hrCal && !hrCal.hasFeed) return;
    else if (calMode === "month") loadMonth(true);
    else loadCalendar(true);
  }
  setInterval(quietCalendarRefresh, CAL_POLL_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) quietCalendarRefresh(); });

  // HR calendar entries carry company / holiday tags from the server.
  var CO_NAME = { SOI: "SOI", CAS: "CAS", RedSun: "Red Sun", NanoTech: "Nanotech", Global: "Global" };
  var calColorsNow = null;
  function evStyle(e) {
    if (!calColorsNow || calTab !== "hr") return { cls: "", style: "", tip: "" };
    var color = e.holiday ? (e.company ? calColorsNow[e.company] : calColorsNow.holiday) : e.company ? calColorsNow[e.company] : "";
    var tip = e.holiday ? "Holiday" + (e.company ? " · " + CO_NAME[e.company] : "") : e.company ? CO_NAME[e.company] : e.ambiguous ? "Couldn't tell which company — use full names in /admin.html" : "";
    return { cls: (color ? " co-ev" : "") + (e.holiday ? " holiday" : ""), style: color ? ' style="--co:' + E(color) + '"' : "", tip: tip };
  }
  function calLegend() {
    if (!calColorsNow || calTab !== "hr") return "";
    return '<div class="cal-legend">' + ["SOI", "CAS", "RedSun", "NanoTech", "Global"].map(function (k) {
      return '<span><i style="background:' + E(calColorsNow[k]) + '"></i>' + E(CO_NAME[k]) + "</span>";
    }).join("") + '<span><i class="hol" style="--co:' + E(calColorsNow.holiday) + '"></i>Holiday / closed</span></div>';
  }

  // ---- Personal: list ----
  // Personal and HR tabs share the List / Month views; only the source differs.
  function calSource() { return calTab === "hr" ? "/api/calendar/hr" : "/api/calendar/me"; }
  function loadCalendar(quiet) {
    var key = calKey("list");
    api(calSource() + "?start=" + today + "&days=" + calDays).then(function (data) {
      var box = $("#cal-mine");
      if (!box || unchanged(key, data, quiet)) return;
      calColorsNow = data.colors || null;
      // An event shows on every day it covers from today on — so something
      // that started earlier and is still going (e.g. a week of OOO) is listed.
      var lastShown = shiftDays(today, calDays - 1);
      var byDay = {};
      var events = data.events.filter(function (e) {
        var first = dayKey(e);
        var last = e.allDay ? shiftDays(e.end, -1) : ymd(new Date(new Date(e.end).getTime() - 1));
        if (last < first) last = first;
        var shown = false;
        for (var d = first < today ? today : first; d <= last && d <= lastShown; d = shiftDays(d, 1)) {
          (byDay[d] = byDay[d] || []).push(e);
          shown = true;
        }
        return shown;
      });
      $("#cal-note").textContent = events.length + " event" + (events.length === 1 ? "" : "s") + " in the next " + (calDays === 7 ? "week" : calDays / 7 + " weeks") + " · times in your time zone";
      if (!events.length) { box.innerHTML = '<div class="card empty">Nothing on ' + (calTab === "hr" ? "the HR calendar" : "your calendar") + ".</div>"; return; }
      box.innerHTML = calLegend() + Object.keys(byDay).sort().map(function (day) {
        var label = new Date(day + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
        return '<div class="card" style="margin-bottom:14px;"><div class="card-label" style="margin-bottom:10px;">' + E(day === today ? "Today · " + label : label) + "</div>" +
          byDay[day].map(function (e) {
            var lastDay = e.allDay ? shiftDays(e.end, -1) : "";
            var when = e.allDay
              ? (lastDay > e.start ? "All day · through " + new Date(lastDay + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : "All day")
              : timeOf(e.start) + " – " + timeOf(e.end);
            var link = safeLink(e.webLink);
            var join = safeLink(e.joinUrl);
            var st = evStyle(e);
            return '<div class="cal-event' + (e.allDay ? " all-day" : "") + st.cls + '"' + st.style + (st.tip ? ' title="' + E(st.tip) + '"' : "") + '><span class="cal-time">' + E(when) + "</span>" +
              "<strong>" + (e.holiday ? "★ " : "") + E(e.subject) + "</strong>" + (st.tip && !e.holiday && e.company ? ' <span class="co-tag">' + E(CO_NAME[e.company]) + "</span>" : "") +
              (e.location ? ' <span class="small-note">· ' + E(e.location) + "</span>" : "") +
              (e.organizer ? ' <span class="small-note">· ' + E(e.organizer) + "</span>" : "") +
              '<span class="cal-links">' + (join ? '<a href="' + E(join) + '" target="_blank" rel="noopener noreferrer">Join ↗</a>' : "") +
              (link ? '<a href="' + E(link) + '" target="_blank" rel="noopener noreferrer">Open in Outlook ↗</a>' : "") + "</span></div>";
          }).join("") + "</div>";
      }).join("");
    }).catch(function (err) { if (!quiet) calError("#cal-mine", err); });
  }

  // ---- Personal: month grid (weeks start on Sunday) ----
  function loadMonth(quiet) {
    var key = calKey("month");
    var first = new Date(calMonth + "T00:00:00");
    var gridStart = shiftDays(calMonth, -first.getDay());
    var month = calMonth.slice(0, 7);
    api(calSource() + "?start=" + gridStart + "&days=42").then(function (data) {
      var box = $("#cal-month");
      if (!box || unchanged(key, data, quiet)) return;
      calColorsNow = data.colors || null;
      var byDay = {};
      data.events.forEach(function (e) {
        // An all-day event can span several days; show it on each.
        if (e.allDay) {
          for (var d = e.start; d < e.end; d = shiftDays(d, 1)) (byDay[d] = byDay[d] || []).push(e);
        } else (byDay[dayKey(e)] = byDay[dayKey(e)] || []).push(e);
      });
      var inMonth = data.events.filter(function (e) { return dayKey(e).slice(0, 7) === month; }).length;
      $("#cal-note").textContent = inMonth + " event" + (inMonth === 1 ? "" : "s") + " this month · times in your time zone";
      var head = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(function (d) { return '<div class="mg-dow">' + d + "</div>"; }).join("");
      var cells = "";
      for (var i = 0; i < 42; i++) {
        var day = shiftDays(gridStart, i);
        var evs = byDay[day] || [];
        // First three show; the rest are there but hidden until "+N more".
        var shown = evs.map(function (e, n) {
          var link = safeLink(e.webLink);
          var label = (e.allDay ? "" : timeOf(e.start) + " ") + e.subject;
          var st = evStyle(e);
          var inner = '<span class="mg-ev' + (e.allDay ? " all-day" : "") + st.cls + (n >= 3 ? " mg-extra" : "") + '"' + st.style + ' title="' + E(label + (st.tip ? " — " + st.tip : "")) + '">' + (e.holiday ? "★ " : "") + E(label) + "</span>";
          return link ? '<a href="' + E(link) + '" target="_blank" rel="noopener noreferrer"' + (n >= 3 ? ' class="mg-extra"' : "") + ">" + inner + "</a>" : inner;
        }).join("");
        var more = evs.length > 3 ? '<button type="button" class="mg-more" data-mg-more="' + (evs.length - 3) + '" aria-expanded="false">+' + (evs.length - 3) + " more</button>" : "";
        var hol = calTab === "hr" && evs.some(function (e) { return e.holiday; });
        cells += '<div class="mg-cell' + (day.slice(0, 7) !== month ? " out" : "") + (day === today ? " today" : "") + (hol ? " holiday-day" : "") + '"><span class="mg-num">' + Number(day.slice(8)) + "</span>" + shown + more + "</div>";
      }
      box.innerHTML = calLegend() + '<div class="month-grid">' + head + cells + "</div>";
    }).catch(function (err) { if (!quiet) calError("#cal-month", err); });
  }

  document.addEventListener("click", function (e) {

  // ---- Who's in office (Leadership) ----
  function weekLabel(d) {
    var mon = shiftDays(d, -((new Date(d + "T00:00:00").getDay() + 6) % 7));
    var fri = shiftDays(mon, 4);
    var f = function (s) { return new Date(s + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
    return f(mon) + " – " + f(fri);
  }
  // At a glance: one day (today, or pick a weekday) as groups of people —
  // In the office, Remote, Part of the day, Out — above the full week table.
  var whoDay = "", whoData = null;
  function whoGlance(data) {
    if (whoDay && data.days.indexOf(whoDay) === -1) whoDay = "";
    var day = whoDay || (data.days.indexOf(today) !== -1 ? today : data.days[0]);
    var groups = { in: [], remote: [], part: [], out: [], unknown: [] };
    data.people.forEach(function (p) {
      var st = p.days[day] || {};
      if (p.error) groups.unknown.push({ p: p, note: "Calendar not readable" });
      else if (st.status === "unknown") return; // HR-calendar-only person with no entry that day
      else if (st.partial) groups.part.push({ p: p, note: (st.status === "out" ? "Out " : "Remote ") + (st.note || "") });
      else (groups[st.status] || groups.in).push({ p: p, note: "" });
    });
    var initials = function (n) {
      var parts = String(n).replace(/[._@-]+/g, " ").trim().split(/\s+/);
      return ((parts[0] || "?")[0] + (parts.length > 1 ? parts[parts.length - 1][0] : (parts[0] || "")[1] || "")).toUpperCase();
    };
    var colors = data.colors || {};
    var chip = function (x) {
      var co = x.p.company, bg = co && colors[co];
      var tip = x.p.username + (co ? " · " + (CO_NAME[co] || co) : x.p.ambiguous ? " · company unclear (same first name at two companies)" : "") + (x.note ? " — " + x.note : "");
      return '<span class="person-chip" title="' + E(tip) + '"><span class="av' + (bg ? " by-co" : "") + '" aria-hidden="true"' + (bg ? ' style="background:' + E(bg) + '"' : "") + ">" + E(initials(x.p.username)) + "</span>" +
        E(x.p.username) + (x.note ? " <small>" + E(x.note.trim()) + "</small>" : "") + "</span>";
    };
    var group = function (id, label, emptyText) {
      var list = groups[id];
      if (id === "unknown" && !list.length) return "";
      if (id === "part" && !list.length) return "";
      return '<div class="glance-group ' + id + '"><h3>' + E(label) + " <b>" + list.length + '</b></h3><div class="glance-people">' +
        (list.length ? list.map(chip).join("") : '<span class="glance-empty">' + E(emptyText) + "</span>") + "</div></div>";
    };
    var dayLabel = function (d) { return new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric" }); };
    var legend = '<div class="cal-legend" style="margin:0 0 12px;">' + ["SOI", "CAS", "RedSun", "NanoTech", "Global"].map(function (k) {
      return colors[k] ? '<span><i style="background:' + E(colors[k]) + ';border-radius:50%"></i>' + E(CO_NAME[k]) + "</span>" : "";
    }).join("") + "</div>";
    return '<div class="glance"><div class="glance-head"><h2>' + (day === today ? "Today" : E(new Date(day + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }))) + "</h2>" +
      '<div class="seg">' + data.days.map(function (d) {
        return '<button type="button" data-who-day="' + d + '" class="' + (d === day ? "active" : "") + '">' + (d === today ? "Today" : E(dayLabel(d))) + "</button>";
      }).join("") + "</div></div>" +
      legend + '<div class="glance-groups">' + group("in", "In the office", "Nobody yet") + group("remote", "Remote", "Nobody") + group("part", "Part of the day", "") +
      group("out", "Out", "Nobody") + group("unknown", "Couldn't check", "") + "</div></div>";
  }
  function drawWhosIn() { if (whoData) drawWhosInData(whoData); }
  function loadWhosIn(quiet) {
    var key = calKey("whos");
    api("/api/calendar/whos-in?week=" + whoWeek).then(function (data) {
      var box = $("#cal-who");
      if (!box || unchanged(key, data, quiet)) return;
      whoData = data;
      drawWhosInData(data);
    }).catch(function (err) { if (!quiet) calError("#cal-who", err); });
  }
  function drawWhosInData(data) {
      var box = $("#cal-who");
      if (!box) return;
      var counts = data.days.map(function (d) {
        return data.people.filter(function (p) { return !p.error && p.days[d].status === "in"; }).length;
      });
      var cell = function (s) {
        if (s.status === "unknown") return '<span class="dim" title="Not in the tracker yet, so only HR calendar entries are known">—</span>';
        if (s.status === "in") return '<span class="who in">In office</span>';
        var label = s.status === "out" ? "Out" : "Remote";
        return '<span class="who ' + s.status + '">' + label + (s.partial ? " · " + E(s.note) : "") + "</span>" +
          (s.sources && s.sources.indexOf("hr") !== -1 ? '<span class="co-note" style="padding:2px 0 0">HR calendar</span>' : "");
      };
      box.innerHTML = (data.hrError ? '<div class="banner">' + E(data.hrError) + "</div>" : "") +
        (!data.hrConnected && !data.hrError ? '<div class="banner">Only people\'s own Outlook is checked. To include the HR calendar, add its <b>ICS</b> link under <b>HR global calendar</b> in /admin.html.</div>' : "") +
        whoGlance(data) +
        '<div class="section-title"><div><h2>Everyone this week</h2></div></div>' +
        '<div class="table-wrap"><table class="plain narrow"><thead><tr><th>Person</th>' + data.days.map(function (d, i) {
          var label = new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
          return '<th class="' + (d === today ? "who-today" : "") + '">' + E(label) + '<br><span style="text-transform:none;letter-spacing:0;font-weight:400;">' + counts[i] + " in office</span></th>";
        }).join("") + "</tr></thead><tbody>" +
        data.people.map(function (p) {
          var dot = p.company && data.colors && data.colors[p.company] ? '<span class="co-dot" style="background:' + E(data.colors[p.company]) + '" title="' + E(CO_NAME[p.company]) + '"></span>' : "";
          return "<tr><td>" + dot + "<strong>" + E(p.username) + "</strong>" +
            (p.company && p.company !== "SOI" ? ' <span class="co-tag">' + E(CO_NAME[p.company]) + "</span>" : "") +
            (p.hrOnly ? '<span class="co-note" style="padding:2px 0 0">From the HR calendar · no login yet</span>' : "") + (p.error ? '<span class="co-note" style="padding:2px 0 0;color:var(--danger)">' + E(p.error) + "</span>" : "") + "</td>" +
            data.days.map(function (d) { return '<td class="' + (d === today ? "who-today" : "") + '">' + (p.error && p.days[d].status === "in" ? '<span class="dim">—</span>' : cell(p.days[d])) + "</td>"; }).join("") + "</tr>";
        }).join("") + "</tbody></table></div>" +
        '<p class="small-note" style="margin-top:12px;">In office = nothing marked Out of office or Working elsewhere on their Outlook, and no matching entry on the HR calendar. ' +
        "People named on the HR calendar without a login are listed too, from the HR calendar only (— on days it doesn't mention them). Days are in " + E(data.timeZone) + ". Updates every few minutes.</p>";
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-who-day]");
    if (!b) return;
    whoDay = b.dataset.whoDay;
    drawWhosIn();
  });

  // ---------- After each render: charts and focus ----------
  function afterRender() {
    if (page === "overview") drawOverviewCharts();
    if (focusAfter) {
      var el = document.querySelector('#view [data-id="' + focusAfter.id + '"][data-key="' + focusAfter.key + '"]');
      if (el) el.focus();
      focusAfter = null;
    }
