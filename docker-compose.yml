version: "3.8"

services:
  soi-tracker:
    build: .
    # A second copy (staging) sets CONTAINER_NAME and HOST_PORT so it can run
    # beside the live one on the same host.
    container_name: ${CONTAINER_NAME:-soi-tracker}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-443}:443"
    volumes:
      - soi-tracker-certs:/app/certs
    environment:
      PORT: "443"
      SERVER_IP: ${SERVER_IP}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-soi-tracker}
      # Staging only: read anything missing under S3_PREFIX from this prefix
      # (normally the live one, "soi-tracker"). Writes still go to S3_PREFIX,
      # so live data is never changed. Leave unset on the live stack.
      SEED_FROM_PREFIX: ${SEED_FROM_PREFIX:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Only needed if this host does NOT already have an IAM role attached
      # (e.g. an EC2 instance profile). If it does, leave these two unset.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Draft with AI and Chat with AOG: Claude on Amazon Bedrock in this AWS account
      # (same credentials as S3). Needs the model enabled under Bedrock →
      # Model access and bedrock:InvokeModel for this host's role.
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-sonnet-5-5}
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      # Microsoft Graph — task-assignment emails. Leave unset to skip emails.
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_FROM_EMAIL: ${MS_FROM_EMAIL:-}
      # Mailbox the IT request form's Power Automate flow emails ("[IT Request]"
      # subjects); each new one becomes an IT task. Needs Mail.Read.
      IT_REQUESTS_MAILBOX: ${IT_REQUESTS_MAILBOX:-}
      # Office time zone for the "Who's in office" board (Windows or IANA name).
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE:-Pacific Standard Time}
      # Improvements: who manages requests (usernames or login emails, comma
      # separated; default in improvements.js). Emails: extra internal domains.
      IMPROVEMENTS_OWNERS: ${IMPROVEMENTS_OWNERS:-}
      INTERNAL_DOMAINS: ${INTERNAL_DOMAINS:-}
      # Pentagon query API
      PENTAGON_API_URL: ${PENTAGON_API_URL:-}
      PENTAGON_API_KEY: ${PENTAGON_API_KEY:-}

volumes:
  soi-tracker-certs:
